toy-shape:
  prompt: "把一张 6 × 6 的图片切成大小为 2 的图块（每个图块 2 × 2 像素）。token 矩阵（token 数，每个 token 的数的个数）的形状是什么？"
  after: "横着 3 个图块，竖着 3 个，一共 9 个 token，每个有 2 × 2 = 4 个像素。"
  hints:
    - "这是图块的网格，横着 3 个、竖着 3 个。数一数一共有多少个图块，以及每个图块里有多少像素。"
    - "这是把“2 × 2”理解成 2 × 2 的网格，切成 4 块，每块 9 个像素。这里 2 是图块大小：每个图块是 2 × 2 像素。6 个像素宽能放下几个这样的图块？"
    - "那就成了每个 token 一个像素。每个 token 装的是一整个 2 × 2 的图块。"
    - ["数横向的图块：6 个像素里能放下几个 2 像素宽的图块？", "行是 token，每个图块一行：横向图块数 × 纵向图块数。列是一个图块里的像素。"]

tokens-28:
  prompt: "把一张 28 × 28 的数字图片切成大小为 7 的图块（每个图块 7 × 7 像素）。一共有多少个 token？"
  after: "28 / 7 = 4，横着 4 个图块，竖着 4 个，所以是 16 个 token，每个有 49 个数。"
  hints:
    - "这是一行图块。一共有 4 行。"
    - "49 会是 7 × 7 的图块网格，或者是一个图块里的像素数。这里 7 是图块大小：28 个像素宽能放下几个 7 像素的图块？"
    - ["28 个像素宽能放下几个 7 像素的图块？", "横向图块数乘以纵向图块数。"]

halve-patch:
  prompt: "在 28 × 28 的图片上，把图块大小从 4 改成 2。每一层的注意力分数个数会怎样？"
  options: ["变成 2 倍", "变成 4 倍", "变成 16 倍"]
  hints:
    - "4 倍是 token 的个数。注意力要给每个 token 和每个 token 都打分。token × token 会怎样？"
    - "图块大小减半，两个方向上都减半。图块多了几倍？再想想每个 token 都要给每个 token 打分。"
  reveal: "变成 16 倍。token 从 49 个变成 196 个，是 4 倍。注意力要把每个 token 和每个 token 都比一遍，所以分数从 49 × 49 = 2,401 变成 196 × 196 = 38,416。图块越小，看到的细节越细，但代价随 token 数的平方增长。"

split-axes:
  prompt: "图块大小为 p 时，把 (H, W) 图片的每个轴拆成（哪一块，块里的哪个像素）。"
  template: |
    def split(x, p):
        H, W = x.shape
        return x.reshape(____)

    img = np.arange(16).reshape(4, 4)
    x4 = split(img, 2)
    print(x4[0, :, 1, :])   # 应该是右上角的图块 [[2, 3], [6, 7]]
  tests:
    - "第 0 行块、第 1 列块是右上角的图块"
    - "28 × 28 的数字图片、图块大小 7：两个方向各是 4 块，每块 7"
  hints:
    - ["四个尺寸相乘必须等于 H × W。", "行被拆成每块 p 行。H 行里能放下几块（取整数）？"]
    - ["四个数，按上面注释里的顺序：(块的行号, 块内的行, 块的列号, 块内的列)。", "用 4 × 4 的图片和 p = 2 检查：四个尺寸都是 2。哪些尺寸来自高度，哪些来自宽度，哪些是图块大小？", "用整数除法：28 // 7 = 4。"]
  after: "reshape 让数保持阅读顺序，只是重新分组。把 H 拆成 (H // p, p) 的意思是：哪一块行，以及块里的哪一行。列也同样拆分，于是每个像素现在有四个坐标。"

patchify:
  prompt: "写出 patchify：(H, W) 的图片 → (图块数, p·p)，图块从左到右、再从上到下排列。"
  tests:
    - "页面上 4 × 4 的例子"
    - "28 × 28 的数字图片，7 × 7 的图块"
    - "6 × 6 图片的第 1 个 token 是右上角的 3 × 3 图块"
  hints:
    - ["如果第 0 个 token 是 [0, 1, 2, 3]，说明你压平的是图片的行，而不是图块。压平之前，你把两个块轴挪到最前面了吗？", "三步连起来：上一题的拆分，然后 transpose 让块轴排在最前，然后 reshape 成 (图块数, p · p)。"]
    - "检查 reshape 的尺寸。拆分是 (H // p, p, W // p, p)；最后的 reshape 是 (-1, p * p)。"
    - ["从你上一题写的拆分开始。", "拆分之后，用 transpose 把顺序变成 (块的行号, 块的列号, 块内的行, 块内的列)，再用一次 reshape 把每个图块压平。"]
  after: "拆分之后，transpose(0, 2, 1, 3) 把 (块的行号, 块的列号) 放到最前面，于是同一个图块的像素挨在一起。最后的 reshape 把每个图块变成一行 p · p 个数：每个图块一个 token，从左到右，再从上到下。"

dit-shape:
  prompt: "在 28 × 28 的数字图片上用大小为 4 的图块，得到 49 个 token，每个 16 个数。Wᵢₙ 是 (16, 96)。tokens @ Wᵢₙ 的形状是什么？"
  after: "第 1 关的规则：(49, 16) @ (16, 96) → (49, 96)。Transformer 块从头到尾都保持这个形状。"
  hints:
    - "这是 Wᵢₙ 本身。用 token (49, 16) 去乘它。"
    - "这是输入。两个 16 对上了，会消掉。"
    - ["第 1 关的规则：(n, k) @ (k, m) → (n, m)。", "这里是 (49, 16) @ (16, 96)。哪些数会消掉？"]

scores-49:
  prompt: "有 49 个 token 时，一个头在一层里要算多少个注意力分数？"
  after: "49 × 49 = 2,401：每个 token 都给每个 token 打分，包括它自己。"
  hints:
    - "不是 49 + 49。49 个 token 中的每一个，都要给全部 49 个 token 打分。"
    - "这是一行分数。每个 token 一行。"
    - ["每个 token 都给每个 token 算一个分数，包括它自己。", "这些分数组成一张表，每个 token 占一行、一列。"]

latent-ratio:
  prompt: "自编码器把 784 个像素压成 16 个数。扩散要处理的数少了多少倍？"
  after: "784 / 16 = 49。采样的每一步现在都只作用在 16 个数上，而不是 784 个。"
  hints:
    - "这是 784 − 16。“少了多少倍”问的是比值：要用除法。"
    - ["“少了多少倍”问的是比值。", "用像素数除以编码的大小。"]

code-scale:
  prompt: "这 16 个编码数的标准差大约是 4。支线 D1 的公式要求干净数据的方差为 1，也就是标准差为 1。你先把每个编码数都除以同一个数。是哪个数？"
  after: "除以 4。标准差为 4 的数除以 4，标准差就是 1，方差也是 1。采样之后，在解码之前再乘回 4。"
  hints:
    - "16 是方差（4²）。除以 16 会让标准差变成 4 / 16 = 0.25。你想让标准差变成 1。"
    - "除以 √4 = 2，标准差还剩 4 / 2 = 2。要除以标准差本身。"
    - ["一个数除以 c，它的标准差也除以 c。", "标准差是 4。c 取多少能让 4 / c = 1？"]

walk:
  prompt: "一个自编码器把每张 28 × 28 的数字图片变成 16 个数的编码，它的解码器再把编码变回图片。取一个 3 和一个 7，从一个走到另一个，走到一半。混合像素得到的结果，和混合两个编码再解码得到的结果相比，是怎样的？"
  options: ["两者看起来都是 3 和 7 的同一种平滑过渡", "像素：一个淡淡的 3 和 7 叠在一起。编码：一个介于两者之间的数字", "像素：一个介于两者之间的数字。编码：一个淡淡的 3 和 7 叠在一起"]
  hints:
    - "混合像素就是逐格平均两张图。两张不同的画平均之后是什么样子？"
    - "混合像素是逐格平均两张图，所以两幅画都还看得见。解码器拿到一个介于两个编码中间的编码，会怎么做？"
  reveal: "混合像素只是平均两张图，所以两个都看得见，各自只有一半的浓度。混合编码则是在解码器学到的“数字长什么样”里移动，所以每一步都解码成一个像数字的形状。在实验台里拖动滑块看看。"

boss-sampler:
  prompt: "写出采样循环。`eps_exact` 是这个 8 点圆环的完美噪声猜测。每个样本都必须落在 8 个点中的某一个上，而且 8 个点都要出现。"
  template: |
    T = 50
    betas = np.linspace(1e-3, 0.2, T)          # beta_1 .. beta_T（下标 0 是 t = 1）
    alphas = 1 - betas
    alpha_bar = np.cumprod(alphas)
    angles = np.arange(8) * np.pi / 4
    targets = np.stack([np.cos(angles), np.sin(angles)], 1)   # 圆环上的 8 个点

    def eps_exact(x, t):
        """The best possible noise guess for this dataset. You don't need to change it."""
        ab = alpha_bar[t - 1]
        d = ((x[:, None, :] - np.sqrt(ab) * targets[None]) ** 2).sum(-1)   # (n, 8)
        # 每个目标点的可能性有多大
        w = softmax(-d / (2 * (1 - ab)), axis=1)
        # 干净点的期望
        x0 = w @ targets
        return (x - np.sqrt(ab) * x0) / np.sqrt(1 - ab)

    def sample(n, seed=0):
        rng = np.random.default_rng(seed)
        x = rng.normal(size=(n, 2))                # 纯噪声
        for t in range(T, 0, -1):                  # t = 50, 49, ..., 1
            eps = eps_exact(x, t)
            ____
        return x

    x = sample(8)
    print(np.round(x, 3))
  tests:
    - "5 个样本，每个 2 个数"
    - "走完一步（t = 50）后：和支线 D2 的反向一步得到的点相同"
    - "从 t = 50 到 2 的每一步之后：都和反向一步得到的点相同"
    - "最后一步（t = 1）之后：和反向一步得到的点相同，那一步不加噪声"
    - "300 个样本中的每一个都落在离某个圆环点 0.05 以内"
    - "8 个圆环点全都用到了"
  hints:
    - "用模板里的名字：betas、alphas、`alpha_bar`、eps、rng。用 t - 1 做下标，因为下标 0 是 t = 1。"
    - ["第一步（t = 50）之后，你的点和反向一步的结果不一样。打印循环跑一遍之后的 x。", "这一步是先算均值，再加噪声。把你的均值和支线 D2 第 1 节的第一个公式逐项对照：eps 前面的那个数用的是 beta 和 alpha-bar，然后除以这一步的 alpha。下标 0 是 t = 1。", "然后是噪声：从 rng 里抽（rng 是 sample 开头建的那个生成器，不是 np.random），形状和 x 一样，再乘以 betas[t - 1] 的平方根。"]
    - ["第一步对了，但后面某一步不对。你的循环里有没有什么东西依赖于 t 的具体值？", "每一步都用同一个公式，下标是 t - 1；只要 t > 1，每一步都要加噪声。"]
    - ["最后一步之前的每一步都对了；只有最后一步 t = 1 不对。", "在最后一步，反向一步只给出均值：t == 1 时不加噪声。"]
    - ["循环体就是支线 D2 的反向一步，一次作用在所有点上。", "两部分：均值（用 betas[t - 1]、`alpha_bar`[t - 1]、alphas[t - 1]；下标 0 是 t = 1），然后是从 rng 抽的新噪声，但只在 t > 1 时加。"]
  after: "每一步都减去按 beta 和 alpha-bar 缩放的猜测噪声，再除以 √alpha。除了最后一步，每一步都加新噪声，让每次运行走自己的路径，于是中间各步的点和正向过程里一样散开。这里的噪声猜测是精确的，所以即使不加噪声，大多数点也能到达圆环。正因如此，测试会在每一步之后都把你的点和反向一步本身作比较。"

boss-line:
  prompt: "Boss 关第 2 部分。把 boss.py 针对你自己写的 `add_noise`、guide 和 `step_back` 打印出的 PASS 那一行，粘贴到引号之间。"
  template: |
    line = "____"      # 它长这样：D3 PASS 0.900 1a2b3c4d
    print(line)
  tests:
    - "boss.py 打印的 PASS 行：D3 PASS、分数、代码"
    - "代码和分数对得上：这一行没被改过"
    - "分数至少 0.7（70%）"
  hints:
    - "粘贴整行，四个部分都要有：D3、PASS、分数和代码。"
    - ["从 /files/latents-and-dit/boss.py 下载 boss.py，补完三个标着 TODO 的函数，然后在同一个文件夹里运行 python boss.py。", "复制以 D3 PASS 开头的那一整行，粘贴到引号之间。"]
    - "代码和分数对不上。照 boss.py 打印的样子重新复制这一行，不要改动。"
    - "把 boss.py 打印的整行粘贴到引号之间。"
  after: "一个小小的 Transformer 用你的噪声、你的引导和你的反向一步，画出了另一个分类器认得出的数字。行末的代码只能说明这一行是原样粘贴的；这一部分靠你的诚实。"
