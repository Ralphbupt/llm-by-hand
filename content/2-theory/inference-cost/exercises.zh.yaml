kv-full:
  prompt: "一个模型有 32 层、32 个注意力头，dₖ = 128，每个头都有自己的 K 和 V。每个数占 2 字节。一个 token 需要多少 KiB 的 KV 缓存？（1 KiB = 1,024 字节）"
  after: "2 × 32 × 128 × 32 × 2 = 524,288 字节 = 每个 token 512 KiB。一段 4,000 个 token 的对话大约需要 2,000,000 KiB，差不多 2 GiB，这还只是一个用户。"
  hints:
    - "别忘了 K 和 V 的那个 2：每个 token 两样都要存。"
    - "这是字节数。再除以 1,024。"
    - "那是 8 个 K/V 头的情况。这里 32 个头每个都有自己的 K 和 V。"
    - ["在每一层、每个头里，一个 token 存一个 k 向量和一个 v 向量，各有 dₖ 个数。", "相乘：2（k 和 v）× 头数 × dₖ × 层数 × 2 字节。然后除以 1,024。"]

gqa-head:
  prompt: "一个模型有 32 个查询头和 8 个 K/V 头，都从 0 开始编号；相邻的查询头共用一个 K/V 头。查询头 13 用的是哪个 K/V 头？"
  after: "每个 K/V 头服务 32 / 8 = 4 个查询头：0–3 用 KV0，4–7 用 KV1，8–11 用 KV2，12–15 用 KV3。所以 13 // 4 = 3。"
  hints:
    - "那是每个查询头一个 K/V 头的情况。这里每个 K/V 头由 4 个查询头共用。"
    - "每组大小是 32 / 8 = 4，不是 8。用 13 除以 4，去掉余数。"
    - ["每个 K/V 头由几个查询头共用？", "每个 K/V 头按顺序服务 32 / 8 个查询头。从 0 开始数组，头 13 在哪一组（每组 4 个）？"]

gqa-quality:
  prompt: "先猜一猜：把 K/V 头从 32 个减到 1 个（32 个查询头共用一份 K 和一份 V），KV 缓存缩小到 1/32。质量会怎样？"
  options: ["不变：不管怎样，K 和 V 存的信息都一样", "略有下降", "变差很多：查询头再也没法找不同的东西"]
  reveal: "只有 1 个 K/V 头时，质量略有下降：每个查询头都只能看同一份键和值。分成几组时，比如 8 个 K/V 头，质量几乎不降。用 8 个 K/V 头，第 1 节的每个 token 512 KiB 变成 128 KiB，少了 4 倍。所以大多数模型选的 K/V 头数在两个极端之间。"

kv-context:
  prompt: "一块 GPU 有 24 GiB 显存，模型的权重占了其中 16 GiB。剩下的放 KV 缓存。模型用分组查询注意力，有 4 个 K/V 头，dₖ = 128，32 层，每个数存成 2 字节。能放下多少个 token 的 KV 缓存？（1 KiB = 1,024 字节，1 GiB = 1,024 × 1,024 KiB）"
  promptShort: "24 GiB 的 GPU，权重占 16 GiB，剩下的给 KV 缓存。4 个 K/V 头，dₖ = 128，32 层，每个数 2 字节。能放下多少个 token 的缓存？"
  after: "每个 token：2 × 4 × 128 × 32 × 2 = 65,536 字节 = 64 KiB。空闲显存：24 − 16 = 8 GiB = 8,388,608 KiB。8,388,608 / 64 = 131,072 个 token。这些显存是所有用户共用的：同时 16 个用户，每人大约 8,000 个 token。K/V 头减半，能放下的 token 就翻倍。所以一块 GPU 服务很多用户时，分组查询注意力很重要。"
  hints:
    - "这用了全部 24 GiB。权重先占掉 16 GiB，只有剩下的才能给缓存。"
    - "这用的是每个 token 128 KiB，那是 8 个 K/V 头的大小。这个模型有 4 个 K/V 头。"
    - "多了一倍。你是不是漏掉了两个 2 中的一个：k 和 v，或者每个数 2 字节？"
    - "这用的是每个 token 512 KiB，好像每个查询头都存了自己的 K 和 V。这里只有 4 个 K/V 头存 K 和 V。"
    - "检查单位：空闲显存和每个 token 的大小必须都用 KiB（或者都用字节）。"
    - ["先像第 1 节那样算出一个 token 的 KV 缓存，但用 4 个 K/V 头。", "空闲显存是 24 − 16 = 8 GiB。把它换成 KiB，再除以每个 token 的 KiB 数。"]

flops-token:
  prompt: "一个模型有 70 亿个权重。一块 GPU 每秒做 10¹⁴ 个 FLOPs（100 万亿）。用前向传播的 2N 规则，只算算术的话，它每秒最多能产生多少个 token？"
  after: "一个 token 花 2 × 7 × 10⁹ = 1.4 × 10¹⁰ 个 FLOPs。于是 10¹⁴ / (1.4 × 10¹⁰) = 10⁴ / 1.4 ≈ 每秒 7,143 个 token。这只算了算术。第 4 节会把它和从显存读权重的时间作比较。"
  hints:
    - "这里每个权重只算了一次 FLOP。每个权重做一次乘法和一次加法，所以是 2N。"
    - "6N 是训练一步的代价。产生 token 只跑前向传播。"
    - ["先算一个 token 的 FLOPs：2 × 权重个数。", "一个 token 花 1.4 × 10¹⁰ 个 FLOPs。用 10¹⁴ 除以它：先把 10 的幂相减。", "10¹⁴ / (1.4 × 10¹⁰) = 10⁴ / 1.4。"]

flops-block:
  prompt: "一个块的模型宽度 d = 64，FFN 宽度 256。一个新 token 关注 L = 128 个 token。它的注意力需要两个乘积：分数 (1, 64) @ (64, 128)，和加权和 (1, 128) @ (128, 64)。这个 token 在整个块里花多少 FLOPs，权重和注意力合起来？"
  promptShort: "一个块：模型宽度 64，FFN 宽度 256，新 token 关注 128 个 token。这个 token 在块里花多少 FLOPs？（只算矩阵乘积。）"
  after: "权重部分：2 × (4 × 64² + 2 × 64 × 256) = 2 × 49,152 = 98,304。每个注意力乘积花 2 × 64 × 128 = 16,384，所以注意力部分是 32,768 = 4 × L × d。合计 131,072。只有注意力部分随上下文增长。"
  hints:
    - "这只是权重部分。再加上两个注意力乘积：分数和加权和。"
    - "注意力部分太小了。它有两个乘积，每个都花 2 × a × b 个 FLOPs。"
    - "这是注意力部分。再加上权重部分：四个 (d, d) 矩阵和两个 FFN 矩阵。"
    - "这里每个权重只算了一次 FLOP。每个权重做一次乘法和一次加法，所以权重部分要翻倍。"
    - ["分别算权重部分和注意力部分，再加起来。", "权重部分：2 × (4 × 64² + 2 × 64 × 256) = 98,304。分数是一个 (1, 64) @ (64, 128) 乘积：用 2 × a × b 规则。", "分数花 2 × 64 × 128 = 16,384 个 FLOPs。加权和是一个 (1, 128) @ (128, 64) 乘积。"]

flops-even:
  prompt: "一个块的模型宽度 64，FFN 宽度 256，所以它的权重部分是每个 token 98,304 个 FLOPs。它的注意力部分是 4 × L × 64 个 FLOPs。上下文长度 L 是多少时，两部分相等？"
  after: "4 × L × 64 = 98,304 得到 L = 384，正好是 2 × 64 + 256（模型宽度的两倍加 FFN 宽度）。低于它，权重花得更多；高于它，注意力花得更多。L = 1,280 时，注意力部分是 327,680，是权重部分的三倍多。"
  hints:
    - "L = 128 时注意力部分只有 32,768。解 4 × L × 64 = 98,304，求 L。"
    - "要除以 4 × 64 = 256，不是除以 64。"
    - ["让两部分相等：4 × L × 64 = 98,304。", "4 × 64 = 256。用 98,304 除以 256。"]

decode-predict:
  prompt: "算之前先猜：一块 GPU 每秒算 10¹⁴ 个 FLOPs，每秒从显存读 10¹² 字节。它用一个 70 亿权重的模型给一个用户写回答。是什么限制了速度？"
  options: ["算术：每个 token 1.4 × 10¹⁰ 个 FLOPs 很多", "从显存读权重", "两者花的时间差不多"]
  reveal: "读权重。一个 token 的算术花 1.4 × 10¹⁰ / 10¹⁴ s = 0.14 ms。读 14 GB 的权重要花 14 ms，长 100 倍。GPU 大部分时间都在等显存。"

decode-bound:
  prompt: "一个模型有 70 亿个权重，每个 2 字节。GPU 每秒从显存读 10¹² 字节，每个新 token 都必须把每个权重读一遍。对一个用户，它每秒最多能写多少个 token？（保留 1 位小数）"
  promptShort: "70 亿个权重，每个 2 字节。GPU 每秒读 10¹² 字节。一个用户：每秒最多多少个 token？（保留 1 位小数）"
  after: "权重是 7 × 10⁹ × 2 = 1.4 × 10¹⁰ 字节。读一遍要 1.4 × 10¹⁰ / 10¹² = 0.014 s。所以每秒最多 1 / 0.014 ≈ 71.4 个 token，比算术允许的 7,143 个少了大约 100 倍。"
  hints:
    - "这里忘了每个权重 2 字节。模型是 14 × 10⁹ 字节，不是 7 × 10⁹。"
    - "这是算术的上限。这里的限制是从显存读权重。"
    - ["先算出权重有多少字节。", "权重是 1.4 × 10¹⁰ 字节。以每秒 10¹² 字节的速度读一遍要多久？每读一遍出一个 token。"]

batch-even:
  prompt: "一个模型有 70 亿个权重，每个 2 字节。一步解码以每秒 10¹² 字节的速度读 1.4 × 10¹⁰ 字节的权重。每个用户的 token 花 1.4 × 10¹⁰ 个 FLOPs，速度是每秒 10¹⁴ 个 FLOPs。一步同时服务 B 个用户，只读一遍权重。B 是多少时，算术和读取花的时间一样长？"
  after: "不管 B 是多少，读取都花 0.014 s；算术花 B × 0.00014 s。B = 100 时两者相等。低于 100 个用户时，多一个用户几乎不花代价：GPU 每秒总共写 100 × 71.4 ≈ 7,143 个 token，而不是 71.4 个。超过 100 以后，限制变成算术，每个用户的 token 来得更慢。"
  hints:
    - "一个用户时，读取花的时间是算术的 100 倍。多少个用户的算术才和一次读取一样长？"
    - "你用算术时间除以了读取时间。应该用读取时间除以一个用户的算术时间。"
    - ["算出两个时间：一步的读取，和一个用户的 token 的算术。", "读取花 0.014 s，一个用户的算术花 0.00014 s。一次读取的时间里能放下多少个用户的算术？"]

batch-byte:
  prompt: "把 70 亿个权重每个存成 1 字节，而不是 2 字节。GPU 仍然每秒读 10¹² 字节，每个用户的 token 仍然花 1.4 × 10¹⁰ 个 FLOPs，速度是每秒 10¹⁴ 个 FLOPs。现在 B 是多少时，算术和读取花的时间一样长？"
  promptShort: "一个 70 亿权重的模型，每个权重存成 1 字节。GPU 每秒读 10¹² 字节、做 10¹⁴ 个 FLOPs，每个用户的 token 花 1.4 × 10¹⁰ 个 FLOPs。批大小 B 是多少时，算术和读取花的时间一样长？"
  after: "权重现在是 7 × 10⁹ 字节，所以读取花 0.007 s。一个用户的算术仍然花 0.00014 s。所以 B = 0.007 / 0.00014 = 50。每个权重的字节更少，每一步解码就更快。算术不变，所以交叉点从 100 个用户降到 50 个。一般地，B = 每个权重的字节数 × 每秒 FLOPs / (2 × 带宽)。N 被约掉了，所以交叉点取决于 GPU 和每个权重的字节数，与模型大小无关。"
  hints:
    - "这是每个权重 2 字节时的交叉点。用 1 字节时，读取只花一半时间。"
    - "读取变短了，不是变长了。每个权重 1 字节时，要读的字节更少。"
    - "你用算术时间除以了读取时间。应该用读取时间除以一个用户的算术时间。"
    - ["先算出新的读取时间。权重现在占多少字节？", "读取花 0.007 s，一个用户的算术花 0.00014 s。一次读取的时间里能放下多少个用户的算术？"]

prefill-time:
  prompt: "一个模型有 70 亿个权重，每个 2 字节。GPU 每秒读 10¹² 字节，每秒做 10¹⁴ 个 FLOPs。它用一次前向传播读一个 2,000 个 token 的提示词。权重读一遍（14 ms），每个 token 花 1.4 × 10¹⁰ 个 FLOPs。这一次前向传播要多少 ms？"
  after: "算术是 2,000 × 1.4 × 10¹⁰ = 2.8 × 10¹³ 个 FLOPs，2.8 × 10¹³ / 10¹⁴ = 0.28 s = 280 ms。这是 14 ms 读取的 20 倍，所以这次预填充受算术限制。一个提示词就像一步里有 2,000 个用户的一批。这对长提示词成立；下一题试一个短的。随提示词增长的注意力部分在这里大约多出 4%（d = 4096，32 层）。提示词有几万个 token 时，它就不小了。"
  hints:
    - "14 ms 是读取。2,000 个 token 的算术在同一次前向传播里完成，这一次花的是两个时间中较长的那个。"
    - "读取和算术是同时进行的。这一次花的是较长的那个，不是两者之和。"
    - "这是每个 token 读一遍权重，像解码那样。预填充时 2,000 个 token 共用一次读取。"
    - "这是秒。题目问的是 ms。"
    - ["算出两个时间：读取和算术。这一次花的是较长的那个。", "算术是 2,000 × 1.4 × 10¹⁰ = 2.8 × 10¹³ 个 FLOPs。除以每秒 10¹⁴ 个 FLOPs，再把秒换成 ms。"]

prefill-short:
  prompt: "同样的模型和 GPU：70 亿个权重，每个 2 字节，每秒读 10¹² 字节，每秒 10¹⁴ 个 FLOPs。现在提示词只有 50 个 token。预填充这一次要多少 ms？"
  promptShort: "一个 70 亿权重、每个权重 2 字节的模型，跑在每秒读 10¹² 字节、做 10¹⁴ 个 FLOPs 的 GPU 上。提示词有 50 个 token。预填充这一次要多少 ms？"
  after: "算术是 50 × 1.4 × 10¹⁰ = 7 × 10¹¹ 个 FLOPs，花 7 ms。读权重仍然要 14 ms，这一次花较长的那个时间：14 ms。50 个 token 的提示词就像第 4 节的 50 个用户。它低于这块 GPU 的交叉点 100，所以限制是读取。在这块 GPU 上，只有提示词超过大约 100 个 token 时，预填充才受算术限制。"
  hints:
    - "这是算术。权重仍然要读一遍，这一次花的是两个时间中较长的那个。"
    - "读取和算术是同时进行的。这一次花的是较长的那个，不是两者之和。"
    - "这是每个 token 读一遍权重，像解码那样。预填充时 50 个 token 共用一次读取。"
    - "这是秒。题目问的是 ms。"
    - ["像上一题那样，算出两个时间：读取和算术。", "算术是 50 × 1.4 × 10¹⁰ = 7 × 10¹¹ 个 FLOPs。把它的时间和读权重的时间作比较。"]

serve-fit:
  prompt: "一块 GPU 有 80 GB 显存。里面放着那个 70 亿权重模型的 14 GB 权重，以及每个用户的 KV 缓存。每个用户有 4,000 个 token 的缓存，每个 token 128 KiB。最多能放下多少个用户？（1 GB = 10⁹ 字节，1 KiB = 1,024 字节）"
  promptShort: "一块 80 GB 的 GPU 放着 14 GB 权重和 KV 缓存。每个用户 4,000 个 token，每个 token 128 KiB。最多能放下多少个用户？（1 GB = 10⁹ 字节，1 KiB = 1,024 字节）"
  after: "一个用户的缓存是 4,000 × 128 × 1,024 = 524,288,000 字节，大约 0.524 GB。空闲显存是 80 − 14 = 66 GB，66 / 0.524 ≈ 125.9，所以能放下 125 个用户。这时每一步要读 14 + 125 × 0.524 ≈ 79.5 GB，花 79.5 ms。每个用户每秒只得到大约 12.6 个 token，总共大约 1,570 个。算术花 125 × 0.14 = 17.5 ms，比读取少得多。所以对话很长时，批还没到交叉点，显存就已经满了，每一步都受读取限制。"
  hints:
    - "这把全部 80 GB 都给了缓存。14 GB 的权重也在显存里。"
    - "这把全部 80 GB 都给了缓存。14 GB 的权重也在显存里。"
    - "126 个用户需要 126 × 0.524 ≈ 66.1 GB 的缓存，超过了空闲的 66 GB。向下取整。"
    - "1 KiB 是 1,024 字节，不是 1,000。一个用户的缓存是 4,000 × 128 × 1,024 字节。"
    - "1 KiB 是 1,024 字节，不是 1,000。一个用户的缓存是 4,000 × 128 × 1,024 字节。"
    - "这里 1 GB 是 10⁹ 字节，不是 1,024³。把缓存换成字节，再用 66 × 10⁹ 除以它。"
    - ["先算出空闲显存：80 GB 里权重占了 14 GB。", "一个用户的缓存是 4,000 × 128 KiB。把它换成字节，再换成 GB，用空闲显存除以它。向下取整：一个用户的缓存不能拆开。"]

cost-code:
  prompt: "写出一步解码的 serve。B 个用户每人有一份 KV 缓存，长度是给定的 token 数。这一步把权重读一遍，再读每个用户的缓存。它还为每个用户的 token 做 2N 个 FLOPs。`bytes_per` 是每个存储的数的字节数：权重和 KV 缓存都用它。这一步花的是读取和算术中较长的那个。返回一步的时间（ms）、每个用户每秒的 token 数，以及每秒的 token 总数。"
  promptShort: "写出 serve：对 B 个用户的一步解码，返回一步的时间（ms）、每个用户每秒的 token 数，以及每秒的 token 总数。这一步读权重和每个用户的缓存，做 B × 2N 个 FLOPs（只算权重，不算注意力那部分）。`bytes_per` 用于权重和缓存。读取和算术同时进行，所以这一步花较长的那个。"
  template: |
    def serve(n_weights, kv_heads, d_k, layers, tokens, B,
              bandwidth, flops, bytes_per=2):  # 每个数的字节数：权重和 KV 缓存
        ____

    # 70 亿个权重，8 个 K/V 头，10¹² 字节/s，10¹⁴ FLOPs/s
    print(serve(7e9, 8, 128, 32, 0, 1, 1e12, 1e14))     # 一个用户
    print(serve(7e9, 8, 128, 32, 4000, 8, 1e12, 1e14))  # 8 个用户
  tests:
    - "一个用户，还没有缓存：这一步就是读权重的 14 ms"
    - "每个权重 1 字节：读取只花一半时间"
    - "8 个用户共用一次读取：每人仍然每秒得到 71.43 个 token"
    - "256 个用户：算术（35.84 ms）比读取花的时间长"
    - "256 个用户，每个权重 1 字节：算术不变"
    - "8 个用户，每人 4,000 个 token：这一步读 14 + 4.2 GB"
    - "每个数 1 字节：缓存也缩小了"
  hints:
    - "返回三个数：一步的时间（ms）、每个用户每秒的 token 数，以及每秒的 token 总数。"
    - ["一个用户、没有缓存时，一步就是读取时间：权重字节数 / 带宽，换成 ms。", "读取和算术是同时进行的，所以一步花的是较长的那个，不是两者之和。秒乘以 1,000 就是 ms。"]
    - "每个权重 1 字节时，权重占的字节数就等于权重个数。用每个数字节数的那个参数，不要写死 2。2N 里的 2 数的是 FLOPs，不是字节。"
    - "第二个数是每个用户的（1 / step）。第三个数是所有用户合起来的（B / step）。"
    - ["一步的算术是 B × 2N 个 FLOPs，再除以每秒 FLOPs。检查一下 B 和 2 是不是都在。", "256 个用户时，算术比读取花的时间长。一步取两者中较长的：用 max。"]
    - "算术不能随每个权重的字节数变化。每个 token 花 2N 个 FLOPs，N 是权重个数。"
    - ["每个用户都有自己的一份缓存，一步要把它们全读一遍。", "读取时间是（权重字节数 + B × 一个用户的缓存字节数）/ 带宽。"]
    - "缓存也要用 `bytes_per`，不要写死 2。"
    - ["用字节和秒来算。算出读取时间和算术时间，再取较长的那个。", "一个用户的缓存是 2（k 和 v）× K/V 头数 × dₖ × 层数 × 每个数的字节数 × token 数。"]
  after: "读一遍权重能服务每个用户，所以总速度随 B 增长，直到算术比读取花的时间长。每个用户的缓存只为这个用户自己读，所以长对话会让每一步都变慢。8 个用户、每人 4,000 个 token 时，一步花 18.19 ms，而不是 14 ms。这里的 FLOPs 只算了权重，不算注意力那部分（第 3 节）。4,000 个 token 时，那部分给 2N 增加大约 15%：每个 token 4 × 4,000 × 4,096 × 32 ≈ 2.1 × 10⁹ 个 FLOPs，d = 4,096，32 层。反正这里读取比算术花的时间长得多，所以一步的时间不变。"
