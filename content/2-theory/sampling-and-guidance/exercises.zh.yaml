k-coef:
  prompt: "β = 0.5，alpha-bar = 0.36。β / √(1 − alpha-bar) 是多少？"
  after: "0.5 / √0.64 = 0.5 / 0.8 = 0.625。"
  hints:
    - "这是除以 0.64。先开平方：√0.64 = 0.8。"
    - "这用的是 √0.36 = 0.6。公式里是 √(1 − alpha-bar) = √0.64。"
    - ["从最里面的部分开始：1 − alpha-bar。", "1 − 0.36 = 0.64。先开平方，再用 β = 0.5 除以它。"]

mean-first:
  prompt: "反向的一步：mean = (xₜ − 0.625 × ε̂) / √α。这里 x₃ = [1.0, 0.4]，噪声猜测 ε̂ = [0.5, −1]，α = 0.5。用 1 / √0.5 ≈ 1.41。均值的第一个数是多少？（保留 2 位小数）"
  after: "(1.0 − 0.625 × 0.5) × 1.41 = 0.6875 × 1.41 ≈ 0.97。第二个数是 (0.4 + 0.625) × 1.41 ≈ 1.45。"
  hints:
    - "到这里都对。现在除以 √α，也就是乘以 1.41。"
    - "这是除以 0.5。应该除以 √0.5：乘以 1.41。"
    - "你除以的是 √0.36 = 0.6，也就是 alpha-bar 的平方根。公式的分母是 √α，用这一步的 α = 0.5：乘以 1.41。"
    - "你除以的是 √0.36 = 0.6，也就是 alpha-bar 的平方根。公式的分母是 √α，用这一步的 α = 0.5：乘以 1.41。"
    - ["分两步：先算分子，只用第一个数。", "分子：1.0 − 0.625 × 0.5。再除以 √α，这里的 α 是这一步的 0.5，不是 alpha-bar。"]

last-step:
  prompt: "在最后一步，从 t = 1 到 t = 0，要不要加新噪声 z？"
  options: ["要，和前面每一步一样", "不要，最后一步一点也不加", "要，而且再多加一些噪声来收尾"]
  hints:
    - "最后一步之后就没有别的步了。在那里加进去的噪声，谁来去掉？"
  reveal: "不要。最后一步的输出就是最终的样本。在那里加的任何噪声都会直接留在图里，所以最后一步返回均值。"

reverse-step:
  prompt: "写出反向的一步。z 是新噪声。"
  tests:
    - "z = 0 时得到的就是均值"
    - "页面上的例子：[1.114, 1.167]"
  hints:
    - "z = 0 时答案应该就是均值。是不是加了什么和 z 无关的东西？"
    - "新噪声按 √β 缩放，不是按 β。"
    - ["看页面上的第二个公式：xₜ₋₁ = mean + …", "均值已经算好了。要往它上面加什么？那个东西又要乘以什么？", "新噪声 z 要乘以一个平方根。NumPy 的平方根是 np.sqrt。"]
  after: "均值去掉一点猜出来的噪声。然后 √β × z 放回一份更小的新噪声，于是每一步都从这个点可能来自的那些地方里挑一个。z = 0 时，比如最后一步，结果就是均值。"

cfg-first:
  prompt: "引导把两个噪声猜测混起来：ε̂ = `ε_free` + w (`ε_shape` − `ε_free`)。`ε_free` = [0.2, 0.0]，`ε_shape` = [0.6, −0.4]，w = 3。引导后的猜测 ε̂ 的第一个数是多少？"
  after: "0.2 + 3 × (0.6 − 0.2) = 1.4。完整的猜测是 [1.4, −1.2]。它越过了 `ε_shape`，离 `ε_free` 的距离是三倍。"
  hints:
    - "这是 w = 1 的结果。w = 3 时要走三倍远：0.2 + 3 × 0.4。"
    - "这是 3 × (0.6 − 0.2)。要从 `ε_free` 出发：再加上 0.2。"
    - "你把 `ε_shape` 乘了 3。应该把差 (0.6 − 0.2) 乘以 3，再加上 `ε_free`。"
    - ["只用第一个数套引导公式：`ε_free` = 0.2，`ε_shape` = 0.6。", "差是 0.6 − 0.2 = 0.4。现在用上 w 和 `ε_free`。"]

big-w:
  prompt: "试之前先猜一猜：w 非常大，比如 10 的时候，样本会怎样？"
  options: ["每个样本都正好落在形状上，并且沿着它均匀分布", "它们挤到形状的少数几个部分，还有一些落在形状外面", "它们均匀地铺满形状，只是比 w = 1 时模糊一些"]
  reveal: "它们挤到少数几个部分。很大的 w 会一直把每个点推向网络最确定“这就是那个形状”的地方。很多点都到了那里，形状的其余部分空着，而且推得过头，所以有些点落在形状外面。在下面的实验台里试试：“形状覆盖”会急剧下降。"

calls:
  prompt: "带引导的采样，ε̂ = `ε_free` + w (`ε_shape` − `ε_free`)，一共走 50 步。总共要跑多少次网络？（跑一次就能同时处理全部 300 个点。）"
  after: "每一步两个猜测，`ε_free` 和 `ε_shape`，所以是 2 × 50 = 100。引导让采样的代价翻了一倍。"
  hints:
    - "每步跑一次得到的是 `ε_shape`。引导还需要 `ε_free`。"
    - "跑一次就把 300 个点当作一批全部处理了，所以不用乘以 300。"
    - ["引导公式在每一步需要几个噪声猜测？", "每一步都需要 `ε_free` 和 `ε_shape`。每一个都要单独跑一次网络。"]

cfg:
  prompt: "写出引导的混合。"
  tests:
    - "w = 0 不管形状"
    - "页面上的例子"
    - "w = 1 就是普通的形状猜测"
  hints:
    - "w = 0 时，你应该原封不动地拿回 `ε_free`。"
    - ["把页面上的引导公式照抄成代码。", "检查两端：w = 0 必须得到 `eps_free`，w = 1 必须得到 `eps_shape`。", "w 乘的是两个猜测的差，不是单独某一个猜测。"]
  after: "w = 0 得到 `eps_free`，w = 1 得到 `eps_shape`。w 大于 1 时会越过 `eps_shape`，沿着从 `eps_free` 指向 `eps_shape` 的方向走得更远。这会把每个点推得更像那个形状。"

guided-step:
  prompt: "写出带引导的往回一步，从 x 到下一个 x，引导权重为 w。z 是新噪声（最后一步为全零）。"
  tests:
    - "w = 0 不管标签"
    - "w = 2，不加新噪声"
    - "w = 2，加上新噪声 z"
  hints:
    - "只用函数第一行里的名字：x、`eps_free`、`eps_shape`、w、beta、alpha、ab、z。混合后的猜测要先自己定义，再使用。"
    - ["w = 0 时，混合后的猜测必须是 `eps_free`。检查你的混合。", "混合从 `eps_free` 出发，朝 `eps_shape` 移动 w 倍的差。", "如果混合没问题，就检查均值：它是第 1 节的第一个公式，把 ε̂ 换成混合后的猜测。"]
    - ["前两个测试通过了，所以只有新噪声不对。z 是怎么缩放的？", "看第 1 节的第二个公式：z 要乘以一个平方根。"]
    - ["三行：用权重 w 混合两个噪声猜测，用混合后的猜测算出反向一步的均值，然后返回均值加上缩放后的噪声。", "混合后的猜测就是上面你写的 cfg 函数。均值是第 1 节的第一个公式，把 ε̂ 换成混合后的猜测。", "返回均值加上新噪声 z，按第 1 节的方式缩放。"]
  after: "引导只改变噪声猜测。反向的一步和之前一样，只是把 ε̂ 换成了混合后的猜测。w = 0 时，它就是不带标签的普通一步。"
