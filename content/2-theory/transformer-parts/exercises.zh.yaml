swap-no-pe:
  prompt: "不带任何位置信息的自注意力先在“cat dog car”上运行，再在“car dog cat”上运行。cat 的输出会不同吗？"
  options: ["会，cat 换了位置，所以输出会变", "不会，完全一样", "会变一点点"]
  hints:
    - "看注意力为 cat 算了什么：cat 和每个词的点积，然后是一个加权和。这里面有哪一步用到了 cat 所在的位置？"
    - "交换词只会交换分数表的行和列。cat 自己那一行还是同样的三个分数，只是顺序不同。"
  reveal: "完全一样：两次都是 [1.723, 0.277]。交换词只是交换了分数表的行；cat 看到的还是同样的三个词，分数也一样。单靠注意力，一个句子只是一组没有顺序的词。给每个词加上一个位置向量就能解决这个问题。"

pe-0-1:
  prompt: "每个词有 2 个数时，位置 pos 得到 [sin(pos), cos(pos)]。PE[0][1]，也就是位置 0 的向量的第二个数，是多少？"
  after: "cos(0) = 1，所以位置 0 得到的是 [0, 1]，不是全零向量。连第一个词也被标记了。"
  hints:
    - "0 是 sin(0)，是第一个数。第二个数是 cos(0)。"
    - ["把 pos = 0 代入 [sin(pos), cos(pos)]，取第二个数。", "cos(0)：角度为 0 的余弦。"]

sqrt-dmodel:
  prompt: "一个模型的 `d_model` = 64。加上位置向量之前，每个词向量要乘以 √`d_model`。乘以多少？"
  after: "√64 = 8。`d_model` = 512 时大约是 22.6。"
  hints:
    - "这是 `d_model` 本身。要取它的平方根。"
    - "这是 64 的一半。64 的平方根是那个自己乘自己等于 64 的数。"
    - ["√`d_model` 是 `d_model` 的平方根。", "哪个数自己乘自己等于 64？"]

pe-shape:
  prompt: "一个句子有 10 个 token，`d_model` = 8。它的位置编码是什么形状？"
  after: "每个位置一个向量，大小和词向量一样，这样两者才能相加。"
  hints:
    - "行是位置，就像 X 的行是词。"
    - ["它要加到 X 上。", "所以它必须和 X 形状相同：(token 数, `d_model`)。"]

ffn-hidden-shape:
  prompt: "X 是 (3, 2)，W1 是 (2, 4)。隐藏层是什么形状？"
  after: "(3, 2) @ (2, 4) → (3, 4)：现在每个词有 4 个隐藏的数。W2 (4, 2) 又把它变回 (3, 2)。"
  hints:
    - "这是 W1。用 X 乘它。"
    - ["矩阵乘积的形状：(n, k) @ (k, m) → (n, m)。", "(3, 2) @ (2, 4)：哪两个数会消失？"]

cat-lit:
  prompt: "cat = [2, 0]，W1 = [[1, −1, 0, 1], [0, 1, −1, 1]]，b1 = [0, 0, 1, −2]。ReLU 之前，cat 的 4 个隐藏单元是 cat @ W1 + b1。ReLU 之后有几个是开的（大于 0）？"
  after: "ReLU 之前 cat 是 [2, −2, 1, 0]。单元 0 和单元 2 大于 0；单元 3 正好是 0，算作关。"
  hints:
    - "其中有一个正好是 0。ReLU(0) 是 0，所以这个单元是关的。"
    - ["先算 cat @ W1。因为 cat = [2, 0]，它就是 W1 第 0 行的 2 倍。", "再加上 b1，然后数一数严格大于 0 的数有几个。"]

ffn-alone:
  prompt: "FFN 计算的是 ReLU(X @ W1 + b1) @ W2 + b2。先让 X 装三个词：cat、dog 和 car。再只对 cat 单独运行。和三个词一起处理时 cat 那一行相比，结果……"
  options: ["完全一样", "略有不同", "完全不同"]
  hints:
    - ["在 FFN 里，cat 那一行会和哪些数相乘？", "在 X @ W1 的 cat 那一行里，出现过 dog 或 car 的数吗？"]
  reveal: "完全一样：两种方式都是 [1, 1]。FFN 只是把每个词自己的数乘以 W1 和 W2；任何词的数都不会用到别的词那一行里。所以它叫逐位置的。把词混在一起是注意力的工作。"

deep-plain:
  prompt: "30 层，每层都乘一个会让数变小一点的随机矩阵（增益 0.5）。没有残差，没有 LayerNorm。30 层之后，这些数……"
  options: ["大小差不多", "几乎是 0", "非常大"]
  hints:
    - "每一层大约把大小减半。0.5 自己乘自己 30 次是多少？"
    - "增益 0.5 会让数变小。要变大，增益得大于 1。"
  reveal: "几乎是 0：用随机矩阵时大约是 10⁻⁸。每一层大约把大小减半，而 0.5³⁰ 大约是 10⁻⁹。输入几乎什么都不剩了，传回最前面几层的梯度也几乎是 0。"

ln-clean:
  prompt: "对词 [1, 1, 5, 5] 做 LayerNorm。它的均值是 3，标准差是 2。每个 5 会变成多少？"
  after: "(5 − 3) / 2 = 1。整个词变成 [−1, −1, 1, 1]：均值 0，标准差 1。"
  hints:
    - "这是 5 减去均值。现在再除以标准差 2。"
    - "先减去均值，再除以标准差。"
    - ["LayerNorm 对每个数做两件事：减去均值，再除以标准差。", "先算 5 − 3。"]

ln-count:
  prompt: "X 是 (2, 5, 8)：2 个句子，每句 5 个词，每个词 8 个数。LayerNorm 一共算出多少个各自独立的均值？"
  after: "每个词一个：2 × 5 = 10。每个均值都是对这个词的 8 个数求的。"
  hints:
    - "那是每列一个均值，跨词计算。LayerNorm 是在每个词内部算的。"
    - "这是所有数的个数。每个均值概括的是一个词的 8 个数。"
    - ["LayerNorm 对最后一个轴做归一化，一次一个词。一共有多少个词？", "2 个句子，每句 5 个词。"]

layer-norm:
  prompt: "补全对最后一个轴做的 LayerNorm。"
  tests:
    - "[1, 2, 3, 6] → [−1.069, −0.535, 0, 1.604]"
    - "每一行各自归一化"
    - "[0, 0.002] 的方差是 0.000001，所以 eps 有影响：→ [−0.3015, 0.3015]"
  hints:
    - ["LayerNorm 除以的是标准差，不是方差。", "标准差是方差的平方根。哪个 NumPy 函数开平方根？"]
    - ["每一行都要有自己的标准差。模板已经为每一行算好了 var。", "在你的答案里用 var，也就是那个 (行数, 1) 的数组。"]
    - ["[0, 0.002] 这一行的方差是 0.000001，和 eps = 0.00001 很接近。所以 eps 放在哪里会影响答案。", "eps 加在方差上，在开平方根之前。"]
    - ["你已经有方差了。LayerNorm 除以的是标准差。", "标准差是方差的平方根。哪个 NumPy 函数开平方根？", "eps 是为了让你永远不会除以 0。它放在平方根里面。"]
  after: "除以标准差而不是方差，每一行的标准差才会是 1。eps 在平方根里面，所以一行全相等的数（方差为 0）也不会除以 0。keepdims=True 让 mu 和 var 保持 (行数, 1) 的形状，这样广播会把它们用在自己那一行的每个数上。"

ffn-block:
  prompt: "写出带残差的 FFN 子层 X + ffn(X)：用 W1 和 b1 变宽，ReLU，用 W2 和 b2 变窄回来，再加上输入 X。两行。"
  tests:
    - "dog [1, 1]：FFN 给出 [1, 0]，[1, 1] + [1, 0] = [2, 1]"
    - "cat、dog、car：X + FFN(X) = [[3, 1], [2, 1], [0, 4]]"
    - "[−3, 0]：隐藏层 [0, 3, 1, 0]，FFN 给出 [−1, 4]，加上输入得到 [−4, 4]"
    - "b2 = [0.5, −0.5] 时，dog 变成 [2, 1] + [0.5, −0.5] = [2.5, 0.5]"
  hints:
    - ["在 `return out` 之前给变量 `out` 赋值。", "先写一行算隐藏层 h，再写一行算 out。"]
    - ["np.max 找的是一个数组里最大的那个数；它的第二个参数是轴。ReLU 比较的是两样东西：0 和每个数。", "用 np.maximum(0, …)：它把 0 和每个数比较，留下较大的那个。"]
    - ["有一个乘积的形状对不上。X 是 (3, 2)，W1 是 (2, 4)，W2 是 (4, 2)。", "隐藏层是 (3, 4)。哪个矩阵能把它变回 (3, 2)？"]
    - ["对 dog [1, 1]，单独的 FFN 给出 [1, 0]，但答案是 [2, 1]。你加上输入 X 了吗？", "残差把输入加到 FFN 的输出上。"]
    - ["cat 的隐藏层必须是 [2, 0, 1, 0]。ReLU 写了吗？", "ReLU 把每个负的隐藏数设为 0。在 NumPy 里就是和 0 做 np.maximum。"]
    - ["对 [−3, 0]，答案里有一个负数 −4。ReLU 只作用在隐藏层上，不作用在输出上。", "只对 X @ W1 + b1 用 np.maximum。用 W2 变窄和加残差都在它之后，不带 ReLU。"]
    - ["这个测试把 b2 设成 [0.5, −0.5]。你的第二行里有 b2 吗？", "变窄回来是 h @ W2 + b2，和第一层的写法一样。"]
    - ["两步：带 ReLU 的隐藏层，然后变窄回来并加上 X。", "第 1 行算出隐藏层 h，形状 (3, 4)。第 2 行用 X 和 h 算出 out，形状 (3, 2)。", "在 NumPy 里，ReLU 是和 0 做 np.maximum。W2 让每个词重新变成 2 个数，这样才能加上 X。"]
  after: "隐藏层把每个词变宽到 4 个数，ReLU 关掉其中一些。W2 让每个词重新变成 2 个数，所以结果能加到 X 上。这个和就是残差：FFN 只需要学出对 X 的一个改变量。"

zero-sublayer:
  prompt: "一个 pre-norm 块运行 x = x + ffn(`layer_norm`(x)) 这一行。对一个 token，x = [3, 1]，FFN 的输出是 [0, 0]。运行这一行之后 x 是多少？"
  options: ["[0, 0]", "[3, 1]，x 不变", "[1, −1]，x 的 LayerNorm"]
  hints:
    - "FFN 给出 [0, 0]，但这一行把它加到了 x 上。"
    - "那是第 3 节的放法 LayerNorm(x + sublayer(x))。这里 LayerNorm 只作用在送进 FFN 的那一份副本上。"
  reveal: "[3, 1]。FFN 的输出加到 x 上，而 x 本身从来没有被归一化：被归一化的只是送进 FFN 的那一份副本。一个什么都不加的子层会让 x 保持原样。如果用第 3 节的放法，结果会是 LayerNorm([3, 1]) = [1, −1]。"

block-ln-count:
  prompt: "一个模型有 3 个 pre-norm 解码器块，每个块在注意力前有一个 LayerNorm，在 FFN 前有一个，输出层之前还有一个最终的 LayerNorm。它一共有多少个 LayerNorm？"
  after: "每块 2 个 × 3 块 = 6 个，加上最终的那个 = 7 个。之所以要最终那个，是因为没有别的东西对残差通路做归一化。"
  hints:
    - "这只算了块里的。pre-norm 在最后一个块之后还要再加一个 LayerNorm。"
    - "每个块有两个 LayerNorm，每个子层一个。"
    - ["先数每个块里的：每个子层前面一个 LayerNorm。", "每块 2 个，3 个块，再加上最终的 LayerNorm。"]

decoder-block:
  prompt: "写出解码器堆叠：`n_blocks` 个 pre-norm 解码器块，然后是最终的 LayerNorm。在每个块里，带掩码的自注意力和随后的 FFN 都读 x 的 LayerNorm，各自的结果都加到 x 上。"
  template: |
    def layer_norm(x, eps=1e-5):
        mu = x.mean(axis=-1, keepdims=True)
        var = x.var(axis=-1, keepdims=True)
        return (x - mu) / np.sqrt(var + eps)

    def attention(x):          # 带掩码，Q = K = V = x，没有权重
        L, d = x.shape
        scores = x @ x.T / np.sqrt(d)
        blocked = np.triu(np.ones((L, L), dtype=bool), k=1)
        return softmax(np.where(blocked, -np.inf, scores)) @ x

    W1 = np.array([[1.0, -1.0, 0.0, 1.0],
                   [0.0, 1.0, -1.0, 1.0]])   # (2, 4)
    b1 = np.array([0.0, 0.0, 1.0, -2.0])
    W2 = np.array([[1.0, 0.0],
                   [0.0, 1.0],
                   [-1.0, 1.0],
                   [0.5, 0.5]])              # (4, 2)

    def ffn(x):
        return np.maximum(0, x @ W1 + b1) @ W2

    def decoder(x, n_blocks):
        ____
        return x

    X = np.array([[2.0, 0.0],    # cat
                  [1.0, 1.0],    # dog
                  [0.0, 2.0]])   # car
    print(decoder(X, 2))
  tests:
    - "一个块把 [0, 4] 变成 [−1, 7]，最终的 LayerNorm 再把它变成 [−1, 1]"
    - "第一个 LayerNorm 读的是 x 本身 [0, 4]，那时还什么都没加"
    - "第二个 LayerNorm 读的是加上注意力之后的 x：[0, 4] + [−1, 1] = [−1, 5]"
    - "1 个块时，各个 LayerNorm 依次读到 [0, 4]、[−1, 5]，然后是 [−1, 7]（最终那个）"
    - "2 个块时，各个 LayerNorm 依次读到 [0, 4]、[−1, 5]、[−1, 7]、[−2, 8]，然后是 [−2, 10]（最终那个）"
    - "3 个 token 时，第二个 LayerNorm 读到的是加上注意力之后的 cat、dog、car：[3, −1]、[1.5, 0.5]、[−0.7225, 2.7225]"
    - "1 个块之后，cat、dog、car 是 [2, 1]、[0.5, 2.5]、[−0.7225, 4.7225]；最终的 LayerNorm 只留下两个数的大小顺序"
  hints:
    - "用上面定义好的名字：`layer_norm`、attention、ffn 和 `n_blocks`。"
    - ["一个块把 [0, 4] 变成 [−1, 7]，和手算的例子一样。最后一个块之后，堆叠还要做什么？", "没有别的东西对残差通路做归一化，所以堆叠的结尾有一个最终的 LayerNorm，放在循环之后。"]
    - ["第一个 LayerNorm 读到的是 [0, 8]，不是 [0, 4]：x 在归一化之前已经被加上了东西。这是第 3 节的顺序 LayerNorm(x + sublayer(x))。", "在 pre-norm 里，块里的第一件事是 `layer_norm`(x)。注意力读这份归一化后的副本，它的结果之后再加到 x 上。"]
    - ["你的第二个 LayerNorm 读到的是 [−2, 2]：x 本身被归一化了。只有送进子层的副本才归一化；x 原封不动地加回去。", "不要把 `layer_norm`(x) 赋值给 x。直接把它传给 attention，再把 attention 的结果加到原来的 x 上。"]
    - ["这个测试记录每个 LayerNorm 读到了什么。一个块之后，x 必须是 [−1, 7]。如果列表停在 [−1, 5]，说明你只写了一行：缺了 FFN 那一行。", "一个块有两行，每个子层一行：先是注意力，然后是 FFN。每一行都读 `layer_norm`(x)，结果加到 x 本身上。"]
    - ["2 个块时，那两行要运行两次，最终的 LayerNorm 运行一次。", "用 for 循环把块重复 `n_blocks` 次。最终的 LayerNorm 放在循环之后，不要放在循环里面。"]
    - ["第二个 LayerNorm 应该读加上注意力之后的 x。只有 1 个 token 时，注意力原样给回这个 token，所以上面的测试看不出来。有 3 个 token 时，注意力会把每个 token 和它前面的 token 混合。你的第一行里有 attention 吗？", "块里的第一行是 x = x + attention(`layer_norm`(x))。用上面定义的 attention：它带因果掩码。"]
    - ["对块做一个循环，每个块里两行，然后一个 LayerNorm。", "块里的每一行都读 x 的一份归一化副本，再把结果加到 x 上。不要在循环里对和做归一化：只有最终的 LayerNorm 会动 x 本身。"]
  after: "在循环里，每一行都读 x 的一份归一化副本，再把结果加到 x 本身上，所以 x 在块与块之间从来不会被重新缩放。只有最终的 LayerNorm 对 x 做归一化。每个 token 只有 2 个数时，它会把每一行都变成 [−1, 1] 或 [1, −1]。真实模型每个 token 有几百个数，所以 x 保留下来的信息多得多。"
