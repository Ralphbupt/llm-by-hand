why-decoder-only:
  prompt: "对一个通用模型来说，为什么一个堆叠会比编码器加解码器更好？"
  options: ["没有交叉注意力，每一层更小，同样多的权重能放下更多层", "任何任务都能写成“输入一段文本，输出更多文本”，所以一个在普通文本上训练的堆叠能把它们全学会", "编码器只能读短的输入"]
  hints:
    - "大小不是主要原因。想想模型是从什么里学的：哪些任务可以写成普通文本？"
    - "编码器也能读长的输入。想想翻译、问答和算术都可以怎样写出来。"
  reveal: "一个堆叠，一个目标：预测任意文本的下一个 token。翻译、问答、代码和算术都变成了“把这段文本接着写下去”。训练文本的每个 token 都用上了，也不需要为每个任务单独设计什么。交叉注意力没有错，只是不需要了。"

postnorm-count:
  prompt: "一个 post-norm 堆叠有 12 层，每层是 x = LayerNorm(x + f(x))。从输入到输出的那条直通的残差通路上，有几个 LayerNorm？"
  after: "12 个，每层一个。12 层的 pre-norm 堆叠在这条路上只有 1 个：最后那一个。"
  hints:
    - "1 是 pre-norm。在 post-norm 里，每次相加之后，残差通路上都有一个 LayerNorm。"
    - "在这道题里，每层只有一个子层，只包一次。每层数一个 LayerNorm。"
    - "每层都以 LayerNorm(x + f(x)) 结束，而 x 就是残差通路本身。一共几层？"

rms-value:
  prompt: "x = [1, 1, 3, 5]。均方根是 √((1² + 1² + 3² + 5²) / 4)。它是多少？"
  after: "1 + 1 + 9 + 25 = 36，/ 4 = 9，√9 = 3。对比一下 LayerNorm 的标准差：1.6583，是围绕均值 2.5 算的。"
  hints:
    - "这是平方的平均值。再开平方根。"
    - "这是平方和。除以 4，再开平方根。"
    - ["把每个数平方，求四个平方的平均值，再开平方根。", "平方是 1、1、9 和 25。"]

rms-out0:
  prompt: "x = [1, 1, 3, 5]，它的均方根是 3。RMSNorm(x) 的最后一个数是多少？（保留 2 位小数）"
  after: "5 / 3 = 1.67。整个输出是 [0.33, 0.33, 1, 1.67]：方向和 x 一样，只是缩放了。LayerNorm 会给出 [−0.90, −0.90, 0.30, 1.51]。"
  hints:
    - "这是 LayerNorm 的最后一个数，它先减去了均值 2.5。RMSNorm 只做除法。"
    - "这是第一个数。题目问的是最后一个：5 / 3。"
    - ["RMSNorm 把每个数都除以 rms。什么都不减。", "取 x 的最后一个数，除以你算出的 rms。"]

rmsnorm-code:
  prompt: "沿最后一个轴写出 RMSNorm（x 全是 0 时，eps 保证它不出错）。"
  template: |
    def rmsnorm(x, eps=1e-6):
        return x / ____

    print(np.round(rmsnorm(np.array([1.0, 1.0, 3.0, 5.0])), 4))
  tests:
    - "x = [1, 1, 3, 5]"
    - "两行，每一行各自归一化"
    - "x = [0.001, 0.001]：平方的平均值是 0.000001，和 eps 一样大"
  hints:
    - "第一行对了，两行却不对：只沿最后一个轴求平均，用 axis=-1 和 keepdims=True。"
    - ["对 [0.001, 0.001] 来说，平方的平均值是 0.000001，和 eps 一样大。所以 eps 放在哪里会影响答案。", "eps 加在平方的平均值上，在开平方根之前。"]
    - ["平方、求平均、开平方根。不减均值。", "检查顺序：eps 放在平方根里面，加在平方的平均值上。"]
    - ["沿最后一个轴，按这个顺序：平方、求平均、开平方根。", "把每个数平方，再对每一行求平均。保留最后一个轴，这样结果仍然能逐行去除。", "eps 放在平方根里面，不是外面。"]
  after: "RMSNorm 只做缩放：不减均值，所以 [1, 1, 3, 5] 的方向不变。keepdims=True 让每一行保留一个 rms，形状是 (rows, 1)，所以每一行都除以它自己的 rms。x 全是 0 时，eps 让平方根保持大于 0。"

rope-qx:
  prompt: "θ = 每个位置 0.5 弧度。q 在位置 2。q 被旋转了多少弧度？"
  after: "2 × 0.5 = 1 弧度。把 [1, 0] 旋转 1 弧度得到 [cos 1, sin 1] ≈ [0.54, 0.84]：长度还是 1，方向变了。"
  hints:
    - "0.5 是 θ，每个位置的角度。q 在位置 2。"
    - "角度是 位置 × θ。"

rope-shift:
  prompt: "q 在位置 2，k 在位置 0，它们的分数是某个数 s。现在把两者都往后移 10 个位置（12 和 10）。分数……"
  options: ["正好保持为 s", "变小，因为它们在文本里更靠后了", "改变，因为两个向量都指向了新的方向"]
  hints:
    - "两个向量多转了同样的角度。它们之间的夹角变了吗？"
  reveal: "正好保持为 s。两者都多转了 10 × 0.5 = 5 弧度，所以它们之间的夹角不变，点积也不变。"

rope-score:
  prompt: "q = [1, 0] 在位置 2，k = [0, 1] 在位置 0，θ = 0.5。旋转之后，q = [cos 1, sin 1] ≈ [0.54, 0.84]，k 还是 [0, 1]。分数 q·k 是多少？（保留 2 位小数）"
  after: "0.54 × 0 + 0.84 × 1 = 0.84。在位置 (5, 3) 或 (12, 10) 上也是同样的 0.84。在 (0, 2) 上是 −0.84：距离的方向也有影响。"
  hints:
    - "0 是不旋转时的分数。用旋转之后的 q。"
    - "0.54 是 q 的第一个数。k = [0, 1]，所以只有 q 的第二个数起作用。"
    - ["点积：把 q 和 k 逐个数相乘，再加起来。", "k = [0, 1]，所以只有 q 的第二个数起作用。"]

rope-code:
  prompt: "把一对数 v 旋转 pos × theta 弧度（逆时针）。"
  template: |
    def rotate(v, pos, theta=0.5):
        a = pos * theta
        c, s = np.cos(a), np.sin(a)
        return ____

    q, k = np.array([1.0, 2.0]), np.array([3.0, -1.0])
    # 距离相同，分数相同
    print(rotate(q, 5) @ rotate(k, 2), rotate(q, 13) @ rotate(k, 10))
  tests:
    - "[1, 0] 旋转 1 弧度 → [cos 1, sin 1]"
    - "[0, 1] 旋转 0.5 弧度 → [−sin 0.5, cos 0.5]"
    - "距离相同，分数相同"
  hints:
    - ["[1, 0] 对了，[0, 1] 却不对：两个新数都必须用到 v[1]。", "在旋转公式里，每个新数都同时用到 x 和 y。也检查一下正负号。"]
    - ["用正文里的旋转公式，其中 x = v[0]，y = v[1]，cos a = c，sin a = s。", "返回 np.array([新的 x, 新的 y])。用 c、s、v[0] 和 v[1] 写出每个新数。"]
  after: "每个新数都混合了两个旧数，所以长度不变。q 在位置 m 转 m × θ，k 在位置 n 转 n × θ，所以它们之间的夹角改变 (m − n) × θ。这就是分数只取决于距离的原因。"

silu-1:
  prompt: "SiLU(z) = z × sigmoid(z) = z / (1 + e^−z)。用 e^−1 ≈ 0.37。SiLU(1) 是多少？（保留 2 位小数）"
  after: "1 / (1 + 0.37) = 1 / 1.37 ≈ 0.73。值 u = 3 时，这个单元输出 0.73 × 3 ≈ 2.19。ReLU 会给出 1。"
  hints:
    - "这是 ReLU(1)。SiLU 把 1 乘以 sigmoid(1)，而它小于 1。"
    - ["SiLU(z) = z × sigmoid(z)。先算 sigmoid(1)。", "sigmoid(1) = 1 / (1 + e^−1)，题目给了 e^−1 ≈ 0.37。"]

swiglu-hidden:
  prompt: "普通 FFN 有 2 个 `d_model` × `d_ff` 的矩阵。SwiGLU FFN 有 3 个 `d_model` × `d_ff`′ 的矩阵。要让权重一样多，`d_ff`′ / `d_ff` 是多少？（保留 2 位小数）"
  after: "3 × `d_model` × `d_ff`′ = 2 × `d_model` × `d_ff`，所以 `d_ff`′ = `d_ff` 的 2/3 ≈ 0.67。`d_ff` = 2048 时大约是 1365；真实的模型会把它取整到 GPU 处理得快的大小，比如 1408（64 的倍数）。"
  hints:
    - "这正好反了：3/2 是三个全尺寸矩阵会多出的权重倍数。`d_ff`′ 必须更小。"
    - "接近了：两个 FFN 分别有 2 个和 3 个矩阵。让 3 × `d_ff`′ 等于 2 × `d_ff`。"
    - ["写出两个权重个数，让它们相等；`d_model` 会消掉。", "3 × `d_ff`′ = 2 × `d_ff`。两边都除以 3 × `d_ff`。"]

swiglu-code:
  prompt: "为一批形状为 (L, `d_model`) 的词行 x 写出第 5 节的 SwiGLU FFN，权重是 `W_gate`、`W_up` 和 `W_down`。每个词返回一行 `d_model` 个数。"
  template: |
    def silu(z):
        return z / (1 + np.exp(-z))                        # z · sigmoid(z)

    def swiglu_ffn(x, W_gate, W_up, W_down):
        ____

    x = np.array([[1.0, -1.0]])                            # 一个词，d_model = 2
    W_gate = np.array([[2.0, 0.0, 1.0], [0.0, 2.0, 1.0]])   # (2, 3)：d_ff = 3
    W_up   = np.array([[1.0, 1.0, 0.0], [0.0, 1.0, 1.0]])   # (2, 3)
    W_down = np.array([[1.0, 0.0], [0.0, 1.0], [1.0, 1.0]]) # (3, 2)
    print(swiglu_ffn(x, W_gate, W_up, W_down).round(4))
  tests:
    - "输入两个词，输出两行，每行 `d_model` = 2 个数"
    - "门 [1.7616, −0.2384, 0] × 值 [1, 0, −1] = [1.7616, 0, 0]，再 @ `W_down`"
    - "x = [0, 1]：门 [0, 1.7616, 0.7311]，值 [0, 1, 1]"
    - "x = [2, 1]：门 SiLU([4, 2, 3])，值 [2, 3, 1]"
  hints:
    - ["检查每个形状：x 是 (L, 2)，`W_gate` 和 `W_up` 是 (2, 3)，`W_down` 是 (3, 2)。", "门和值用 * 逐个数相乘。只有 `W_down` 用 @。"]
    - ["输入两个词，必须得到两行，每行 `d_model` = 2 个数。你的每一行是不是还有 `d_ff` = 3 个数那么宽？", "最后一步要乘以 `W_down`，它把每一行重新变回 `d_model` 个数。"]
    - ["x = [1, −1] 时，门必须是 SiLU([2, −2, 0]) = [1.7616, −0.2384, 0]。用上面的 `silu` 函数：它是 z·σ(z)，不是 max(0, z)。", "SiLU 只用在 x @ `W_gate` 上。值就是普通的乘积 x @ `W_up`。"]
    - ["x = [2, 1] 时，门的乘积是 [4, 2, 3]。在你的代码里，SiLU 作用在哪里？", "SiLU 只作用在门上，在门和值相乘之前。"]
    - ["从里往外照着公式写：两个矩阵乘积，其中一个过 SiLU，逐个数相乘，然后乘 `W_down`。", "SiLU 用在和 `W_gate` 的乘积上。值就是和 `W_up` 的普通乘积。两者都是 (L, 3)。", "把门和值逐个数相乘，再用 `W_down` 把结果变成 `d_model` 个数。"]
  after: "两个乘积都把每个词变宽到 `d_ff` = 3。门上的 SiLU 决定每个值单元能通过多少，所以两者要逐个数相乘（用 *，不是 @）。然后 `W_down` 再把每个词变回 `d_model` = 2 个数。"
