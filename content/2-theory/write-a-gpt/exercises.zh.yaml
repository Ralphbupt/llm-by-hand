seq-len:
  prompt: "<bos>23+58=81<eos> 里有多少个 token？"
  after: "<bos>、2、3、+、5、8、=、8、1、<eos>。每个字符都是一个单独的 token。"
  hints:
    - "这数的是 23+58=81 的字符。再加上 <bos> 和 <eos>。"
    - "接近了。开头的 <bos> 和末尾的 <eos> 都是 token。"
    - ["一个字符就是一个 token。先数 23+58=81 有几个字符。", "再加上两端的两个特殊 token。"]

pad-len:
  prompt: "一批里的序列长度必须都相同。最长的题是 99 + 99。<bos>99+99=198<eos> 里有多少个 token？"
  after: "<bos>、9、9、+、9、9、=、1、9、8、<eos>：11 个。所以每个序列都用 <pad> 补到 11。23+58 需要一个 <pad>。"
  hints:
    - "10 是 23+58=81 的长度。这里答案有三位：198。"
    - "数 99+99=198 的字符（9 个），再加上 <bos> 和 <eos>。"
    - ["数 99+99=198 有几个字符。", "再加上 <bos> 和 <eos>。"]

first-answer-pos:
  prompt: "位置从 0 开始数：x = <bos> 2 3 + 5 8 = 8 1 … 模型在哪个位置 t 猜答案的第一个数字？"
  after: "在 t = 6，模型看到“=”，下一个 token 是 8。这是损失只算答案数字时算进去的第一个目标值。"
  hints:
    - "位置 7 放的就是 8 本身。猜测必须早一步发生，也就是模型看到“=”的时候。"
    - "没有 <bos> 的话，“=”会在位置 5。这里 <bos> 占了位置 0，所以每个 token 都往右挪一格，“=”在位置 6。"
    - ["y[t] 是 x[t] 后面的那个 token：在 t 处做的猜测，猜的是下一个 token。", "哪个 x[t] 后面紧跟着答案的第一个数字？"]

answer-targets:
  prompt: "23 + 58 的 y 是 2 3 + 5 8 = 8 1 <eos> <pad>。损失只算答案数字时，答案之前的每个目标值和每个 <pad> 都变成 IGNORE。还有几个目标值算数？"
  after: "8、1 和 <eos>。所以“只算答案数字”指的是答案数字加上 <eos>：模型只按写出答案和知道什么时候停来评分，别的都不算。"
  hints:
    - "数字 8 和 1 算数。模型是不是还得学会什么时候停？"
    - "<pad> 永远不是目标值：它只是为了让各行一样长。"
    - ["“=”以及它之前的一切都被忽略，<pad> 也一样。", "“=”和 <pad> 之间还剩下什么？"]

make-xy:
  prompt: "把一个 id 序列拆成输入 x 和目标 y。"
  template: |
    def make_xy(ids):
        x, y = ____
        return x, y

    ids = [1, 5, 6, 13, 8, 11, 14, 11, 4, 2, 0]   # <bos> 2 3 + 5 8 = 8 1 <eos> <pad>
    x, y = make_xy(ids)
    print("x:", x)
    print("y:", y)
  tests:
    - "x 去掉最后一个 id，y 去掉第一个"
    - "一个短序列：x 是 [7, 8]，y 是 [8, 9]"
  hints:
    - "检查顺序：x 保留开头（去掉最后一个 id），y 保留结尾（去掉第一个 id）。"
    - ["x 是除了最后一个以外的所有 id；y 是除了第一个以外的所有 id。", "切片可以省略一端：s[3:] 从下标 3 开始，s[:3] 在下标 3 之前停下。", "负数下标从末尾数：s[-2] 是倒数第二个元素。"]
  after: "x[t] 和 y[t] 并排放着，所以位置 t 的目标值总是紧跟在 x[t] 后面的那个 token。一个 11 个 id 的序列，一次就给出 10 个可以训练的猜测。"

logits-shape:
  prompt: "一批 64 个样本，每个补齐到 11 个 token，所以每个 x 有 10 个。词表有 15 个 token。logit 是什么形状？"
  after: "每个样本的每个位置都有一行 15 个分数。"
  hints:
    - "每个位置都会做一个猜测，不只是最后一个。"
    - "完整序列有 11 个 token，但 x 去掉了最后一个。"
    - ["每个样本的每个位置都有一行分数。", "（批，x 的长度，词表）。"]

split-heads:
  prompt: "q 的形状是 (32, 10, 64)：批 32，长度 10，`d_model` 64。用 4 个头时，dₖ = 16。做完 view(32, 10, 4, 16) 和 transpose(1, 2) 之后，q 是什么形状？"
  after: "(B, h, L, dₖ)。把头挪到长度前面，意味着 q @ k.transpose(-2, -1) 会一次为每个样本的每个头算出一张 (10, 10) 的分数表。"
  hints:
    - "这是 view 之后的形状。transpose(1, 2) 接着交换轴 1 和轴 2。"
    - "transpose(1, 2) 交换的是轴 1 和轴 2（从 0 开始数），不是最后两个轴。"
    - ["先写出 view 之后的形状。", "然后交换第二个和第三个数。"]

split-code:
  prompt: "把最后一个轴拆成 h 个头，再把头挪到长度前面：(B, L, d) → (B, h, L, d // h)。"
  template: |
    def split_heads(x, h):
        B, L, d = x.shape
        return ____

    x = np.arange(8.0).reshape(1, 2, 4)   # 1 个样本，2 个 token，d = 4
    print(split_heads(x, 2))
  tests:
    - "(1, 2, 4) 用 2 个头 → (1, 2, 2, 2)"
    - "头 0 拿到两个 token 的第 0–1 列，头 1 拿到第 2–3 列"
  hints:
    - "形状对了，但数的顺序不对：光靠 reshape 没法把头挪到前面。先 reshape 成 (B, L, h, d // h)，再 transpose。"
    - ["两步：先拆最后一个轴，再重排各个轴。", "在 NumPy 里，transpose 接收全部四个轴的新顺序（第 9 关的表）。"]
  after: "reshape 只是把 d 拆成 h 组，每组 d // h 个数；各个轴的顺序仍然是 (B, L, h, dₖ)。然后 transpose(0, 2, 1, 3) 把头放到长度前面，这样每个头都有自己的 (L, dₖ) 表。"

merge-heads:
  prompt: "注意力算完以后，out 的形状是 (32, 4, 10, 16)：批 32，4 个头，长度 10，dₖ 16。out.transpose(1, 2).contiguous().view(32, 10, -1) 是什么形状？"
  after: "transpose 得到 (32, 10, 4, 16)，view 把最后两个轴合并：4 × 16 = 64 = `d_model`。每个 token 又有了完整的 64 个数，每个头贡献一段。"
  hints:
    - "这是 transpose 之后的形状。view(32, 10, -1) 接着把最后两个轴合成一个。"
    - "transpose(1, 2) 先做：它把长度挪到头的前面。"
    - ["先做 transpose(1, 2)：交换头和长度。", "再合并最后两个轴：4 个头 × 16 个数。"]

mha-code:
  prompt: "补完带掩码的多头注意力。q、k、v 已经拆成了多个头，形状是 (B, h, L, dₖ)。"
  template: |
    def causal(L):
        return np.triu(np.ones((L, L), dtype=bool), k=1)       # True = 挡住

    def split_heads(x, h):
        B, L, d = x.shape
        return x.reshape(B, L, h, d // h).transpose(0, 2, 1, 3)

    def join_heads(y):
        B, h, L, d_k = y.shape
        return y.transpose(0, 2, 1, 3).reshape(B, L, h * d_k)

    def attention(x, Wq, Wk, Wv, Wo, h):
        q, k, v = split_heads(x @ Wq, h), split_heads(x @ Wk, h), split_heads(x @ Wv, h)
        ____
        return join_heads(out) @ Wo

    # 1 个样本，3 个 token，d = 4
    x = np.array([[[1.0, 0, 1, 0], [0, 1, 0, 1], [1, 1, 0, 0]]])
    I = np.eye(4)
    print(np.round(attention(x, I, I, I, I, 2), 4))
  tests:
    - "三个相同的 token：每个输出都是相同几行的加权平均，所以就等于那一行"
    - "改变最后一个 token 不能改变前两个输出（因果掩码）"
    - "x 的三个 token，权重都是单位矩阵"
  hints:
    - "attention() 只接收 x、权重和 h。从数组本身取尺寸：dₖ = q.shape[-1]，L = q.shape[2]。"
    - ["三个相同的 token 必须给出三个相同的输出，所以每行权重加起来必须是 1。检查 softmax 是沿哪个轴归一化的。", "每个查询对应 (L, L) 表里的一行。softmax 必须沿最后一个轴归一化，也就是默认的 axis=-1。"]
    - "最后一个 token 一变，前两个输出就跟着变：掩码没起作用。被挡住的分数必须在 softmax 之前变成 −∞，而被挡住的格子是对角线以上的那些。"
    - ["掩码起作用了，但数不对。你把分数除以 √dₖ 了吗？", "dₖ 是一个头的大小：q 的最后一个轴，这里是 2。"]
    - "q @ k 需要把 k 的最后两个轴交换：对四轴数组是 k.transpose(0, 1, 3, 2)。"
    - ["四行：分数、除以 √dₖ、掩码，再做 softmax 并乘以 v。", "分数是 q @（交换了最后两个轴的 k）。掩码用 np.where(blocked, -np.inf, scores)。"]
  after: "有 4 个轴时，@ 作用在最后两个轴上，所以每个样本的每个头都有自己的 (L, L) 分数表。掩码是 (L, L)，会在批和头上广播。softmax 把每个 −∞ 变成权重 0。"

plateau:
  prompt: "损失算每个位置。8 轮之后，500 道验证题上的准确率是 16%，而从第 4 轮起它只是慢慢地从 9% 升到 16%。训练损失还在慢慢下降，从 1.34 降到 1.27。你怎么办？"
  options: ["停下。模型太小，学不了这个。", "调低学习率，重新开始。", "继续训练。"]
  reveal: "继续训练。验证准确率在第 9 轮是 52%，第 10 轮是 75%，第 19 轮是 95.2%。下面的实验台展示的是同一次训练在 1,000 道没见过的题上的情况。按播放，看它跳上去。"

loss-floor:
  prompt: "损失算每个位置时，训练损失一直停在 1.0 左右，而答案几乎全对了。为什么它降不下去？"
  options: ["模型太小，没法完美地学会加法", "“=”之前的数是随机的，没有哪个模型能预测它们", "学习率太高，稳定不下来"]
  hints:
    - "答案几乎全对，所以模型已经学会了加法。还有哪些目标值是难的？"
    - "损失只算答案数字时，同样的设置能把损失降到 0。算每个位置时有什么不同？"
  reveal: "两个数是随机选的。<bos> 之后，第一个数字可能是任何数，而前面没有任何东西告诉你是哪个。这些猜测让平均损失停在 1.0 附近。准确地说：两个随机数给每道题的损失加上 ln 10⁴ ≈ 9.21。分摊到每道题大约 9.3 个目标值上，就是 ln 10⁴ / 9.3 ≈ 0.99。答案数字完全由前面的内容决定，所以损失只算答案数字时会降到 0。"

start-loss:
  prompt: "词表有 15 个 token，ln 15 ≈ 2.71。你没训练过的模型在一批数据上的第一个损失是 9.4。这说明什么？"
  options: ["正常：新模型一开始损失就很高", "代码里有地方错了：输出层、损失，或者损失在数什么", "模型太小了"]
  hints:
    - "新模型对什么都没把握，所以它给每个 token 大约 1/15。这会给出多大的损失？"
    - "训练之前，大小无关紧要。任何大小的未训练模型都差不多是平均地乱猜。"
  reveal: "没训练过的模型差不多是平均地猜，所以它的损失应该接近 ln 15 ≈ 2.71。第一个损失远高于这个值，说明分数非常大，或者损失比较的东西不对：检查输出层、传给 `cross_entropy` 的形状，以及目标值。"

list-wrong:
  prompt: "返回模型答错的每一道题，写成 '2+7=1' 这样。problems 是 (a, b) 对的列表，answers 是模型给出的字符串答案，顺序相同。"
  template: |
    def misses(problems, answers):
        return ____

    problems = [(2, 7), (50, 57), (4, 26), (17, 69)]
    answers = ["1", "107", "20", "86"]
    print(misses(problems, answers))
  tests:
    - "2 + 7 = 9 和 4 + 26 = 30 是两道错题"
    - "没有错题，返回空列表"
  hints:
    - "用函数参数的名字：problems 和 answers。"
    - "只保留答案不等于 str(a + b) 的那些对，并把每一个写成 '2+7=1' 这样的字符串。"
    - ["用 zip 同时遍历 problems 和 answers。", "带 if 的列表推导式只保留错题：[… for (a, b), got in zip(…) if …]。"]
  after: "zip 把每道题和它的答案配成对。if 只保留答案不等于 str(a + b) 的那些对。把错题并排读一读，就能看出规律，比如漏了进位。"

boss-forward:
  prompt: "python check.py `my_gpt.py` 打印了一行类似 forward = \"0a1b2c3d4e5f\" 的内容。把这一整行粘贴过来覆盖下面的第一行，或者只把那 12 个字母和数字填进 ____。"
  template: |
    forward = "____"      # 12 个字母和数字，带引号
    print(forward)
  tests:
    - "一个 12 位字母和数字组成的码"
    - "和用这些权重的参考模型得到相同的 logit"
  hints:
    - "码要带引号：forward = \"0a1b2c3d4e5f\"。把 check.py 打印的整行粘贴过来，包括引号。"
    - "原样粘贴 check.py 打印的码：引号之间的 12 个字母和数字。"
    - - "你的模型能跑，但算出来的东西不一样。先读 check.py 在码下面打印的内容：它会指出它能找到的最常见错误。"
      - "再看归一化：pre-norm（在每个子层之前归一化，而不是之后），输出头之前的最后一个归一化，以及 RMSNorm 的增益。"
      - "再看注意力：因果掩码必须挡住 t 之后的位置，分数要除以 √dₖ。"
      - "再看 qkv 的拆分：q 是前 d 列，然后是 k，然后是 v（.split(d, dim=-1)），之后才拆成多个头。"
      - "再看位置：位置嵌入加到 token 嵌入上，用的位置是 0 到 L − 1。"
      - "还有嵌入：第一个块的输入就是 tok(x) + pos(positions)，不乘 √d。"
    - "在放着 `check_weights.json` 的文件夹里运行 python check.py `my_gpt.py`，把它打印的码粘贴过来。"
  after: "你的代码和参考实现一致，所以你的模型算出的正是一个带 RMSNorm 和因果掩码的 pre-norm GPT 应该算出的东西。现在训练它。"

boss-report:
  prompt: "粘贴 python check.py `my_gpt.py` model.pt 打印的报告那一行：“report =”后面的全部内容。"
  template: |
    report = ____      # 例如 {"correct": 961, "wrong": ["…", …], "check": "…"}
    print(report["correct"], "of 1000 right")
  tests:
    - "1,000 道没见过的题至少答对 950 道"
    - "报告列出了前十道错题（如果不到十道，就全部列出）"
    - "列出的每道错题都是没见过的题，而且答案确实错了"
    - "校验码和报告的其余部分对得上"
  hints:
    - "把 check.py 的整份报告粘贴过来，从开头的 { 到结尾的 }。它有三部分：correct、wrong 和 check。"
    - - "1,000 道没见过的题答对不到 950 道。check.py 是自己做评估的，所以去看你的训练。最后几轮的验证准确率到了多少？"
      - "损失是不是只算答案数字？题目部分的 token 和每个 <pad> 的目标值都必须是 IGNORE，这样模型就不会被训练去猜随机的题目。"
      - "你是不是每当验证准确率超过目前最好成绩时就保存 model.pt？准确率可能会掉一轮，最后一轮不一定是最好的。"
      - "还是不到 950？多训练几轮：用 train(60) 代替 train(40)。跳到 95% 以上可能来得很晚。"
    - "列出的错题数和答对的数对不上。原样粘贴 check.py 打印的报告。"
    - "列出的某道题不在那 1,000 道没见过的题里。你的数据划分必须是起始文件里的 split(seed=0)，不能改。"
    - "校验码和这些数对不上。再原样复制一遍 check.py 打印的那一行，不要改动。"
    - "先训练，保存 model.pt，再运行 python check.py `my_gpt.py` model.pt，把报告粘贴过来。"
  after: "你的模型只靠例子就学会了两位数加法，而且能回答它从没见过的题。它的每个部分都是你自己写的。"
