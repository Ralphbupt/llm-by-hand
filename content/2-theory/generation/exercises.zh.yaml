greedy-p:
  prompt: "分数：mat 2.0，sofa 1.5，rug 1.0，roof 0.0，moon −1.0。T = 1 时，贪心挑 mat。用 e² ≈ 7.4，e^1.5 ≈ 4.5，e¹ ≈ 2.7，e⁰ = 1，e^−1 ≈ 0.4。softmax 给 mat 的概率是多少？（保留 2 位小数）"
  after: "五个 e^score 加起来是 7.4 + 4.5 + 2.7 + 1 + 0.4 = 16，所以 p(mat) = 7.4 / 16 ≈ 0.46。贪心每一次都取 mat，尽管它的概率还不到一半。"
  hints:
    - "这是 mat 的分数。softmax 会把它变成概率：e² 除以五个词的 e^score 之和。"
    - "这只是 e²。把它除以五个数的和：7.4 + 4.5 + 2.7 + 1 + 0.4。"
    - ["softmax：mat 的 e^score，除以五个词的 e^score 之和。", "把给你的五个 e 值加起来，再用 mat 的那个除以这个总和。"]

t-zero:
  prompt: "你采样（不是贪心），T = 0.01，所以每个分数都乘以 100。现在采样会怎样？"
  options: ["几乎每次都挑 mat，就像贪心", "五个词被挑中的次数差不多", "和 T = 1 时挑一样的词，频率也一样"]
  hints:
    - "T 非常大时才会这样。除以 0.01 会让分数之间的差距变大 100 倍，而不是变小。"
    - "每个分数都乘以 100，它们之间的差距也乘以 100。差距很大时，softmax 会怎样？"
  reveal: "几乎总是 mat。除以 0.01 之后，分数是 200 和 150，相差 50，而 e^50 极大（大约 5 × 10²¹）。T 趋向 0 时，采样就变成了贪心。T 变大时，它会趋向于等概率地挑每个词。"

top2-sofa:
  prompt: "概率：mat 0.46，sofa 0.28，rug 0.17，roof 0.06，moon 0.03。k = 2 的 top-k 保留 mat 和 sofa，再除以它们的总和。sofa 新的概率是多少？（保留 2 位小数）"
  after: "0.28 / (0.46 + 0.28) = 0.28 / 0.74 ≈ 0.38。mat 变成 0.62。rug、roof 和 moon 再也不会被挑中了。"
  hints:
    - "这是截断之前 sofa 的概率。去掉三个词之后，保留的两个词必须重新加起来等于 1。"
    - ["保留的两个概率必须重新加起来等于 1。你要除以什么？", "用 sofa 的 0.28 除以保留的两个词的总和。"]

topp-count:
  prompt: "排好序的概率：0.4631，0.2809，0.1704，0.0627，0.0231。p = 0.9 的 top-p 从最大的开始保留词，直到累计和达到 0.9。它保留几个词？"
  after: "累计和：0.4631，0.7439，0.9143。第三个词让总和越过了 0.9，所以它被保留，然后就停下。roof 和 moon 被去掉。"
  hints:
    - "两个词之后总和是 0.7439，仍然小于 0.9。继续加：越过 0.9 的那个词也要保留。"
    - "三个词之后总和已经是 0.9143。一旦达到 0.9，就停下。"
    - ["从最大的开始，一次加一个概率。总和达到 0.9 或更多时停下。", "第一个词之后总和是 0.4631。接下来加 0.2809。"]

topp-code:
  prompt: "补全 `top_p`：`keep_sorted` 必须按排好的顺序，对每个要保留的词都是 True。"
  template: |
    def top_p(probs, p):
        order = np.argsort(-probs)          # 最可能的在前
        sorted_p = probs[order]
        cum = np.cumsum(sorted_p)           # 累计和
        keep_sorted = ____
        keep = np.zeros(len(probs), dtype=bool)
        keep[order] = keep_sorted           # 换回原来的词序
        out = np.where(keep, probs, 0.0)
        return out / out.sum()

    probs = softmax(np.array([2.0, 1.5, 1.0, 0.0, -1.0]))
    print("cum:", np.round(np.cumsum(np.sort(probs)[::-1]), 4))
    print(np.round(top_p(probs, 0.9), 4))
  tests:
    - "p = 0.9 保留 mat、sofa、rug"
    - "p = 0.3：只有 mat（0.4631）就已经够了"
    - "四个一样的词，p = 0.6：累计和 0.25、0.5、0.75 → 保留 3 个"
  hints:
    - ["如果你写的是 cum < p，你就丢掉了越过 0.9 的那个词。当一个词*前面*的词还不够时，就保留它。", "cum 包含这个词自己。和 p 比较之前，先去掉这个词自己的概率。"]
    - "`keep_sorted` 需要每个词一个 True/False，长度和 `sorted_p` 一样。"
    - ["做法的第 2 步：如果排在一个词前面的词加起来小于 p，就保留这个词。", "cum[i] 是到第 i 个词为止（包括它）的总和。怎样只得到它前面那些词的总和？"]
  after: "cum − `sorted_p` 是排在每个词前面的那些词的总和。用它和 p 比较，就会保留越过 p 的那个词；最可能的那个词也总会保留，因为 0 < p。"

beam-greedy:
  prompt: "第一个词：a 0.5，the 0.4，one 0.1。a 之后：dog 0.4，cat 0.3，fox 0.3。the 之后：dog 0.9，cat 0.05，fox 0.05。one 之后：dog 0.5，cat 0.25，fox 0.25。贪心在每一步取最好的词。贪心写出的两词句子，概率是多少？（保留 2 位小数）"
  after: "贪心先取 a（0.5），再取 dog（0.4）：p(a dog) = 0.5 × 0.4 = 0.20。"
  hints:
    - "0.36 是 p(the dog)。贪心根本不看“the”：第 1 步它只取最好的那一个词，也就是 a。"
    - "这只是第一个词。再乘上贪心在“a”之后挑的第二个词的概率。"
    - ["贪心先取最好的第一个词，再取它后面最好的第二个词。", "最好的第一个词是 a（0.5）。a 之后哪个词最可能？"]

beam-wider:
  prompt: "第一个词：a 0.5，the 0.4，one 0.1。a 之后：dog 0.4，cat 0.3，fox 0.3。the 之后：dog 0.9，cat 0.05，fox 0.05。one 之后：dog 0.5，cat 0.25，fox 0.25。贪心写出“a dog”，概率 0.20。宽度为 2 的束搜索保留最好的两个第一个词（a 和 the），再看它们后面所有的第二个词。它能找到比贪心的 0.20 更好的句子吗？"
  options: ["能，它会找到一个概率更高的句子", "不能：“a”是最好的第一个词，所以最好的句子以“a”开头", "不能：只有两个词时，每种方法找到的句子都一样"]
  hints:
    - "一个句子的概率是第一个词 × 第二个词。一个差一些的第一个词，后面会不会跟着一个好得多的第二个词？"
    - "两步就足以让贪心出错。比较 a ×（a 之后最好的词）和 the ×（the 之后最好的词）。"
  reveal: "能。在第一步，“the”看起来不如“a”，但它后面有一个第二个词，比“a”之后的任何词都可能得多。正是因为把“the”留作候选，束搜索才找到了那个句子。"

beam-best:
  prompt: "第一个词：a 0.5，the 0.4，one 0.1。a 之后：dog 0.4，cat 0.3，fox 0.3。the 之后：dog 0.9，cat 0.05，fox 0.05。one 之后：dog 0.5，cat 0.25，fox 0.25。宽度为 2 的束搜索找到的最好句子，概率是多少？（保留 2 位小数）"
  after: "the dog：0.4 × 0.9 = 0.36。宽度 3 找到的也是它：在这棵小树里，宽度 2 已经找到了全部九个句子里最好的那个。"
  hints:
    - "这是贪心的句子。宽度 2 还会展开“the”。“the”后面接它最好的词是多少？"
    - ["列出以 a 或 the 开头的六个句子，把每个句子的两个概率相乘，取最大的。", "“a dog”是 0.5 × 0.4 = 0.20。现在算以“the”开头的三个句子。"]

repeat-predict:
  prompt: "一个计数模型看最后两个词。它见过“the cat sat on the mat .”的次数远多于其他任何句子。贪心从“the”开始写 14 个词。你预计会怎样？"
  options: ["同一个句子一遍又一遍", "十四个词，各不相同", "写完一句就停下"]
  hints:
    - "模型只看最后两个词。贪心再次走到“. the”时会怎样？"
    - "贪心在这里不会自己停下：“.”后面跟着“the”，句子又重新开始。"
  reveal: "同一个句子一遍又一遍。在“. the”之后，它回到了出发的地方，于是做出完全一样的选择：一个 7 个词的循环。"

penalty-cat:
  prompt: "在“. the”之后，ln p(cat) = −0.7752，ln p(dog) = −1.1852。“cat”已经写过一次，“dog”一次也没写过。惩罚为 1.0，分数 = ln p − 1.0 × （写过的次数）。cat 的分数是多少？（保留 4 位小数）"
  after: "−0.7752 − 1.0 × 1 = −1.7752。dog 仍然是 −1.1852，现在更高了，所以第二个句子以“the dog”开头。循环被打破了。"
  hints:
    - "这是惩罚之前 cat 的分数。它写过一次：减去 1.0 × 1。"
    - "你把惩罚加上去了。它会降低分数：−0.7752 − 1.0。"
    - ["从 cat 的 ln p 开始，cat 每写过一次，就减去一次惩罚。", "cat 写过一次，惩罚是 1.0。"]

tradeoff-predict:
  prompt: "T = 2 时采样会让概率变平，所以分给“任意词”的那 4% 影响大得多。200 个六词续写里，你预计有多大比例符合句子规则？"
  options: ["大约 100%", "大约 80%", "大约 20%"]
  reveal: "大约 20%（demo.py：20%）。每个词出错的机会都不大，但连续六个词必须全都对，而变平会把这些小机会放大。"

topp-trigram:
  prompt: "在“on the”之后，模型给出 mat 0.3445，rug 0.2451，park 0.1984，roof 0.1835，其他 10 个词每个 0.0029。p = 0.9 的 top-p 保留几个词？"
  after: "累计和 0.3445，0.5896，0.7879，0.9714：roof 越过了 0.9，所以保留四个词，正好是那四个地点。十个不太可能的词全被去掉。这就是 top-p 在这里规则得分 100% 的原因。"
  hints:
    - "三个词之后总和是 0.7879，仍然小于 0.9。第四个词要保留，因为是它越过了 0.9。"
    - "那十个 0.0029 的词根本轮不到：在它们之前总和就已经超过 0.9 了。"
    - ["从最大的开始加，记下累计和。", "数一数到让总和越过 0.9 的那个词为止（包括它）有几个词。"]

kv-new:
  prompt: "模型已经处理过 token 0 到 98，它们的 k 和 v 都在 KV 缓存里。模型刚刚挑出了 token 99。为了预测 token 100，它把 token 99 交给模型。现在要为几个 token 计算 k 和 v？"
  after: "只有 1 个：token 99，就是交给模型的那个。K 和 V 的其他 99 行从缓存里读出来。没有缓存的话，它要把全部 100 个重新算一遍。"
  hints:
    - "这是没有缓存的情况。token 0–99 这 100 个里，哪些的 k 和 v 已经存起来了？"
    - "99 行来自缓存。题目问的是现在要算几个。"
    - "token 99 是刚刚挑出来的。模型还没有处理过它，所以它的 k 和 v 不在缓存里。"
    - ["哪些 token 的 k 和 v 已经存起来了？", "只有这一步交给模型的那个 token 是新的。"]

q-rows:
  prompt: "有 KV 缓存：token 0、1、2 在缓存里，token 3 交给模型。这一步 Q 有几行？"
  after: "一行：token 3 的 q。K 和 V 有 4 行（3 行来自缓存，1 行是新的），所以分数是 1 × 4。"
  hints:
    - "K 和 V 有 4 行。但 Q 只为这一步交给模型的 token 提问。"
    - "K 和 V 有 3 行来自缓存。Q 从来不缓存：现在交给模型的是哪些 token？"
    - ["这一步只有 token 3 交给模型。", "交给模型的每个 token，Q 有一行。"]

kv-total:
  prompt: "没有缓存。一个一个地写出 token 0 到 99，第一步算 1 个 token 的 k，第二步算 2 个，……，最后一步算 100 个。总共算了多少次 k？"
  after: "5,050 次，而有缓存只要 100 次。没有缓存时，工作量随长度的平方增长；有缓存时，它随长度线性增长。"
  hints:
    - "这是 100 × 101。再除以 2：每一对（1 和 100、2 和 99、……）加起来都是 101，一共有 50 对。"
    - "100 是有缓存的情况。没有缓存时，每一步都要把到目前为止的所有 token 重算一遍。"
    - ["把 1 + 2 + … + 100 加起来。", "配成对：1 + 100，2 + 99，…… 每一对加起来是多少，一共有几对？"]

filter-code:
  prompt: "写出采样器的过滤部分：把分数除以 T（已经写好），只保留最大的 k 个，返回加起来等于 1 的概率，被去掉的词为 0。"
  template: |
    def filter_probs(scores, T, k):
        z = scores / T
        ____

    scores = np.array([2.0, 1.0, 0.5, -1.0])
    print(np.round(filter_probs(scores, 1.0, 2), 4))
  tests:
    - "T = 1，k = 2：只有最好的两个词，再除以它们的和，让它们加起来等于 1"
    - "T = 2 会在截断之前让分数变平"
    - "k = 1 就是贪心：全部概率都在最好的那个词上，即使它不是第一个"
  hints:
    - "用 cut 之前先定义它。浏览器已经给了你 softmax(x)。"
    - "函数必须返回概率。最后写 return softmax(...)。"
    - ["检查两件事。cut 是第 k 大的分数吗？被去掉的词在 softmax 之后正好是 0 吗？", "np.sort 是从小到大排的。先用 [::-1] 反过来，再取位置 k − 1。", "被去掉的词在 softmax 之前要设成 −∞，而不是 0：分数为 0 仍然会得到 e⁰ = 1。np.where 可以在分数低于 cut 的地方放上 −∞。"]
    - ["三步：找到第 k 大的分数，把比它小的分数都换成 −∞，再做 softmax。", "np.sort 是从小到大排的。把它反过来，再取位置 k − 1：那个分数就是 cut。", "保留至少等于 cut 的分数。np.where 可以在其他地方都放上 −∞。"]
  after: "被去掉的词在 softmax 之前是 −∞，所以 e^−∞ = 0，保留的词自己就加起来等于 1。先除以 T。它会改变保留下来的概率有多平，但不会改变哪些词在前 k 个里。"
