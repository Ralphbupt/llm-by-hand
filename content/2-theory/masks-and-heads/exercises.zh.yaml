fill-zero:
  prompt: "cat 的分数是 [0.34, 0.05, 挡住]；第三个词是 PAD token。如果被挡住的分数设成 0 而不是 −∞ 会怎样？用 e^0.34 ≈ 1.40，e^0.05 ≈ 1.05，e^0 = 1。PAD token 会拿到……"
  options: ["0% 的权重", "大约 29% 的权重", "正好 50% 的权重"]
  hints:
    - "e^0 是 1，不是 0。分数 0 照样作为一个普通的分数进入 softmax。"
    - "算一下：1 / (1.40 + 1.05 + 1)。"
  reveal: "1 / (1.40 + 1.05 + 1) = 1 / 3.45 ≈ 0.29。分数 0 是一个普通的分数，不是“什么都没有”。只有 −∞ 才给出 e^−∞ = 0，让 PAD token 正好拿到 0。"

mask-shape:
  prompt: "一句话有 6 个 token。它的因果掩码是什么形状？"
  after: "每一对（去看的词，被看的词）一个格子。"
  hints:
    - "因果掩码既取决于谁在看，也取决于谁被看。词 j 挡不挡住，要看是哪个词 i 在看它。"
    - "这是填充掩码的形状。词 i 能不能看到词 j，也取决于 i。"
    - ["每个权重对应掩码里的一个格子。", "行是去看的词，列是被看的词。"]

open-cells:
  prompt: "只用因果掩码，4 个 token。16 个权重里有几个可以不为零？"
  after: "1 + 2 + 3 + 4 = 10。第 i 行能看到 i + 1 个 token：它自己和它前面的所有 token。"
  hints:
    - "6 是被挡住的格子数，也就是对角线上方的那些。"
    - "这只是对角线。每个词还能看到它前面的词。"
    - ["一个词可以看它自己和它前面的每个词。一行一行地数。", "第 0 行看到 1 个 token，第 1 行看到 2 个。继续数下去，再加起来。"]

pad-broadcast:
  prompt: "一个批里有 2 个句子，每句 5 个 token。填充掩码是 (2, 1, 5)，分数是 (2, 5, 5)。广播之后掩码是什么形状？"
  after: "那个 1 被复制 5 次，每个查询行一次。每个句子保留自己的填充方式。"
  hints:
    - "这是广播之前的形状。那个 1 会被拉伸到和分数一样。"
    - "别丢掉 batch：有 2 个句子，每个都有自己的掩码。"
    - ["从右往左比较形状：(2, 1, 5) 和 (2, 5, 5)。", "大小为 1 的维会被拉伸成另一边的大小。"]

causal-mask:
  prompt: "构造因果掩码：在词会往后看的地方（列 > 行）是 True（或 1），其余地方是 False（或 0）。"
  template: |
    def causal_mask(L):
        return ____

    print(causal_mask(4).astype(int))
  tests:
    - "3 个 token：挡住对角线上方的 3 个格子"
    - null
    - "6 个 token：15 个被挡住的格子"
  hints:
    - ["拿代码打印出的表和规则对一对：正好在列 > 行的地方挡住（1）。一个词可以看它自己，所以对角线不挡，对角线下方也都不挡。", "np.triu 的哪个 k 是从对角线上面一格开始的？"]
    - ["挡住 = 严格在对角线上方（列 > 行）。np.triu 保留一张表的上三角。", "从一张 L×L、全是 True 的表开始，只保留它对角线上方的部分。", "np.triu 有第二个参数 k。k = 0 会把主对角线也保留下来；你需要的是它上面一格开始的三角。"]
  after: "k = 1 的 np.triu 只保留列 > 行的格子：也就是后面的词。对角线保持 False，因为一个词可以看它自己。L 个 token 有 L(L − 1)/2 个被挡住的格子，6 个 token 就是 15 个。"

concat-shape:
  prompt: "3 个词，2 个头，每个头给每个词输出 2 个数。各个头的输出合成一张叫 concat 的表，每个词一行。concat 是什么形状？"
  after: "各个头并排放：2 + 2 = 4 列，又回到了 `d_model`。"
  hints:
    - "各个头是并排放（列变多），而不是上下叠（行变多）。"
    - ["每个头给出 (3, 2)。", "把各个头左右并排，而不是上下叠起来。"]

head2-col:
  prompt: "2 个头，每个给每个词输出 2 个数。它们的输出并排放进一张表 concat，头 0 在最前面。头和列都从 0 开始数。头 1 的输出从 concat 的第几列开始？"
  after: "头 0 占第 0 列和第 1 列，头 1 占第 2 列和第 3 列。"
  hints:
    - "头 0 每个词有两个数，所以它占了第 0 列和第 1 列。"
    - "从 0 开始数：头 0 占第 0 列和第 1 列。"
    - ["头 0 的两个数排在最前面，在第 0 列和第 1 列。", "紧跟在第 0 列和第 1 列后面的是第几列？"]

dk-512:
  prompt: "一个模型的 `d_model` = 512，有 8 个头。每个头分到几个数（dₖ）？"
  after: "512 / 8 = 64。所以第 14 关（第 5 节）里的 √dₖ 通常是 √64 = 8。"
  hints:
    - "各个头分用 `d_model`；不是每个头都拿一份完整的副本。"
    - "各个头是拆分 `d_model`，而不是把它翻倍。"
    - ["各个头平分这 `d_model` 个数。", "把 512 个数平分成 8 片。"]

