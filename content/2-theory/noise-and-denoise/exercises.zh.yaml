alpha-bar-3:
  prompt: "β = 0.1、0.2、0.5 时，走完 3 步后 alpha-bar 是多少？"
  after: "0.9 × 0.8 × 0.5 = 0.36。走完三步，信号的方差还剩 36%。信号本身则要乘以 √0.36 = 0.6。"
  hints:
    - "这是 1 − (0.1 + 0.2 + 0.5)：你减去的是 beta 的和。alpha-bar 要乘的是每一步保留的部分。"
    - "这是把 beta 乘起来，也就是加进去的噪声。要乘的是每一步保留的部分：α = 1 − β。"
    - "这只是最后一步的 α。三个都要乘：0.9 × 0.8 × 0.5。"
    - ["alpha-bar 把每一步保留的部分乘起来。如果一步加进 β 的噪声，它保留多少？", "每一步保留 α = 1 − β：0.9、0.8 和 0.5。前两个是 0.9 × 0.8 = 0.72。"]

var-sum:
  prompt: "信号乘以 0.6，噪声乘以 0.8。0.6² + 0.8² 是多少？"
  after: "0.36 + 0.64 = 1。在每一步，信号方差加上噪声方差都等于 1。"
  hints:
    - "这是 0.6 + 0.8。先把每个数平方：0.6 × 0.6 和 0.8 × 0.8。"
    - ["先把每个数平方，再相加。", "0.6² = 0.36。0.8² 是多少？"]

x3-first:
  prompt: "x0 = [1, 2]，eps = [0.5, −1]，alpha-bar = 0.36。x₃ 的第一个数是多少？"
  after: "0.6 × 1 + 0.8 × 0.5 = 1.0。第二个数是 0.6 × 2 + 0.8 × (−1) = 0.4，所以 x₃ = [1.0, 0.4]。"
  hints:
    - "你直接用了 0.36 和 0.64。公式里用的是它们的平方根：0.6 和 0.8。"
    - "你没有缩放 x0。信号的权重是 √0.36 = 0.6：0.6 × 1 + 0.8 × 0.5。"
    - "你给噪声的权重是 1。它的权重是 √(1 − 0.36) = 0.8。"
    - ["只用第一个数：x0 的第一个数是 1，eps 的第一个数是 0.5。", "信号部分是 0.6 × 1。噪声部分是 0.8 × eps 的第一个数。把它们加起来。"]

end-of-road:
  prompt: "用 xₜ = √ᾱₜ x0 + √(1 − ᾱₜ) eps 往一团螺旋形的二维点里混入噪声。在 50 步的调度里，t = 50 时 alpha-bar 是 0.0045。这时螺旋是什么样子？"
  options: ["还是螺旋，只是没那么清晰", "一团圆圆的云，看不出一点螺旋", "所有的点都正好在 [0, 0]"]
  hints:
    - "信号的权重几乎是 0，可噪声的权重 √(1 − 0.0045) 几乎是 1。这会把每个点放在哪里？"
    - "每个点的位置只剩 √0.0045 ≈ 0.07。这够看出螺旋吗？"
  reveal: "一团圆圆的云。√0.0045 ≈ 0.07，所以每个点的位置只剩 7%，而噪声部分的强度是 √0.9955 ≈ 1。这团云几乎正好是一个正态分布。这一点很重要：在终点你确切知道数据长什么样，所以生成可以从那里出发。"

add-noise:
  prompt: "写出 `add_noise`。ab 是 alpha-bar。它应该对一个点或一个点数组都能用。"
  tests:
    - "页面上的例子：[1.0, 0.4]"
    - "一次两个点，alpha-bar 为 0.64"
    - "alpha-bar = 1 表示还没加噪声"
  hints:
    - ["把你的函数和页面顶部的公式逐项比一比。", "每一项都有一个权重。哪些权重在平方根下面？", "NumPy 里的平方根是 np.sqrt。两个权重都要用它。"]
    - ["照着公式 xₜ = √ᾱ x0 + √(1 − ᾱ) eps 逐项写。ᾱ 就是 ab。", "两项相加：信号 x0 和噪声 eps，各有各的权重。", "两个权重都是平方根。NumPy 的平方根是 np.sqrt。"]
  after: "√ab 缩放信号，√(1 − ab) 缩放噪声，所以两个方差加起来是 ab + (1 − ab) = 1。每个运算都是逐个数进行的，所以同一行代码对一个点或一个点数组都能用。"

noisy-at-t:
  prompt: "写出 `noisy_at`：给定干净点 x0、噪声 eps、一列 beta 和步数 t（从 1 开始数），先算出第 t 步的 alpha-bar，再返回加噪点 xₜ。"
  tests:
    - "页面上的例子：t = 3 时 alpha-bar 是 0.36，得到 [1.0, 0.4]"
    - "t = 2 只用前两步：alpha-bar = 0.9 × 0.8 = 0.72"
    - "一次两个点，beta 为 [0.5, 0.5]：alpha-bar 是 0.25，权重是 0.5 和 √0.75"
  hints:
    - ["你用到的每个名字都必须在 `noisy_at` 里面定义。先单独一行算出 ab，再在 return 那一行用它。"]
    - ["测试 1 通过了，但 t = 2 失败了。检查你的切片在第 t 步取了哪些 beta。", "第 t 步用前 t 个 beta，位置 0 到 t − 1。在位置 t 之前停下的切片正好取到这些。"]
    - ["两行：先算第 t 步的 alpha-bar，再用这个 alpha-bar 套 `add_noise` 的公式。你写 return 了吗？", "alpha-bar 把前 t 步每一步保留的部分乘起来。每一步保留 1 − β，不是 β。", "np.prod 把数组里的所有数乘起来。第二行和 `add_noise` 一样。"]
  after: "t 从 1 开始数，所以第 t 步用 betas[:t]，也就是位置 0 到 t − 1。每一步保留部分的乘积就是 alpha-bar。有了它，一个公式就直接跳到 xₜ，不用一步一步跑 t 步。"

undo-second:
  prompt: "在 t = 3（alpha-bar 为 0.36）时，x₃ = [0.7, 1.0]，真实噪声是 eps = [0.5, 0.5]。x0 的第二个数是多少？"
  after: "(1.0 − 0.8 × 0.5) / 0.6 = 0.6 / 0.6 = 1.0。第一个数是 (0.7 − 0.4) / 0.6 = 0.5，所以 x0 = [0.5, 1.0]。知道噪声，就能准确拿回干净的点。"
  hints:
    - "这是 1.0 / 0.6。先去掉噪声部分：1.0 − 0.8 × 0.5 = 0.6。"
    - "你乘了 0.6。撤销一次乘法要用除法：(1.0 − 0.4) / 0.6。"
    - "到这里都对：1.0 − 0.8 × 0.5 = 0.6。现在再除以 0.6。"
    - ["把正向公式倒着撤销：先去掉噪声部分，再撤销那个 0.6。", "只看第二个数：x₃ 是 1.0，eps 是 0.5。先去掉噪声部分 0.8 × 0.5。"]

zero-loss:
  prompt: "最简单的网络永远猜噪声是 [0, 0]。某个点的真实噪声是 [0.5, −1]。损失 mean((guess − eps)²) 是多少？"
  after: "(0.25 + 1) / 2 = 0.625。在很多份随机噪声上，这个最简单的猜法平均得 1.0，因为每个噪声数的方差是 1。任何有用的网络都必须比 1.0 好。"
  hints:
    - "这是和。损失是平均值：要除以 2 个数。"
    - "两个数都要平方：0.5² = 0.25，(−1)² = 1。再取平均。"
    - ["先算出两个差 guess − eps。", "两个差是 0 − 0.5 和 0 − (−1)。各自平方，再把两个平方取平均。"]

batch-shape:
  prompt: "一个训练批有 128 个加噪点。每一行输入是这个点的 x 和 y，再加上编码步数 t 的 12 个数。送进网络的形状是什么？"
  after: "128 行，每行 14 个数。输出是 (128, 2)：每个点一个噪声猜测。"
  hints:
    - "这是输出，也就是噪声猜测。输入还带着那 12 个时间数。"
    - "别忘了点本身：x 和 y，再加上 12 个时间数。"
    - ["每个点一行。描述一个点和它的步数要几个数？", "一行里有这个点的 x 和 y，再加上 12 个时间数。"]

loss-floor:
  prompt: "训练之前先猜一猜：如果训练完美，损失会停在哪里？"
  options: ["一直降到 0", "降到 1.0 以下，但会停在 0 以上的某处", "停在 1.0，和猜 [0, 0] 一样"]
  reveal: "它会停在 0 以上：对这个螺旋，大约停在 0.32。很多不同的干净点都可能落到同一个加噪点上，所以只看 xₜ，谁也没法确切知道加的是哪份噪声。最好的猜测是所有可能情况的平均，而它仍然有一些误差。这个下限取决于数据：点与点之间越容易互相预测，下限就越低。"

guess-clean:
  prompt: "写出 `guess_clean`：给定一个加噪点、网络的噪声猜测和 alpha-bar，返回对 x0 的猜测。"
  tests:
    - "页面上的例子回到了 [1, 2]"
    - "一次对两个点撤销 `add_noise`"
  hints:
    - ["按相反的顺序撤销 `add_noise`：最后加上的最先去掉。", "先去掉噪声项（它的权重乘以 `eps_hat`）。`add_noise` 给 x0 乘了什么？", "去掉噪声项之后，再除以信号的权重。"]
    - ["这就是第 2 节的倒推公式，把 eps 换成 `eps_hat`。", "倒着撤销 `add_noise`：先减去噪声项，再除以信号的权重。"]
  after: "这就是倒着跑的 `add_noise`：减去噪声项，再除以 √ab。用真实的 eps，你会准确得到 x0。用网络的 `eps_hat`，你得到的是一个猜测，它只能和噪声猜测一样好。"
