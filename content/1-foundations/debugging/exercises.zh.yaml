bcast-shape:
  prompt: "pred 的形状是 (4, 1)，y 的形状是 (4,)。pred − y 的形状是什么？"
  after: "广播从右往左比较形状：(4, 1) 和 (1, 4)。两个 1 都被重复，所以结果是 (4, 4)：每个预测值减去每个目标值。不报错，只是损失错了。"
  hints:
    - "那是你想要的，但 NumPy 不知道。从右往左比较形状：(4, 1) 和 (4,)。"
    - "y 是 (4,)，广播时就像 (1, 4)。哪些大小为 1 的维会被重复？"
    - ["广播从右往左比较大小（第 1 关）。把 y 写成 (1, 4)。", "(4, 1) 对 (1, 4)：每个 1 都被重复，直到和另一边对上。"]

bcast-b:
  prompt: "在 4 个点上拟合直线，有一个形状 bug：pred − y 的形状是 (4, 4)，所以损失把每一个预测值都和每一个目标值 3、3、7、7 比较。模型能做到的最好结果，是在每个地方都预测同一个数：和 3、3、7、7 的均方距离最小的那个数。它是哪个数？"
  after: "均值，(3 + 3 + 7 + 7) / 4 = 5。直线最后水平地停在 y = 5：w = 0，b = 5，损失停在 4，而不是 0.8。"
  hints:
    - "7 离两个 3 很远。哪个数在这四个数的正中间？"
    - "3 离两个 7 很远。哪个数在这四个数的正中间？"
    - ["平均来说，哪一个数离四个目标值都最近？", "和一列数的均方距离最小的那个数，就是它们的均值。"]

pred-overfit:
  prompt: "你只用 4 个样本反复训练一个小 MLP。500 步之后，损失仍然是 0.69，和一开始一样。这说明了什么？"
  options:
    - "它需要更多数据"
    - "模型、损失或更新里有东西坏了：正常的设置能轻松记住 4 个样本"
    - "对这个任务来说，模型太小了"
  hints:
    - "只有 4 个样本时，模型完全可以把它们记下来。更多的数据会让记忆更难，而不是更容易。"
    - "即使是小 MLP 也有几百个权重。记住 4 个样本绰绰有余。"
  reveal: "正常的模型几百步就能记住 4 个样本。如果它做不到，bug 就在代码里：损失、梯度、更新，或者你喂给它的数据。更多数据或更大的模型都修不好它。"

numgrad:
  prompt: "f(w) = w²，w = 3，h = 0.01。f(w + h) = 9.0601，f(w − h) = 8.9401。数值斜率 (f(w + h) − f(w − h)) / (2h) 是多少？"
  after: "(9.0601 − 8.9401) / 0.02 = 0.12 / 0.02 = 6。公式 2w 也给出 6，所以返回 2w 的梯度函数能通过检查。"
  hints:
    - "这只是分子。再除以 2h = 0.02。"
    - "除以 2h = 0.02，而不是 h。"
    - ["先做减法：9.0601 − 8.9401。", "分子是 0.12。现在除以 2h。"]

pred-gradbug:
  prompt: "在 w = 0.5、b = 0 处用 y = w·x + b 拟合 (1, 3)、(2, 3)、(3, 7)、(4, 7)。数值梯度是 dw = −21.5，db = −7.5。某人的公式给出 dw = −10.75，db = −3.75。最可能的 bug 是什么？"
  options:
    - "公式漏掉了平方带来的因子 2"
    - "数值梯度错了，因为 h 太小"
    - "公式的符号错了"
  hints:
    - "数值梯度是 −21.5 和 −7.5。把公式给出的数和它们比较：比值是多少？"
    - "两个答案都是负的。改为比较它们的大小。"
  reveal: "公式给出的两个数都恰好是数值结果的一半。误差² 的导数是 2 × 误差，而公式丢了这个 2。数值检查告诉你“有”东西错了；这些数之间的比值常常告诉你错的是“什么”。"

numgrad-code:
  prompt: "写出循环体：w 第 i 项的数值斜率。把 w[i] 增加 h，再减少 h，然后放回原处。把 ____ 换成你需要的若干行。"
  template: |
    def num_grad(f, w, h=1e-5):
        g = np.zeros_like(w)
        for i in range(len(w)):
            ____
        return g

    x = np.array([1., 2., 3., 4.])
    y = np.array([3., 3., 7., 7.])
    def loss_wb(p):                       # p = [w, b]
        return ((p[0] * x + p[1] - y) ** 2).mean()

    print(num_grad(loss_wb, np.array([0.5, 0.0])))   # 公式给出 [-21.5, -7.5]
  tests:
    - "在 w = 0.5、b = 0 处的直线拟合"
    - "f = w0² + w1² 在 (3, −1) 处：斜率是 2·3 和 2·(−1)"
    - "算完之后 w 回到了原处"
  hints:
    - "斜率对了，但 w 被动过了。两次移动之后，再加回 h，让 w[i] 回到起点。"
    - "每一行都放在 for 循环里面，缩进和 ____ 一样。"
    - "每次移动之后计算 f(w)，并把两个值都存下来，比如存成 fp 和 fm。"
    - ["把 w[i] 增加 h，计算 f(w)。然后把它移到 w[i] − h，再计算一次 f(w)。", "从 w[i] + h 出发，要移动多远才能到 w[i] − h？", "把 f 的两个值存到两个名字里，然后用上面的数值斜率公式求 g[i]。"]
    - ["w[i] 移动三次：上、下、回来。前两次之后调用 f(w)。", "三次移动分别是 +h、−2h、+h，所以 w[i] 最后回到起点。", "g[i] 是 f 的两个值之差，除以两个点之间的距离。"]
  after: "每次只动一项，每一项就得到一个斜率：g[i] 是 f 沿 w[i] 方向的斜率。把 w[i] 放回去很重要，因为下一项的斜率必须在同一个 w 处测量。每个权重要调用两次 f，所以这是一种检查手段，而不是训练方法。"

diverge-w:
  prompt: "f(w) = w²，所以梯度是 2w。从 w = 1 开始，用 lr = 1.5 走梯度下降的步子 w ← w − lr · 2w。3 步之后 w 是多少？"
  after: "每一步都是 w − 3w = −2w：1 → −2 → 4 → −8。每一步都跳过了最低点，而且落得越来越远。"
  hints:
    - "检查一下符号：每一步都把 w 乘以 −2。"
    - "那是一步之后的值。还有两步。"
    - ["w − 1.5 · 2w = w − 3w。一步把 w 乘以多少？", "一步之后，w = 1 − 3 = −2。再这样做两次。"]

pred-nan:
  prompt: "损失依次是 16、86、466、2550……然后是 inf，再过几十步变成 NaN。如果每个数一开始都正常，NaN 能从哪里来？"
  options:
    - "来自含 inf 的计算：inf − inf、0 × inf 和 inf / inf 都是 NaN"
    - "来自被舍入成 0 的极小的数"
    - "NaN 在 GPU 上会随机出现"
  hints:
    - "一个被舍入成 0 的数就是 0，0 + 1 仍然是 1。对 inf 做哪些运算没有答案？"
    - "NaN 是有原因的。看看它出现之前那些数是什么样的。"
  reveal: "一旦某个值是 inf，像 inf − inf 这样的和、0 × inf 这样的积就没有答案，于是得到 NaN。之后 NaN 会扩散：NaN + 1 = NaN，它碰到的每个权重都会变成 NaN。找到第一个出现 inf 或 NaN 的步，在那里修正原因，通常是学习率太大，或者 log(0)。"

zero-grad-sum:
  prompt: "一个循环忘了 `opt.zero_grad()`。对某一个权重，backward() 在前 3 步每一步都给出梯度 2。第 3 步运行 opt.step() 时，这个权重的 .grad 是多少？"
  after: "backward() 会往 .grad 上加：2，然后 4，然后 6。第三步用的是 6，是真实梯度的三倍，而且还在继续变大。"
  hints:
    - "那是一步的梯度。backward() 会往 .grad 上加（第 9 关）。这里没有任何东西清零它。"
    - ["backward() 把新的梯度加到 .grad 已有的值上。", "第 1 步之后，.grad 是 2。第 2 步之后，是 2 + 2 = 4。第 3 步之后呢？"]

pred-shift:
  prompt: "一个下一个 token 模型在 [<bos>, a, b, c] 上训练。bug 是：目标值就是输入本身 [<bos>, a, b]，而不是 [a, b, c]。训练损失几步之内就降到接近 0。它写文本时会怎样？"
  options:
    - "写得很好：损失几乎是 0"
    - "写出胡言乱语：它学会的是复制正在看的那个 token，这根本不需要学任何关于语言的东西"
    - "它什么都写不出来"
  hints:
    - "损失这么快就接近 0，很可疑。要预测一个你已经能看到的 token，最简单的办法是什么？"
    - "它总会写出点什么。它学会预测的是什么？"
  reveal: "它学会了复制自己的输入，这很容易，所以损失降得很快。生成时，它会不停地重复最后一个 token。损失降得比你预期的快得多，这本身也是一个症状：通常是输入里已经包含了答案（没有错位，或者掩码让一个词看到了未来）。"

boss-line:
  prompt: "Boss，A 部分。注释里队友的版本有三个 bug。在 ____ 处为 `train_line` 写出能正常工作的函数体。行数不限。"
  template: |
    def train_line(x, y, lr=0.05, steps=2000):
        # 队友的版本。运行时不报错，但学到的直线是错的。
        #   w, b = 0.5, 0.0
        #   gw, gb = 0.0, 0.0
        #   losses = []
        #   for step in range(steps):
        #       pred = (w * x + b).reshape(-1, 1)
        #       err = pred - y
        #       losses.append((err ** 2).mean())
        #       gw += (2 * err * x.reshape(-1, 1)).mean()
        #       gb += (2 * err).mean()
        #       w = w + lr * gw
        #       b = b + lr * gb
        #   return w, b, losses
        ____

    x = np.array([1., 2., 3., 4.])
    y = np.array([3., 3., 7., 7.])
    w, b, losses = train_line(x, y)
    print(round(w, 3), round(b, 3), round(losses[-1], 3))    # 应该是 1.6 1.0 0.8
  tests:
    - "四个点：最好的直线是 w = 1.6，b = 1"
    - "最终的损失是可能的最低值 0.8"
    - "第一个损失，在 w = 0.5、b = 0 处，是 16.375"
    - "三个点正好落在 y = 2x + 1 上"
  hints:
    - "每一行都放在函数里面，缩进和 ____ 一样（for 循环体再深一级）。"
    - ["直线对了，但 losses[0] 不是起点 w = 0.5、b = 0 处的损失。打印 losses[0] 看看。", "在每一步改动 w 和 b 之前，先记下这一步的损失。"]
    - ["用这一关的三项检查来查它：形状、.grad 怎样清零、更新的方向。", "pred 应该是 (4,)，每一步的梯度应该只属于这一步，而一步要沿着梯度的反方向走。"]
    - ["三个 bug：一个形状，一个从不清零的累加，一个符号。", "对这 4 个点打印 pred − y 的形状。它是你期望的形状吗？", "然后跟着 gw 走两步：它只是这一步的梯度吗？更新是顺着梯度走，还是逆着梯度走？"]
  after: "三个不报错的 bug，三项检查：err 的形状是 (4, 4)，因为 (4, 1) − (4,) 会广播；gw 和 gb 把每一步的梯度都加了起来，因为 += 从不清零；而 w + lr × gw 让损失变大而不是变小。"

boss-lm:
  prompt: "Boss，B 部分。`lm_batch` 构造一个下一个 token 的批：输入 X、目标值 Y，以及 keep（损失应该计入的地方为 True）。注释里队友的版本有两个 bug。在 ____ 处写出能正常工作的函数体。"
  template: |
    def collate(seqs, pad=0):                 # 正确（支线 U4）
        L = max(len(s) for s in seqs)
        P = np.full((len(seqs), L), pad)
        for i, s in enumerate(seqs):
            P[i, :len(s)] = s
        return P

    def lm_batch(seqs, pad=0):
        # 队友的版本：
        #   P = collate(seqs, pad)            # (B, L)，PAD 在末尾
        #   X = P[:, :-1]
        #   Y = P[:, :-1]
        #   keep = Y == pad
        #   return X, Y, keep
        ____

    X, Y, keep = lm_batch([[1, 5, 3, 8], [1, 2, 9], [1, 7]])
    print(X); print(Y); print(keep)
  tests:
    - "X：每一行除了最后一个 token 之外的所有 token"
    - "Y：每个位置上的下一个 token（错开一位）"
    - "keep：真正的目标值为 True，PAD 目标值为 False"
    - "pad = −1：三个真正的目标值"
  hints:
    - ["打印第一行 [1, 5, 3, 8] 的 X 和 Y。它们应该有什么不同？", "Y 等于 X。位置 t 的目标值是位置 t + 1 的 token。X 的第一列的目标值在 P 的哪一列？"]
    - ["打印第三行 [1, 7] 的 keep。它的哪些目标值是 PAD？", "keep 在 PAD 目标值上是 True。它应该正好相反。哪个比较对真正的 token 为 True、对 PAD 为 False？"]
    - "每一行都放在 `lm_batch` 里面，缩进和 ____ 一样。"
    - ["两个 bug：错位和掩码。", "写出第一行 [1, 5, 3, 8] 的 X 和 Y。它们必须错开一个位置。", "然后读第三行 [1, 7] 的 keep：哪些目标值是真正的 token？"]
  after: "X 去掉最后一个 token，Y 去掉第一个，所以 Y[t] 是 X[t] 之后的那个 token。keep 标出损失要计入的目标值：真正的 token，而不是 PAD。如果 Y = X，模型学会的是复制它的输入：损失降得很快，但模型什么有用的东西都没学到。"

boss-report:
  prompt: "Boss，C 部分。把 python check.py `my_train.py` 打印的最后一行粘贴到引号之间。如果还有检查没通过，可以粘贴它的 FAIL 那一行，获得关于第一项没通过的检查的提示。"
  template: |
    line = "____"      # 它看起来像这样：U5 PASS 0.980 1a2b3c4d
    print(line)
  tests:
    - "一行来自 check.py 的输出：U5、PASS 或 FAIL、一个数、代码"
    - "代码和这一行的其余部分对得上：这一行没有被改过"
    - "检查 1，split"
    - "检查 2，batches"
    - "检查 3，forward"
    - "检查 4，`train_step`"
    - "检查 5：留出集准确率至少 0.95"
  hints:
    - "粘贴完整的最后一行，四个部分都要有：U5、PASS 或 FAIL、那个数和代码。"
    - "粘贴 check.py 打印的最后一行，就是以 U5 开头的那一行。"
    - "代码和这一行的其余部分对不上。照 check.py 打印的样子重新复制这一行，不要改动。"
    - ["检查 1 说有些点同时在两个集合里。模型训练过的留出点，会让留出集上的准确率看起来比实际好。", "看看 split：每个集合取的是哪些行？对 n = 10 写出这两个切片。", "留出集应该从训练集结束的地方开始。"]
    - ["检查 2 说有些点带着错误的类别：大约一半，就好像类别是单独打乱的。", "看看 batches：它生成了几个随机顺序？", "输入和类别必须用同一个顺序来取（支线 U4）。"]
    - ["检查 3 说 forward(x) 的每一行加起来都是 1。是什么把分数变成了这样？", "看看 `F.cross_entropy` 期望的输入是什么（第 10 关）：概率，还是原始分数？", "`F.cross_entropy` 自己会做 softmax。在 forward 里再做一次 softmax，就做了两次。"]
    - ["检查 4 说，在同一个批上调用两次，权重移动的距离大约是两个普通梯度步的 1.5 倍。第二步太大了。", "loss.backward() 会往 .grad 上加（第 9 关）。什么会把它清零？", "每一步都需要在 loss.backward() 之前调用 `opt.zero_grad()`。"]
    - ["检查 1 到 4 都通过了，但留出集准确率低于 0.95。", "你改过 train 或 `make_data` 吗？它们原本是对的。和 `broken_train.py` 比较一下。"]
    - "照 check.py 打印的样子，原样粘贴最后一行。"
  after: "四个 bug，没有一个报错：一个也被拿来训练的留出集，和点分开打乱的类别，做了两次的 softmax，以及一直在累加的梯度。每一个都只表现为一个错误的数。行末的代码只能说明你原样粘贴了它；这一部分靠的是你的诚实。"
