h1:
  prompt: "wₓ = 1，wₕ = 0.5，b = 0，h₀ = 0，x₁ = 1。取 tanh(1) ≈ 0.76。h₁ = tanh(wₓ·x₁ + wₕ·h₀ + b) 是多少？（保留 2 位小数）"
  after: "z = 1×1 + 0.5×0 + 0 = 1，tanh(1) ≈ 0.76。"
  hints:
    - "这是 z。h 是 tanh(z)。"
    - ["先算 z = wₓ·x₁ + wₕ·h₀ + b。", "z = 1×1 + 0.5×0 + 0。然后 h = tanh(z)。"]

h2:
  prompt: "wₓ = 1，wₕ = 0.5，b = 0。h₁ = 0.76，x₂ = 0。取 tanh(0.38) ≈ 0.36。h₂ = tanh(wₓ·x₂ + wₕ·h₁ + b) 是多少？（保留 2 位小数）"
  after: "z = 1×0 + 0.5×0.76 = 0.38，tanh(0.38) ≈ 0.36。"
  hints:
    - "这是 z。现在对它取 tanh。"
    - "输入是 0，但隐藏状态不是：wₕ·h₁ = 0.5 × 0.76。"
    - ["这次输入那部分是 0。tanh 里面还剩什么？", "只剩 wₕ·h₁ = 0.5 × 0.76。算出来，再取 tanh。"]

weights:
  prompt: "这个 RNN 的隐藏状态只有一个数：hₜ = tanh(wₓ·xₜ + wₕ·hₜ₋₁ + b)。它读一个有 1,000 个输入的序列。它有多少个要学的数（权重和偏置）？"
  after: "三个：wₓ、wₕ 和 b，在 1,000 步的每一步里重复使用。"
  hints:
    - "各步共用权重。第 2 步没有新的 wₓ。"
    - "wₓ 和 wₕ，没错。这道题把偏置 b 也算进去。"
    - "各步共用权重和偏置。第 2 步没有新的 wₓ。"
    - ["公式里哪些字母是学出来的，哪些每一步都会变？", "x 和 h 每一步都变。其他字母只学一次，由全部 1,000 步共用。"]

grad-4:
  prompt: "wₕ = 0.5。往回走一步，梯度乘上 wₕ·(1 − h²)。如果不管 tanh，往回三步会得到 0.5³ = 0.125。加上 tanh 后，∂h₄/∂h₁ 是……"
  options: ["比 0.125 大", "正好 0.125", "比 0.125 小"]
  hints:
    - "每个因子是 0.5 × (1 − h²)。h 不是 0 时，1 − h² 比 1 大还是小？"
  reveal: "更小。每个因子是 0.5 × (1 − h²)，只要 h 不是 0，1 − h² 就小于 1。这里三个因子是 0.434、0.484 和 0.496，所以 ∂h₄/∂h₁ = 0.104：tanh 让梯度缩得更快。"

explode:
  prompt: "没有激活函数，wₕ = 1.5。30 步之后，梯度是 29 个 1.5 的乘积。它大约有多大？"
  options: ["大约 45", "大约 1,000", "大约 128,000"]
  hints:
    - "45 是 1.5 × 29，相当于把 1.5 加了二十九次。这里是 29 个因子相乘：1.5 × 1.5 × 1.5 × …"
    - "1.5¹⁰ 就已经大约是 58 了。再乘 1.5 十九次。"
  reveal: "1.5²⁹ ≈ 127,834。反复相乘增长得很快：29 个 1.5 得到的数大了大约 128,000 倍。wₕ = 0.5 时，它是 0.5²⁹ ≈ 0.000000002。"

k40:
  prompt: "一个隐藏状态有 32 个数的 RNN，在 k = 20 时能完美学会“记住第一个符号”。现在 k = 40：规则一样，训练 1,500 步。它能达到多少准确率？"
  options: ["大约 100%", "大约 75%", "大约 50%，瞎猜"]
  hints:
    - "从最后一步传回第 1 步的信号，是 39 个因子的乘积，每个都小于 1。能传到多少？"
  reveal: "49.5%：瞎猜。规则很简单，但训练信号要穿过 39 步，在路上消失了。demo.py 训练 k = 5 和 k = 40，并打印这两个结果。"

rnn-step:
  prompt: "写出循环里的更新：h 变成 tanh(x 乘 Wₓ，加 h 乘 Wₕ，再加 b)。"
  after: "每一步都用同样的 Wx、Wh 和 b；只有 x 和 h 在变。右边的 h 是旧的隐藏状态，新的会把它替换掉。前面的输入就是这样传到后面的步骤的。"
  tests:
    - "独热输入 0、1、2"
    - "一个把隐藏状态的两个数互换的 Wₕ，b = 0.1"
  hints:
    - "检查一下顺序。向量是行：x (D) @ Wx (D, H) 得到 H 个数，h (H) @ Wh (H, H) 得到 H 个数。"
    - "是不是忘了 b？第二个测试里 b = 0.1。"
    - ["一个 tanh 里有三部分：输入那部分、隐藏状态那部分，还有 b。", "向量是行，所以每部分都是一个向量 @ 它的权重矩阵：先是输入，再是隐藏状态。", "测试 1 的第一步时，h 还全是 0，所以只剩输入那部分和 b。它们的和是 [1, 0]。"]

rnn-all:
  prompt: "写出 `rnn_all`：运行同样的循环，但保留每一个隐藏状态，让结果每一步一行，形状 (L, H)。把 ____ 换成你需要的任意多行。"
  after: "在更新之后追加，存下的是 h₁ … `h_L`，每个输入一个，而不会存下起始的那些 0。np.stack 把 L 个长度为 H 的向量组成的列表变成一个 (L, H) 的数组。后面的模型会读它的每一行，而不只是最后一行。"
  tests:
    - "独热输入 0、1、2：三行，最后一行就是 rnn-step 里的那个 h"
    - "一个把隐藏状态的两个数互换的 Wₕ，b = 0.1"
    - "L = 5 步，H = 4：形状 (5, 4)"
  hints:
    - "在循环之前先建一个空列表：hs = []。"
    - "到最后 hs 还是空的。在循环里、更新 h 之后，把 h 追加进去。"
    - "向量是行：x @ Wx 和 h @ Wh，按这个顺序。"
    - ["把 hs 打印出来：它存了每一步新的 h 吗？", "在更新之后追加 h，不要在之前。第一行应该是第一步的 tanh，而不是 0。", "每一步一行：每个输入追加一次，在循环里面。"]
    - "是不是忘了 b？第二个测试里 b = 0.1。"
    - ["三部分：一个空列表，上一题的循环，还有一行追加 h 的代码。", "在循环里，先更新 h，再把它加到列表里。顺序很重要。"]
