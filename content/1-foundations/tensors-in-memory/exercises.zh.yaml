addr-2-3:
  prompt: "一个形状 (3, 5) 的数组是内存连续的，所以它的步长是 (5, 1)，起点是内存位置 0。元素 [2, 3] 在哪个内存位置？"
  after: "起点 + i·s0 + j·s1 = 0 + 2·5 + 3·1 = 13。第 2 行前面有两整行，每行 5 个数，再沿着这一行走 3 步。"
  hints:
    - "11 是 2·4 + 3：这用的是每行 4 个数。这个数组每行 5 个数，所以行步长是 5。"
    - "17 是 2 + 3·5：步长的顺序用反了。行下标 i 配第一个步长 5。"
    - "6 是 2·3。每个下标乘上它自己的步长，再把乘积加起来。"
    - ["用地址规则：起点 + i·s0 + j·s1。", "i = 2 配 s0 = 5，j = 3 配 s1 = 1。"]

strides-234:
  prompt: "一个形状 (2, 3, 4) 的数组是内存连续的。按元素算，它的步长是多少？像形状那样输入，比如 (1, 2, 3)。"
  after: "最后一个轴每步走 1。中间的轴走一步要跳过一整行 4 个数。第一个轴走一步要跳过一整块 (3, 4)：12。"
  hints:
    - "数对了，顺序反了。步长为 1 的是最后一个轴。"
    - "每个步长是它右边各维大小的乘积，不是左边：第一个轴是 3·4。"
    - "接近了：24 是 3·4·2。第一个轴跳过的是一块 (3, 4)，所以是 3·4。"
    - ["最后一个轴的步长是 1。其他每个步长都是它右边各维大小的乘积。", "中间的轴：它右边只有大小 4。第一个轴右边有两个大小。"]

code-strides:
  prompt: "写出 `contiguous_strides`(shape)：内存连续的数组的步长，按元素算。从右往左走一遍形状。"
  template: |
    def contiguous_strides(shape):
        strides = []
        step = 1
        for size in reversed(shape):
            ____
        return strides

    print(contiguous_strides((3, 4)))       # [4, 1]
    print(contiguous_strides((2, 3, 4)))    # [12, 4, 1]
  after: "每个步长都是它右边各维大小的乘积。循环从右边开始，所以先记下当前的步子，再乘上这个轴的大小。如果先乘，最后一个步长就会是 4 而不是 1。"
  tests:
    - "形状 (3, 4) 的 x 步长是 (4, 1)"
    - "形状 (2, 3, 4) 的步长是 (12, 4, 1)"
    - "只有一个轴：步长 1"
    - "(B, h, L, dₖ) = (2, 4, 10, 16) 的步长是 (640, 160, 16, 1)"
  hints:
    - ["每个大小都要做两件事：记下当前的步子，然后把步子变大。", "循环从右边开始，所以每个新步长都放在列表最前面。用 strides.insert(0, …)。", "对形状 (2, 3, 4)，步子依次是 1、4、12。每个新步子都是旧步子乘上一个大小。"]
    - ["最后一个轴的步长是 1，也就是起始的步子。越往左的轴，要跳过它右边的所有东西。", "空格里要写两行：一行把当前步子加进列表，一行把步子变大。", "对形状 (3, 4)，循环先看到大小 4。它先记下步子 1，然后步子变成 1 × 4 = 4。"]

strides-T:
  prompt: "x = np.arange(12.0).reshape(3, 4) 的形状是 (3, 4)，步长按元素算是 (4, 1)。x.T 的步长是多少？像形状那样输入。"
  after: "x.T 的形状是 (4, 3)，步长是 (1, 4)。在 x.T 里往下走一行，就是在 x 里走一列：内存里走 1 步。在 x.T 里沿一行走，就是在 x 里沿一列往下走：4 步。"
  hints:
    - "(4, 1) 是 x 本身的步长。转置会交换它们，就像交换形状一样。"
    - "x.T 每行 3 个数，但它没有新的内存。它的数还在 x 当初放的地方。"
    - ["转置把形状 (3, 4) → (4, 3)。步长也以同样的方式交换。", "x.T[1, 0] 就是 x[0, 1]，它在内存里离 x[0, 0] 一步远。"]

pred-write:
  prompt: "x = np.arange(12.0).reshape(3, 4)，所以 x[1, 0] 是 4。然后 y = x.T，再执行 y[0, 1] = 100。现在 x[1, 0] 是多少？"
  options: ["4：y 是另一个数组", "100：y 和 x 用的是同一块内存", "报错：不能往转置里写数"]
  hints:
    - "x.T 得到的是新的内存，还是同一块内存上的新步长？`np.shares_memory(x, x.T)` 能回答这个问题：它返回 True。"
    - "转置视图是可以写的。只有特殊的视图是只读的，比如 `np.broadcast_to` 的结果。"
  reveal: "100。y[0, 1] 在内存位置 0 + 0·1 + 1·4 = 4，x[1, 0] 也在那里。视图只是读同一块内存的另一种方式，所以通过它写数会改变原数组。想要各自独立的数，就用 x.T.copy()。"

strides-swap:
  prompt: "t 的形状是 (2, 3, 4)，步长是 (12, 4, 1)。np.swapaxes(t, 1, 2) 的形状是 (2, 4, 3)，它的步长是多少？像形状那样输入。"
  after: "第 1、2 轴交换位置，形状和步长都交换：(12, 4, 1) → (12, 1, 4)。内存里没有一个数移动。"
  hints:
    - "(12, 3, 1) 是一个形状 (2, 4, 3) 的新的内存连续数组。交换轴不会产生新内存：它只交换那两个步长。"
    - "只有第 1、2 轴交换。第 0 轴保持步长 12。"
    - ["交换轴就是交换它们的步长，别的都不变。", "第 0 轴保持步长 12。第 1、2 轴的步长是哪两个？"]

flat-T-1:
  prompt: "small = np.arange(6.0).reshape(2, 3) 是 [[0, 1, 2], [3, 4, 5]]。small.T.reshape(6)[1] 是多少？"
  after: "small.T 是 [[0, 3], [1, 4], [2, 5]]。按行顺序是 0, 3, 1, 4, 2, 5，所以第 1 个元素是 3。这些数在内存里并不是按固定的步子排开的（0 → 3 → 1 …），所以 reshape 会复制。"
  hints:
    - "1 是 small.reshape(6)[1]：那是内存顺序。reshape 是按行读 small.T，而 small.T 的第 0 行是 [0, 3]。"
    - ["先写出 small.T：它的第 0 行是 small 的第 0 列。", "small.T = [[0, 3], [1, 4], [2, 5]]。一行一行地读。"]

pred-copy:
  prompt: "x = np.arange(12.0).reshape(3, 4)。下面哪一个一定是副本，有自己的内存？"
  options: ["x.reshape(6, 2)", "x.T.reshape(12)", "x[::2]"]
  hints:
    - "x 是内存连续的。按行顺序读它，访问的内存是 0, 1, 2, …，所以任何 reshape 都只是新的步长。"
    - "x[::2] 取第 0 行和第 2 行。行步长从 4 变成 8：仍然是视图。"
  reveal: "x.T.reshape(12)。按行顺序读 x.T，访问的内存是 0, 4, 8, 1, 5, 9, … 没有哪一个步长能做到这一点，所以 NumPy 会复制。另外两个都是视图。"

heads-strides:
  prompt: "注意力头的输出 out 形状是 (2, 4, 10, 16) = (B, h, L, dₖ)，步长是 (640, 160, 16, 1)。out.transpose(1, 2) 的形状是 (2, 10, 4, 16)，它的步长是多少？像形状那样输入。"
  after: "第 1、2 轴交换步长：(640, 160, 16, 1) → (640, 16, 160, 1)。步长不再从左到右递减，所以结果不是内存连续的，view(2, 10, 64) 会拒绝。"
  hints:
    - "(640, 64, 16, 1) 是一个新的内存连续 (2, 10, 4, 16) 数组的步长。那是 .contiguous() 会得到的。transpose 只做交换。"
    - ["transpose(1, 2) 只交换第 1、2 轴的步长，别的不变。", "第 0 轴和第 3 轴保持 640 和 1。第 1、2 轴的步长是哪两个？"]

bytes-bc:
  prompt: "v 是一个形状 (4,) 的 float32 向量，每个 float32 数占 4 个字节。`np.broadcast_to(v, (1000, 4))` 存了多少字节的内存？"
  after: "16 个字节：只有 v 的 4 个数。这个 (1000, 4) 的视图步长是 (0, 1)，所以 1000 行读的都是同样的 4 个数。真正复制一份要 16 000 个字节。"
  hints:
    - "16 000 个字节是一份真正的 (1000, 4) 副本。`broadcast_to` 得到的是行步长为 0 的视图。"
    - "4000 是 1000 × 4：视图显示出来的格子数。其中有多少是单独存下来的？"
    - ["行步长为 0 时，每一行读的都是同一块内存。", "只有 v 自己的数被存了下来，而且只存一次。"]

code-read:
  prompt: "写出那一行代码：给定步长和起点偏移，从内存 buf 里读出元素 [i, j]。测试会用到转置、隔列取、切片和广播。"
  template: |
    def read(buf, shape, strides, offset=0):
        rows, cols = shape
        out = []
        for i in range(rows):
            row = []
            for j in range(cols):
                row.append(____)
            out.append(row)
        return out

    # x = np.arange(12).reshape(3, 4) 的内存
    buf = list(range(12))
    print(read(buf, (3, 4), (4, 1)))         # x 本身
    print(read(buf, (4, 3), (1, 4)))         # x.T
  after: "这一关里的每个视图，都是用不同的形状、步长和起点去读同一块内存。转置交换步长，隔列取把一个步长乘大，切片移动起点，广播把一个步长设为 0。"
  tests:
    - "x 本身：形状 (3, 4)，步长 (4, 1)"
    - "x.T：形状 (4, 3)，步长 (1, 4)"
    - "x[:, ::2]：步长 (4, 2)"
    - "x[1:, 1:]：起点 5"
    - "`broadcast_to`(x[0], (3, 4))：行步长 0"
  hints:
    - "用一个整数作 buf 的下标：内存位置。用 strides[0] 和 strides[1]，不要用整个元组 strides。"
    - "位置超出了 buf 的末尾。每个下标乘的是它自己的步长吗？i 配 strides[0]。"
    - ["x 本身对了，x.T 不对。你用的是步长，还是固定的行长？", "行的步子必须来自 strides[0]，而不是 cols。"]
    - "这个切片从位置 5 开始。把 offset 加到位置上。"
    - ["用地址规则：起点 + i·s0 + j·s1。然后读 buf 在那个位置的数。", "起点就是参数 offset。行下标配第一个步长，列下标配第二个步长。", "手算检查一个元素：x.T[0, 1] 应该是 4。把 i = 0、j = 1 代进你的那一行。得到 4 吗？"]
