code-backward:
  prompt: "写出 backward 在 build(self) 之后的结尾部分：设定输出节点的起始梯度，然后按拓扑序的逆序，对每个节点调用 _backward。需要写好几行。"
  template: |
    import math

    class Value:
        def __init__(self, data, children=()):
            self.data = data
            self.grad = 0.0
            self._children = children
            self._backward = lambda: None

        def __add__(self, other):
            out = Value(self.data + other.data, (self, other))
            def _backward():
                self.grad += out.grad
                other.grad += out.grad
            out._backward = _backward
            return out

        def __mul__(self, other):
            out = Value(self.data * other.data, (self, other))
            def _backward():
                self.grad += other.data * out.grad
                other.grad += self.data * out.grad
            out._backward = _backward
            return out

        def tanh(self):
            t = math.tanh(self.data)
            out = Value(t, (self,))
            def _backward():
                self.grad += (1 - t ** 2) * out.grad
            out._backward = _backward
            return out

        def backward(self):
            topo, seen = [], set()
            def build(v):
                if v not in seen:
                    seen.add(v)
                    for child in v._children:
                        build(child)
                    topo.append(v)      # 一个节点排在它所有的输入之后
            build(self)
            ____

    def grads(a, b, c, d):
        a, b, c, d = Value(a), Value(b), Value(c), Value(d)
        L = (a * b + c) * d
        L.backward()
        return [a.grad, b.grad, c.grad, d.grad]

    print(grads(2, 3, 1, -2))
  after: "build 把每个节点都排在它的输入之后，所以 L 在最后。倒着走这个列表，每个节点都要等所有用到它的节点访问完才会被访问，所以它把梯度传给输入之前，自己的 grad 已经完整了。"
  tests:
    - "实验台里的计算图"
    - "y = x² + x，x = 3：2·3 + 1 = 7（x 用在了三个地方）"
    - "一个 tanh 神经元：(1 − tanh(0.5)²) × 1 = 0.786448"
  hints:
    - "每一行都缩进 8 个空格，和上面的 build(self) 一样；只有 for 里面的那一行再多缩进 4 个空格。"
    - "build 填的那个列表叫 topo，你开始的那个节点是 self。"
    - ["全是 0：没有东西启动梯度的流动。∂L/∂L 是多少？它应该放在哪个节点上？", "每个 _backward 都要乘 out.grad。如果输出的 grad 还是 0，每个乘积都是 0。"]
    - ["只有 d 得到了梯度。L 的 _backward 运行时 L.grad 是 1，但 a·b + c 运行它的 _backward 时，它自己的 grad 还是 0。你是按什么顺序访问节点的？", "topo 把输入排在用到它们的节点之前。一个节点只有在所有用到它的节点都运行过之后，才能把梯度传下去。你必须从 topo 的哪一头开始？", "从 topo 的最后一个元素走到第一个。Python 有一个内置函数能倒着走一个列表。"]
    - ["把你的列表和期望的列表比一比。哪些梯度错了？它们属于哪些节点？", "topo 把输入排在用到它们的节点之前。backward 必须从列表的哪一头开始？", "从 topo 的最后一个元素走到第一个。Python 有一个内置函数能倒着走一个列表。"]
    - ["两件事：L 自己的梯度，然后每个节点调用一次 _backward。", "反向传播从 L 开始，在这里 L 就是 self，也是 topo 里的最后一个节点。", "倒着走 topo：从 L 走到输入。"]
