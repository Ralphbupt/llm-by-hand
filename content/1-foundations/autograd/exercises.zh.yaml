grad-d:
  prompt: "a = 2，b = 3，c = 1，d = −2。e = a·b，f = e + c，L = f·d。∂L/∂d 是多少？"
  after: "L = f·d，所以这个乘积把 f × L.grad = 7 × 1 = 7 传给 d。d 增加一点点，L 就增加它的 7 倍。"
  hints:
    - "−2 是 d 本身，那是 f 收到的。d 收到的是乘积的另一个输入。"
    - "−14 是 L。梯度是 d 变化时 L 变化得有多快。"
    - ["在乘积里，每个输入得到（另一个输入）×（乘积的 grad）。对 d 来说，L = f·d 的另一个输入是哪个？", "d 得到 f × L.grad，而 L.grad = 1。先算出 f：f = e + c，其中 e = a·b。"]

grad-a:
  prompt: "a = 2，b = 3，c = 1，d = −2。e = a·b，f = e + c，L = f·d。∂L/∂a 是多少？"
  after: "L → f：d = −2。f → e：× 1，还是 −2。e → a：× b = 3。所以 −2 × 1 × 3 = −6。"
  hints:
    - "−4 是 ∂L/∂b：它用的是 a。对 a 来说，乘积 e = a·b 传过来的是 b × e.grad。"
    - "大小对了，符号反了。到达 e 的梯度是 −2。"
    - "−2 是 e.grad。还差一个节点：e = a·b 把 b × e.grad 传给 a。"
    - ["用链式法则：沿着路径 L → f → e → a，把局部因子乘起来。", "第一个因子，从 L 到 f，是 d = −2。然后 f = e + c 把梯度原封不动地传给 e。"]

code-mul:
  prompt: "写出乘积传给它第一个输入的梯度。"
  template: |
    class Value:
        def __init__(self, data, children=()):
            self.data = data
            self.grad = 0.0
            self._children = children
            self._backward = lambda: None

        def __add__(self, other):
            out = Value(self.data + other.data, (self, other))
            def _backward():
                self.grad += out.grad
                other.grad += out.grad
            out._backward = _backward
            return out

        def __mul__(self, other):
            out = Value(self.data * other.data, (self, other))
            def _backward():
                self.grad += ____
                other.grad += self.data * out.grad
            out._backward = _backward
            return out

    def grads(a, b, c, d):
        a, b, c, d = Value(a), Value(b), Value(c), Value(d)
        e = a * b
        f = e + c
        L = f * d
        L.grad = 1.0
        for v in [L, f, e]:          # 从末尾开始访问，现在先手动来
            v._backward()
        return [a.grad, b.grad, c.grad, d.grad]

    print(grads(2, 3, 1, -2))
  after: "在乘积里，一个输入的微小变化会被乘上另一个输入，所以那就是局部因子。再乘上 out.grad，就把这个节点之后所有节点的影响都加了进来。这就是链式法则，一次一个节点。"
  tests:
    - "实验台里的数：a −6，b −4，c −2，d 7"
    - "a = 1，b = −1，c = 2，d = 3"
  hints:
    - ["self 得到（另一个输入）× out.grad。看看它下面那一行，也就是给 other 的那一行。", "给 other 的那一行用的是 self.data。对 self 来说，另一个输入是哪个？", "对 e = a·b，a = 2、b = 3，a 得到 3 × e.grad：也就是 b 的 data。"]
    - ["乘积的每个输入得到（另一个输入）×（乘积的 grad）。", "它下面那一行，给 other 的那一行，形式是一样的。", "对 e = a·b，a = 2、b = 3，a 得到 3 × e.grad。"]

x-times-x:
  prompt: "y = x · x，x = 3。dy/dx 是多少？"
  after: "dy/dx = 2x = 6。在计算图里：x 同时是乘积的两个输入，每一边传回 x × 1 = 3。合起来是 6。"
  hints:
    - "3 是乘积的一边传回来的。x 是两边。"
    - "9 是 y。x² 在 x = 3 处的斜率是 2x。"
    - ["x 同时是乘积的两个输入。每一边传回（另一个输入）× y.grad，两部分相加。", "y.grad = 1，所以一边传回 3 × 1 = 3。"]

pred-equals:
  prompt: "有人写成了 self.grad = … 和 other.grad = …（用 =，不是 +=）。对 y = x · x，x = 3，他的反向传播得到的 x.grad 是多少？"
  options: ["6，还是对的", "3，正确答案的一半", "9"]
  hints:
    - "用 = 时，第二行不会加到第一行写的值上，而是把它替换掉。"
    - "9 是 y 本身。每一行写的是梯度的一部分，x × 1 = 3。"
  reveal: "3。第一行让 x.grad = 3，第二行又让 x.grad = 3，把它覆盖了。用 += 的话，两部分会加起来：3 + 3 = 6。"

