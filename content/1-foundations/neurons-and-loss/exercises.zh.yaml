z-11:
  prompt: "AND 神经元的 w1 = 1，w2 = 1，b = −1.5，z = w1·x1 + w2·x2 + b。点 (1, 1) 的 z 是多少？"
  after: "z = 1×1 + 1×1 − 1.5 = 0.5。只有这个角的 z > 0，所以 AND 神经元只在这个角回答 1。"
  hints:
    - "你忘了 b。z = w1·x1 + w2·x2 + b。"
    - "这是 (0, 0) 的 z。要用 x1 = 1 和 x2 = 1。"
    - ["把数代入 z = w1·x1 + w2·x2 + b，其中 x1 = 1，x2 = 1。", "加权和是 w1·x1 + w2·x2 = 1×1 + 1×1 = 2。现在加上 b。"]

p-11:
  prompt: "一个神经元的 z = 0.5。它的输出是 p = sigmoid(0.5) = 1 / (1 + e^(−0.5))。取 e^(−0.5) ≈ 0.6。p 是多少？（保留三位小数。）"
  after: "1 / (1 + 0.6) = 1 / 1.6 = 0.625。精确值是 0.6225。大于 0.5，所以神经元回答 1。在 AND 神经元（w1 = w2 = 1，b = −1.5）里，其他三个角的 z ≤ −0.5，p < 0.5。"
  hints:
    - "这是 sigmoid(−0.5)。e^(−z) 里的符号很重要：这里 e^(−0.5) ≈ 0.6，所以分母是 1 + 0.6。"
    - "1.6 是分数的下面那部分（分母）。p 是 1 除以它。"
    - ["用 p = 1 / (1 + e^(−z))，代入 e^(−0.5) ≈ 0.6。", "分母是 1 + 0.6 = 1.6。现在用 1 除以它。"]

xor-line:
  prompt: "XOR 数据：点 (0, 0) 和 (1, 1) 的目标值是 0，(0, 1) 和 (1, 0) 的目标值是 1。一个神经元画一条直线。你能找到 w1、w2、b，让 4 个点全都正确吗？"
  options: ["能，只要斜率选对", "能，只要陡度足够大", "不能，最多只能对 4 个点里的 3 个"]
  hints:
    - "试几个斜率。两个 1 在正方形的一条对角线上，两个 0 在另一条对角线上。一条直线能把两条对角线分开吗？"
    - "陡度只会让颜色更分明。它会移动或弯曲那条线吗？"
  reveal: "不能。两个 1 在一条对角线上，两个 0 在另一条对角线上。任何把两个 1 放在同一边的直线，都至少会把一个 0 也放到那一边。你试的每一条线，都至少会让一个点落在错的一边。陡度只会让颜色更分明；线还是一条直线。"

neuron:
  prompt: "写出一个神经元的 z。"
  tests:
    - "AND 神经元在点 (1, 1) 上给出 0.6225"
    - "一次算全部四个点"
    - null
  hints:
    - "检查形状。x 是 (2,) 或 (4, 2)，w 是 (2,)。x @ w 给每个点一个数。"
    - ["z 是输入的加权和再加上偏置。你加了偏置吗？", "加权和 w1·x1 + w2·x2 就是一次矩阵乘法，和第 1 关一样。乘一次，每个点得到一个数。"]
    - ["z = w1·x1 + w2·x2 + b。哪个 NumPy 运算能给出 w1·x1 + w2·x2？", "对输入和权重用第 1 关的矩阵乘法，然后加上偏置。"]
  after: "x @ w 给每个点一个加权和：形状 (4, 2) @ (2,) → (4,)，形状 (2,) @ (2,) → 一个数。再加上 b，每个 z 都平移同样的量。同一行代码对一个点和四个点都管用。"

flat-loss:
  prompt: "在 XOR 上，一个神经元对每个点都回答 p = 0.5。假设有一个模型，对目标值为 0 的两个点回答 p = 0.25，对目标值为 1 的两个点回答 p = 0.75。它的损失 −mean(y·ln p + (1 − y)·ln(1 − p)) 是多少？取 ln 0.75 ≈ −0.288，ln 0.25 ≈ −1.386。"
  after: "每个点都有 75% 的把握答对：目标值为 1 的点代价是 −ln 0.75 = 0.288，目标值为 0 的点代价是 −ln(1 − 0.25) = −ln 0.75 = 0.288，也一样。平均值是 0.288。一个神经元在 XOR 上做不到这样。它最好的结果是处处 p = 0.5，损失 −ln 0.5 = ln 2 ≈ 0.693：它就停在这个数上，意思是“不比抛硬币强”。以后只要模型什么都没学到，你就会再见到 ln 2。"
  hints:
    - "这里用了 ln 0.25。目标值为 0 的点，损失是 −ln(1 − p)，而 1 − 0.25 = 0.75。"
    - "你把 ln 0.25 混进了目标值为 0 的点。它们的损失是 −ln(1 − p) = −ln 0.75。"
    - "大小对了，符号错了。损失前面有一个负号：−mean(…)。小于 1 的数取 ln 都是负的，所以损失是正的。"
    - ["一次只看一个点：目标值为 1 的点代价是 −ln p，目标值为 0 的点代价是 −ln(1 − p)。", "对目标值为 0 的点，先算 1 − p。这需要给出的两个 ln 值里的哪一个？", "四个点的代价一样吗？四个相等的数，平均值是多少？"]

bce-code:
  prompt: "写出二元交叉熵损失：对数组 p 和 y 计算 −mean(y·ln p + (1 − y)·ln(1 − p))。"
  tests:
    - "处处 p = 0.5 的代价是 ln 2 ≈ 0.6931"
    - "每个点都有 75% 的把握答对，代价是 0.2877"
    - "两个目标值为 1 的点，p = 0.9 和 p = 0.2"
  hints:
    - ["处处 p = 0.5 应该得到 0.6931。整个和都在 np.mean( … ) 里面吗？np.mean 前面是不是只有一个负号？", "y = 1 时每个点的代价是 −ln p，y = 0 时是 −ln(1 − p)。每一项分别乘以 y 或 (1 − y)。"]
    - ["检查目标值为 0 的那一项：它用的是 ln(1 − p)，不是 ln p。", "目标值为 0 的那一项乘以 (1 − y)，所以 y = 1 时它是 0。"]
    - ["用 np.log 和 np.mean 写出页面上的公式。", "平均值里面有两项：一项对应目标值 1（用 ln p），一项对应目标值 0（用 ln(1 − p)）。", "检查负号。它放在平均值前面，这样损失才是正的。"]
  after: "y 和 (1 − y) 为每个点挑出一项。目标值为 1 的点只有 ln p 起作用，目标值为 0 的点只有 ln(1 − p) 起作用。小于 1 的数取 ln 都是负的，所以前面的负号让损失变成正数。"

neuron-loss:
  prompt: "写出 `neuron_loss` 的函数体：返回神经元的预测相对于 y 的二元交叉熵。要写好几行。"
  template: |
    def neuron_loss(X, w, b, y):
        # 1. 每个点的 z  2. p = sigmoid(z)  3. 返回损失
        ____

    X = np.array([[0, 0], [0, 1], [1, 0], [1, 1]], dtype=float)
    y_and, y_xor = np.array([0, 0, 0, 1.0]), np.array([0, 1, 1, 0.0])
    w_and = np.array([1.0, 1.0])
    print("AND neuron on AND:  ", round(neuron_loss(X, w_and, -1.5, y_and), 4))
    print("all-zero neuron, XOR:", round(neuron_loss(X, np.zeros(2), 0.0, y_xor), 4))
  tests:
    - "AND 神经元（w = [1, 1]，b = −1.5）在 AND 目标值上的损失是 0.4059"
    - "w = [0, 0]，b = 0 让处处 p = 0.5：损失是 ln 2 ≈ 0.6931"
    - "w = [2, 2]，b = −1 在 OR 目标值上的损失是 0.2471"
  hints:
    - "函数里的每一行前面都要有和第一行一样的 4 个空格。"
    - "每个名字都要先算出来再用：先算 z，再由 z 算 p，再由 p 算损失。"
    - "函数什么也没返回。最后一行的损失前面要加 return。"
    - ["先检查 z：点 (1, 1) 的 z 应该是 0.5，和第 1 节一样。", "损失用的是 p（z 的 sigmoid），而不是 z 本身吗？对负的 z 取 np.log 会得到 nan。", "第 2 节写过 p = 1 / (1 + np.exp(-z))，第 3 节用 np.log 和 np.mean 写过损失。"]
    - ["三行：每个点的 z（第 2 节），然后 p = sigmoid(z)，然后 p 相对于 y 的损失（第 3 节）。", "z = X @ w + b 给每个点一个数。sigmoid 把每个 z 变成一个 p。"]
  after: "这就是本页的三部分，按顺序排好：z = X @ w + b，然后 sigmoid，然后损失。损失用的是 p，绝不是 z，因为 ln 需要一个 0 到 1 之间的数。"
