dLda:
  prompt: "a = 0.5，y = 1。局部梯度 ∂L/∂a = 2(a − y) 是多少？"
  after: "2 × (0.5 − 1) = −1。是负的：把 a 调大会让损失变小。"
  hints:
    - "检查符号。a − y = 0.5 − 1 是负的。"
    - "那是 a − y。平方的局部梯度是 2 × (a − y)。"
    - ["把 a = 0.5 和 y = 1 代入题目里的公式。", "先算 a − y，再乘以 2。"]

dLdz:
  prompt: "一个神经元算 a = sigmoid(z)，损失是 L = (a − y)²。往回走时，∂L/∂a = −1，∂a/∂z = a(1 − a) = 0.5 × 0.5 = 0.25。用链式法则：∂L/∂z 是多少？"
  after: "∂L/∂z = ∂L/∂a × ∂a/∂z = −1 × 0.25 = −0.25。往回走时，每个方框都多乘一次。"
  hints:
    - "那只是 sigmoid 的局部梯度，或者你把符号弄丢了。把它乘上从 L 传回来的梯度 −1。"
    - "你做了加法。链式法则是把路径上的梯度乘起来。"
    - ["链式法则是把路径上的梯度乘起来。", "把从 L 传回来的梯度乘上 sigmoid 的局部梯度。保留符号。"]

dLdw:
  prompt: "一个神经元算 z = w·x + b，其中 x = 2。往回走时，∂L/∂z = −0.25，局部梯度是 ∂z/∂w = x = 2。∂L/∂w 是多少？"
  after: "−0.25 × 2 = −0.5。而 ∂L/∂b = −0.25 × 1 = −0.25：各自只需一次乘法。"
  hints:
    - "你除以了 x。链式法则是乘：z 处的梯度乘以局部梯度 x。"
    - "保留 ∂L/∂z 的符号：它是 −0.25。"
    - ["再乘一次：z 处的梯度乘以 z 对 w 的局部梯度。", "∂z/∂w 就是 x，也就是 w 所乘的那个数。把它乘以 ∂L/∂z，保留符号。"]

numeric:
  prompt: "在一个简单的函数上检验：L(w) = w²。在 w = 3、ε = 0.1 时，(L(w + ε) − L(w − ε)) / (2ε) 是多少？"
  after: "(3.1² − 2.9²) / 0.2 = (9.61 − 8.41) / 0.2 = 6.0。精确的导数 2w 也是 6。"
  hints:
    - "要除以 2ε = 0.2，不是除以 ε。"
    - "那是单边的版本，(L(w + ε) − L(w)) / ε。要用两边：L(3.1) 和 L(2.9)。"
    - "你把它读成了 / 2 × ε。分母是整个 (2ε) = 0.2。"
    - ["先算 L(3.1) 和 L(2.9)：各自平方。", "9.61 − 8.41 = 1.2。现在除以 2ε = 0.2。"]

tiny-eps:
  prompt: "在梯度检验里，把 ε 滑到 1e−12。和 ε = 1e−5 相比，它和链式法则答案的差距会……"
  options: ["更小：步子越小越精确", "差不多", "大得多"]
  reveal: "大得多，约 4e−5，而不是约 2e−11。计算机只给每个数保留大约 16 位有效数字。ε = 1e−12 时，两个损失在几乎所有这些位上都相同，所以它们的差大部分是舍入误差。ε 太大则错在另一个原因：曲线在那么长的距离上不是直的。大约 1e−5 最好。在实验台里把每个 ε 都试一试。"

dW-hand:
  prompt: "两个样本：X = [[1, 2], [3, 1]]，dz = [[0.5], [−1]]。X.T @ dz 的第一个元素 dW[0][0] 是多少？"
  after: "权重 0 看到的是每个样本的输入 0：1 × 0.5 + 3 × (−1) = −2.5。这就是 X 的第一列和 dz 的点积。"
  hints:
    - "那只是样本 0。梯度要在两个样本上加起来。"
    - "那只是样本 1。再加上样本 0 的部分，1 × 0.5。"
    - ["dW[0][0] 收集的是每个样本的输入 0 乘以 dz。", "输入 0 在样本 0 里是 1，在样本 1 里是 3。各自乘以自己的 dz，再相加。"]

dW1-shape:
  prompt: "X 是 (4, 2)。隐藏层的梯度 dz1 是 (4, 6)。dW1 = X.T @ dz1 是什么形状？"
  after: "(2, 4) @ (4, 6) → (2, 6)，和 W1 的形状一样。每个权重正好得到一个梯度。"
  hints:
    - "那是 dz1 的形状。X.T 是 (2, 4)，所以 4 消掉了。"
    - "(4, 4) 是在 2 个输入上相乘得到的。这里转置在前面：X.T 是 (2, 4)，所以消掉的是 4 个样本。"
    - ["先求出 X.T 的形状，再用规则 (n, k) @ (k, m) → (n, m)。", "X.T 是 (2, 4)。中间的两个 4 消掉了。剩下哪两个数？"]

dz-back-shape:
  prompt: "XOR 网络上的规则 3：dz2 是 (4, 1)，每个样本一个数，W2 是 (6, 1)。dz2 @ W2.T 是什么形状？"
  after: "(4, 1) @ (1, 6) → (4, 6)：每个样本、每个隐藏神经元一个数，和隐藏层的形状一样。dz1 正需要这个形状。"
  hints:
    - "转置在 W2 上，不在 dz2 上。把两个形状并排写下来：先 dz2，再 W2.T。"
    - ["先求出 W2.T 的形状，再用规则 (n, k) @ (k, m) → (n, m)。", "W2.T 是 (1, 6)。中间的数必须相等，然后消掉。剩下哪两个数？"]

dz1-hand:
  prompt: "一个样本，一个有 2 个 tanh 神经元的隐藏层，一个输出。dz2 = [[0.5]]，W2 = [[2], [−1]]（所以 W2.T = [[2, −1]]），隐藏层输出是 a1 = [[0.5, 0]]。tanh 在一个神经元处的斜率是 1 − a²，其中 a 是那个神经元的输出。用第 3 节的规则 3。dz1 的第一个数是多少？"
  after: "dz2 @ W2.T = [[1.0, −0.5]]。tanh 的斜率是 1 − 0.5² = 0.75 和 1 − 0² = 1。逐元素相乘：[[1.0 × 0.75, −0.5 × 1]] = [[0.75, −0.5]]。第一个数是 0.75。"
  hints:
    - "那是第二步之前的 dz2 @ W2.T。规则 3 还要乘上那个神经元的 tanh 斜率。"
    - "检查斜率：它是 1 − a²，不是 a。第一个神经元的 a = 0.5。"
    - ["两步。先做 @：0.5 乘以 W2.T 的每个数。再做 *：每个结果乘以它自己那个神经元的斜率 1 − a²。", "第一个神经元的权重是 2，输出是 a = 0.5。0.5 × 2 是多少？1 − 0.5² 又是多少？"]

backward:
  prompt: "写出整个反向传播：训练一步需要的每个梯度，从输出层的 dz2 一直到 dW1 和 db1。好几行。"
  template: |
    def forward(X, W1, b1, W2, b2):
        z1 = X @ W1 + b1            # (4, 6)
        a1 = np.tanh(z1)            # (4, 6)
        z2 = a1 @ W2 + b2           # (4, 1)
        p = 1 / (1 + np.exp(-z2))   # (4, 1)
        return z1, a1, p

    def backward(X, y, W1, b1, W2, b2):
        z1, a1, p = forward(X, W1, b1, W2, b2)
        n = len(X)
        # 1. 输出层：dz2   2. dW2、db2   3. 经过 W2 和 tanh 往回：dz1   4. dW1、db1
        ____
        return dW1, db1, dW2, db2

    X = np.array([[0, 0], [0, 1], [1, 0], [1, 1]], dtype=float)
    y = np.array([[0], [1], [1], [0]], dtype=float)
    rng = np.random.default_rng(0)
    W1, b1 = rng.normal(size=(2, 6)), np.zeros(6)
    W2, b2 = rng.normal(size=(6, 1)), np.zeros(1)
    dW1, db1, dW2, db2 = backward(X, y, W1, b1, W2, b2)
    print("dW1 =\n", dW1.round(4))
  tests:
    - "对 dW1 做梯度检验：和数值梯度的最大差距"
    - "对 db1 做梯度检验"
    - "对 dW2 做梯度检验"
    - "对 db2 做梯度检验"
    - "dW1 的形状和 W1 一样"
  hints:
    - "Python 里乘方写作 **，不是 ^。比如 x ** 2 是 x 的平方。"
    - "检查哪里用 @、哪里用 *。经过 tanh 的那一步是逐元素的：两个 (4, 6) 数组一个数一个数地相乘。"
    - "每个梯度都要先算出来再用，按注释里的顺序：dz2、dW2、db2、dz1、dW1、db1。"
    - ["dW2 不对。规则 1：输出层的输入转置后，乘以它的 dz。输出层的输入是什么？", "也检查一下 dz2：(p − y) / n，其中 n = len(X)。"]
    - ["dW1 不对，那很可能是 dz1 不对。dz1 要两步：先经过 W2 往回，再经过 tanh（规则 3）。", "tanh 的斜率是 1 − a1²，逐元素相乘。"]
    - ["有一个偏置的梯度不对。规则 2：偏置得到的是它的 dz 在样本上的和。", "沿着行往下加，和第 1 关第 7 节一样：每个神经元一个数。"]
    - ["按第 3 节的三条规则，依次来：dz2，然后 dW2 和 db2，然后经过 W2 和 tanh 往回得到 dz1，然后 dW1 和 db1。", "输出层的输入是 a1。在规则 1 里用它来算 dW2。"]
  after: "dz2 是链条的起点。每一层都是 dW = 输入.T @ dz，db = dz 在样本上的和。经过 W2 往回用的是 @ W2.T，经过 tanh 往回则要逐元素乘上它的斜率 1 − a1²。"

train-xor:
  prompt: "写出更新这一步，然后在 XOR 上跑 1000 步梯度下降。"
  template: |
    def forward(X, W1, b1, W2, b2):
        a1 = np.tanh(X @ W1 + b1)
        p = 1 / (1 + np.exp(-(a1 @ W2 + b2)))
        return a1, p

    def loss_of(X, y, params):
        p = forward(X, *params)[1]
        return -np.mean(y * np.log(p) + (1 - y) * np.log(1 - p))

    def gradients(X, y, W1, b1, W2, b2, h=1e-5):
        # 数值梯度（把每个数往上、往下各挪一点点），
        # 这样这个单元就不会露出 Boss 关的 backward。
        # 它们和你的 backward 在大约 6 位小数上一致；你的 backward 只是快得多。
        params, grads = [W1, b1, W2, b2], []
        for P in params:
            g = np.zeros_like(P)
            for i in np.ndindex(P.shape):
                old = P[i]
                P[i] = old + h; up = loss_of(X, y, params)
                P[i] = old - h; down = loss_of(X, y, params)
                P[i] = old
                g[i] = (up - down) / (2 * h)
            grads.append(g)
        return grads

    X = np.array([[0, 0], [0, 1], [1, 0], [1, 1]], dtype=float)
    y = np.array([[0], [1], [1], [0]], dtype=float)
    rng = np.random.default_rng(0)
    W1, b1 = rng.normal(size=(2, 6)), np.zeros(6)
    W2, b2 = rng.normal(size=(6, 1)), np.zeros(1)
    lr = 1.0

    for step in range(1000):
        grads = gradients(X, y, W1, b1, W2, b2)
        for param, grad in zip((W1, b1, W2, b2), grads):
            param -= ____               # 往下坡走一步，原地修改
        if step % 200 == 0:
            p = forward(X, W1, b1, W2, b2)[1]
            loss = -np.mean(y * np.log(p) + (1 - y) * np.log(1 - p))
            print(f"step {step:4d}  loss {loss:.4f}")

    p = forward(X, W1, b1, W2, b2)[1]
    print("outputs:", p.ravel().round(3))
  tests:
    - "四个 XOR 点全部正确"
    - "最终损失低于 0.02"
  hints:
    - "更新量的类型不对。它必须是一个和 param 形状相同的浮点数组。用学习率和这个参数的梯度，和第 2 关一样。"
    - ["损失应该下降。检查方向：一步是逆着梯度走的，和第 2 关一样。", "`param -= …` 本身已经在做减法。如果你又写了一个负号，两个负号抵消，每一步都会让损失变大。"]
    - ["和第 2 关一样的更新：新值 = 旧值 − lr × 梯度。", "`param -= …` 本身已经在做减法。循环里哪两个名字分别存着学习率和这个参数的梯度？"]
  after: "每个参数都逆着自己的梯度走一小步：param − lr × grad。`-=` 原地修改数组，所以 W1、b1、W2 和 b2 真的变了。如果你在里面也写一个负号，两个负号抵消，损失就会变大。"

db-hand:
  prompt: "两个样本的 dz = [[0.5], [−1]]。这一层有一个输出神经元，一个偏置。db = dz.sum(axis=0) 是多少？"
  after: "0.5 + (−1) = −0.5。偏置就像一个对每个样本输入都是 1 的权重，所以它的梯度就是 dz 的和。"
  hints:
    - "那是平均值。偏置的梯度是把 dz 在样本上加起来（1/n 已经在 dz 里面了）。"
    - "保留第二个 dz 的符号：它是 −1。"
    - ["偏置就像一个输入永远是 1 的权重。所以它的梯度是把 dz 在样本上加起来。", "dz.sum(axis=0) 沿着行往下加：把列 [0.5, −1] 加起来。保留 −1 的符号。"]
