loss-start:
  prompt: "从 w = 0.5，b = 0 出发。预测值是 0.5、1、1.5，目标值是 2、4、6。均方误差损失是多少？"
  after: "误差是 −1.5、−3、−4.5。平方后是 2.25、9、20.25。它们的平均是 31.5 / 3 = 10.5。"
  hints:
    - "31.5 是误差平方的和。损失是平均值：还要除以点的个数。"
    - "这是平方之前的平均误差。先把每个误差平方，再取平均。"
    - "平方不会是负数：(−1.5)² = (−1.5) × (−1.5) = +2.25。重新把每个误差平方。"
    - ["先算误差：3 个点各自的 预测值 − 真实值。", "误差是 −1.5、−3 和 −4.5。把每个都平方。", "把三个平方加起来，再除以 3。"]

grad-w:
  prompt: "用直线 ŷ = w·x + b 拟合点 (1, 2)、(2, 4)、(3, 6)，损失是 L = mean((w·x + b − y)²)。在 w = 0.5，b = 0 处，∂L/∂w 是多少？"
  after: "三个点的 2·error·x 分别是 −3、−12、−27。它们的平均是 −42 / 3 = −14。"
  hints:
    - "大小对了，符号反了。误差是负的（预测值偏低）。"
    - "−42 是总和。梯度是 3 个点上的平均。"
    - "−6 是 b 的梯度。对 w，每一项还要再乘上它的 x。"
    - ["用 ∂L/∂w = mean(2 · error · x)，其中 error = 预测值 − y。每个点算一项，再取平均。", "误差是 −1.5、−3、−4.5，x 是 1、2、3。算出这三项。", "三项分别是 −3、−12，还有一项。把三项加起来，再除以 3。"]

new-w:
  prompt: "w = 0.5，它的梯度是 −14。学习率为 0.05 时，走一步之后 w 是多少？"
  after: "w ← 0.5 − 0.05 × (−14) = 0.5 + 0.7 = 1.2。b ← 0 − 0.05 × (−6) = 0.3。"
  hints:
    - "你把梯度加上去了。一步要逆着梯度走：w − lr × grad，减去一个负数等于加。"
    - "0.7 是 w 挪动的距离。把它加到 w 的起点上。"
    - ["一步会让 w 逆着梯度挪动：w − lr × 梯度。", "lr = 0.05，梯度是 −14。0.05 × (−14) 是多少？", "用 0.5 减去它。减去一个负数等于加。"]

lr-too-big:
  prompt: "用直线 ŷ = w·x + b 拟合点 (1, 2)、(2, 4)、(3, 6)。在 w = 0.5，b = 0 处，损失是 10.5，∂L/∂w = −14，∂L/∂b = −6。最好的直线是 w = 2，b = 0。现在你把学习率从 0.05 换成 0.2，对 w 和 b 各走一步。损失会怎样？"
  options: ["比用 0.05 时降得更快", "会下降，但降得比用 0.05 时少", "会上升"]
  hints:
    - ["步子大不一定更好。对两个参数都走一步：新的 w = 0.5 − 0.2 × (−14)，新的 b = 0 − 0.2 × (−6)。", "走完这一步，w = 3.3，b = 1.2。对 x = 1、2、3 算出三个预测值 3.3·x + 1.2，和 2、4、6 比一比。"]
    - ["对两个参数都走一步：新的 w = 0.5 − 0.2 × (−14)，新的 b = 0 − 0.2 × (−6)。然后算出新位置上的损失。", "走完这一步，w = 3.3，b = 1.2。预测值是 4.5、7.8、11.1，目标是 2、4、6。把三个误差平方，取平均。它比 10.5 小吗？"]
  reveal: "会上升，从 10.5 升到约 15.57。这一步把 w 挪到 3.3，b 挪到 1.2，于是预测值从偏低（0.5、1、1.5）变成了偏高（4.5、7.8、11.1）。这一步越过了谷底，落在了另一侧更高的地方。继续走下去，损失每一次都更大（约 23，然后 34，然后 51）。学习率太大，损失会变得非常大。学习率太小，训练会非常慢。"

grads:
  prompt: "写出 w 的梯度。"
  tests:
    - "在 w = 0.5，b = 0 处，两个梯度是 (−14, −6)"
    - "在答案 w = 2，b = 0 处，两个梯度都是 0"
    - null
  hints:
    - ["在 w = 0.5，b = 0 处，答案应该是 −14。把你的公式和第 2 节里的比一比。", "看下一行的 `grad_b`。`grad_w` 和它一样，只是多了一个因子。", "多出来的因子是每个点的输入 x。它放在 mean 里面，挨着 error。"]
    - ["看下一行的 `grad_b`。`grad_w` 和它一样，只是多了一个因子。", "多出来的因子是每个点的输入。"]
  after: "每个点贡献 2 × error × x，因为在预测里 w 乘着 x。`grad_b` 里没有 x，因为 b 是单独加上去的。损失是平均值，所以用 np.mean 对所有点取平均。"

gd-loop:
  prompt: "写出训练循环的循环体：对 w 和 b 做一步梯度下降。要写好几行。"
  template: |
    def descend(x, y, w, b, lr, steps):
        for _ in range(steps):
            # 1. 误差  2. w 和 b 的梯度  3. 两个参数都逆着各自的梯度走一步
            ____
        return w, b

    x = np.array([1.0, 2.0, 3.0])
    y = np.array([2.0, 4.0, 6.0])
    print("after 1 step:", descend(x, y, 0.5, 0.0, 0.05, 1))
    print("after 2000 steps:", descend(x, y, 0.5, 0.0, 0.05, 2000))
  tests:
    - "从 w = 0.5，b = 0 走一步，到达 w = 1.2，b = 0.3"
    - "走 2000 步后，到达 w = 2，b = 0"
  hints:
    - "for 里面的每一行，前面的空格数都要一样（这里是 8 个，和循环里第一行一样）。"
    - "每个名字都要先在循环里算出来再用：先算 error，再算 `grad_w` 和 `grad_b`，最后走一步。"
    - ["走一步应该得到 w = 1.2，b = 0.3。检查这一步的符号：w − lr × grad。", "先用同一组旧的 w 和 b 算出两个梯度，再去改其中任何一个。"]
    - ["在循环里，缩进在 for 下面：先算预测和误差，再算两个梯度，最后两个参数各走一步。第 1–3 节里有这几行。", "先算每个点的误差，再写第 4 节里的两行 np.mean，然后 w 和 b 各自逆着自己的梯度走一步。"]
  after: "循环跑一遍，就是梯度下降的一步。两个梯度都用同一组旧的 w 和 b，所以要先把它们算出来，再去改其中任何一个。减号让每一步都逆着梯度走，于是损失变小。"

final-w:
  prompt: "现在的点是 (1, 3)、(2, 5)、(3, 7)。从 w = 0.5，b = 0 出发，学习率 0.05，做一步梯度下降（手算，或者用代码框里的 descend）。走完这一步，b 是多少？"
  after: "误差是 −2.5、−4、−5.5，所以 ∂L/∂b = mean(2 · error) = −8，b ← 0 − 0.05 × (−8) = 0.4。跑 2000 步，b 最后停在 1：每个 y 都比之前大 1，所以最好的直线是 y = 2x + 1。梯度下降事先并不知道答案；它找到的是让损失最小的那条直线，不管是哪条。"
  hints:
    - "0.3 是在旧的点（2、4、6）上走一步后的 b。现在目标是 3、5、7，误差也跟着变了。"
    - "1 是走很多步后 b 最终停下的地方。题目问的只是第一步。"
    - "你把梯度加上去了。一步要逆着梯度走：b − lr × grad，减去一个负数等于加。"
    - "这是 b 的梯度。现在走一步：b − lr × 梯度。"
    - ["先算误差：对每个点算 w·x + b − y，其中 w = 0.5，b = 0。", "误差是 −2.5、−4 和 −5.5。b 的梯度是 2 × error 的平均。", "逆着梯度走一步：b − 0.05 ×（b 的梯度）。"]
