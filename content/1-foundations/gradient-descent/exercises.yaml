loss-start:
  type: number
  prompt: "Start at w = 0.5, b = 0. The predictions are 0.5, 1, 1.5 and the targets are 2, 4, 6. What is the mean squared error loss?"
  answer: 10.5
  tol: 0.01
  after: "The errors are −1.5, −3, −4.5. Squared: 2.25, 9, 20.25. Their mean is 31.5 / 3 = 10.5."
  hints:
    - when: { equals: 31.5 }
      say: "31.5 is the sum of the squared errors. The loss is the mean: divide by the number of points."
    - when: { equals: -3 }
      say: "That is the mean error, before squaring. Square each error first, then take the mean."
    - when: { equals: -10.5 }
      say: "A square is never negative: (−1.5)² = (−1.5) × (−1.5) = +2.25. Square each error again."
    - when: { any: true }
      say: ["Start with the errors: prediction − truth for each of the 3 points.", "The errors are −1.5, −3 and −4.5. Square each one.", "Add the three squares and divide by 3."]

grad-w:
  type: number
  prompt: "A line ŷ = w·x + b is fit to the points (1, 2), (2, 4), (3, 6) with the loss L = mean((w·x + b − y)²). At w = 0.5, b = 0, what is ∂L/∂w?"
  answer: -14
  tol: 0.01
  after: "2·error·x for the three points is −3, −12, −27. Their mean is −42 / 3 = −14."
  hints:
    - when: { equals: 14 }
      say: "Right size, wrong sign. The errors are negative (the predictions are too low)."
    - when: { equals: -42 }
      say: "−42 is the sum. The gradient is the mean over the 3 points."
    - when: { equals: -6 }
      say: "−6 is the gradient of b. For w, each term is also multiplied by its x."
    - when: { any: true }
      say: ["Use ∂L/∂w = mean(2 · error · x), with error = prediction − y. Compute one term per point, then take the mean.", "The errors are −1.5, −3, −4.5 and the x values are 1, 2, 3. Compute the three terms.", "The terms are −3, −12 and one more. Add the three and divide by 3."]

new-w:
  type: number
  prompt: "w = 0.5 and its gradient is −14. With learning rate 0.05, what is w after one step?"
  answer: 1.2
  tol: 0.001
  after: "w ← 0.5 − 0.05 × (−14) = 0.5 + 0.7 = 1.2. And b ← 0 − 0.05 × (−6) = 0.3."
  hints:
    - when: { equals: -0.2 }
      say: "You added the gradient. A step goes against it: w − lr × grad, and minus a negative is plus."
    - when: { equals: 0.7 }
      say: "0.7 is how far w moves. Add it to where w started."
    - when: { any: true }
      say: ["A step moves w against its gradient: w − lr × gradient.", "lr = 0.05 and the gradient is −14. What is 0.05 × (−14)?", "Subtract that from 0.5. Minus a negative is plus."]

lr-too-big:
  type: predict
  prompt: "A line ŷ = w·x + b is fit to the points (1, 2), (2, 4), (3, 6). At w = 0.5, b = 0 the loss is 10.5, ∂L/∂w = −14 and ∂L/∂b = −6. The best line has w = 2, b = 0. You take one step on both w and b with learning rate 0.2 instead of 0.05. What happens to the loss?"
  options: ["It drops faster than with 0.05", "It drops, but less than with 0.05", "It goes up"]
  answer: 2
  hints:
    - when: { equals: 0 }
      say:
        - "Bigger steps are not always better. Take the step on both: new w = 0.5 − 0.2 × (−14), new b = 0 − 0.2 × (−6)."
        - "The step gives w = 3.3 and b = 1.2. Compute the three predictions 3.3·x + 1.2 for x = 1, 2, 3 and compare them with 2, 4, 6."
    - when: { equals: 1 }
      say:
        - "Take the step on both: new w = 0.5 − 0.2 × (−14), new b = 0 − 0.2 × (−6). Then compute the loss at the new point."
        - "The step gives w = 3.3 and b = 1.2. The predictions are 4.5, 7.8, 11.1 against 2, 4, 6. Square the three errors and take their mean. Is that below 10.5?"
  reveal: "It goes up, from 10.5 to about 15.57. The step moves w to 3.3 and b to 1.2, so the predictions go from too low (0.5, 1, 1.5) to too high (4.5, 7.8, 11.1). The step went past the bottom of the valley and landed higher on the other side. Keep stepping and the loss gets larger every time (about 23, then 34, then 51). Too large a learning rate makes the loss grow very large. Too small a learning rate makes training very slow."

grads:
  type: code
  prompt: "Write the gradient of w."
  template: |
    def grads(w, b, x, y):
        error = w * x + b - y
        grad_w = ____
        grad_b = np.mean(2 * error)
        return grad_w, grad_b

    x = np.array([1.0, 2.0, 3.0])
    y = np.array([2.0, 4.0, 6.0])
    print("gradients at w=0.5, b=0:", grads(0.5, 0.0, x, y))
  solution: "np.mean(2 * error * x)"
  tests:
    - setup: "x = np.array([1.0, 2.0, 3.0]); y = np.array([2.0, 4.0, 6.0])"
      expr: "grads(0.5, 0.0, x, y)"
      expect: [-14.0, -6.0]
      say: "at w = 0.5, b = 0 the gradients are (−14, −6)"
    - setup: "x = np.array([1.0, 2.0, 3.0]); y = np.array([2.0, 4.0, 6.0])"
      expr: "grads(2.0, 0.0, x, y)"
      expect: [0.0, 0.0]
      say: "at the answer w = 2, b = 0 both gradients are 0"
    - setup: "x = np.array([2.0, 4.0]); y = np.array([3.0, 4.0])"
      expr: "grads(0.3, 0.5, x, y)"
      expect: [-13.0, -4.2]
      tol: 0.0001
  hints:
    - when: { testFailed: 0 }
      say: ["At w = 0.5, b = 0 the answer should be −14. Compare your formula with the one in section 2.", "Look at `grad_b` on the next line. `grad_w` is the same, with one extra factor.", "The extra factor is the input x of each point. It goes inside the mean, next to the error."]
    - when: { any: true }
      say: ["Look at `grad_b` on the next line. `grad_w` is the same, with one extra factor.", "The extra factor is the input of each point."]
  after: "Each point adds 2 × error × x, because w is multiplied by x in the prediction. `grad_b` has no x, because b is added alone. np.mean averages over the points, since the loss is an average."

gd-loop:
  type: code
  prompt: "Write the body of the training loop: one gradient-descent step on w and b. Several lines."
  template: |
    def descend(x, y, w, b, lr, steps):
        for _ in range(steps):
            # 1. errors  2. gradients of w and b  3. step both against their gradients
            ____
        return w, b

    x = np.array([1.0, 2.0, 3.0])
    y = np.array([2.0, 4.0, 6.0])
    print("after 1 step:", descend(x, y, 0.5, 0.0, 0.05, 1))
    print("after 2000 steps:", descend(x, y, 0.5, 0.0, 0.05, 2000))
  solution: "error = w * x + b - y\n        grad_w = np.mean(2 * error * x)\n        grad_b = np.mean(2 * error)\n        w, b = w - lr * grad_w, b - lr * grad_b"
  tests:
    - setup: "x = np.array([1.0, 2.0, 3.0]); y = np.array([2.0, 4.0, 6.0])"
      expr: "descend(x, y, 0.5, 0.0, 0.05, 1)"
      expect: [1.2, 0.3]
      tol: 0.0001
      say: "one step from w = 0.5, b = 0 lands at w = 1.2, b = 0.3"
    - setup: "x = np.array([1.0, 2.0, 3.0]); y = np.array([2.0, 4.0, 6.0])"
      expr: "descend(x, y, 0.5, 0.0, 0.05, 2000)"
      expect: [2.0, 0.0]
      tol: 0.001
      say: "after 2000 steps it reaches w = 2, b = 0"
  hints:
    - when: { error: "IndentationError|unexpected indent|expected an indented block|unindent" }
      say: "Every line inside the for needs the same number of spaces in front (8 here, the same as the first line inside the loop)."
    - when: { error: "is not defined" }
      say: "Compute each name inside the loop before you use it: error first, then `grad_w` and `grad_b`, then the step."
    - when: { testFailed: 0 }
      say: ["One step should give w = 1.2 and b = 0.3. Check the sign of the step: w − lr × grad.", "Compute both gradients from the same old w and b before changing either one."]
    - when: { any: true }
      say: ["Inside the loop, indented under the for: the predictions and errors, the two gradients, then a step on both parameters. Sections 1–3 have the lines.", "First the error of every point, then the two np.mean lines from section 4, then w and b each step against their own gradient."]
  after: "One pass of the loop is one step of gradient descent. Both gradients use the same old w and b, so compute them before you change either one. The minus sign makes each step go against its gradient, so the loss gets smaller."

final-w:
  type: number
  prompt: "The points are now (1, 3), (2, 5), (3, 7). Start at w = 0.5, b = 0 with learning rate 0.05 and take one step of gradient descent (by hand, or with descend from the code box). What is b after that one step?"
  answer: 0.4
  tol: 0.001
  after: "The errors are −2.5, −4, −5.5, so ∂L/∂b = mean(2 · error) = −8 and b ← 0 − 0.05 × (−8) = 0.4. Run 2000 steps and b ends at 1: every y is 1 higher than before, so the best line is y = 2x + 1. Gradient descent doesn’t know the answer in advance; it finds whatever line makes the loss smallest."
  hints:
    - when: { equals: 0.3 }
      say: "0.3 is b after one step on the old points (2, 4, 6). The targets are now 3, 5, 7, so the errors change."
    - when: { equals: 1 }
      say: "1 is where b ends after many steps. The question asks about the first step only."
    - when: { equals: -0.4 }
      say: "You added the gradient. A step goes against it: b − lr × grad, and minus a negative is plus."
    - when: { equals: -8 }
      say: "That is the gradient of b. Now take the step: b − lr × gradient."
    - when: { any: true }
      say: ["Start with the errors: w·x + b − y for each point, with w = 0.5 and b = 0.", "The errors are −2.5, −4 and −5.5. The gradient of b is the mean of 2 × error.", "Step against the gradient: b − 0.05 × (gradient of b)."]
