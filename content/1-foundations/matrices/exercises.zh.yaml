c-0-1:
  prompt: "A = [[1, 2, 3], [0, 1, 0]]，B = [[1, 0], [0, 1], [1, 1]]。C[0][1] 是多少？"
  after: "A 的第 0 行是 [1, 2, 3]。B 的第 1 列是 [0, 1, 1]。1×0 + 2×1 + 3×1 = 5。"
  hints:
    - "4 是 C[0][0]，用的是 B 的第 0 列。第 1 列是 [0, 1, 1]。"
    - ["用 A 的第 0 行和 B 的第 1 列（从 0 开始数）。", "A 的第 0 行是 [1, 2, 3]。B 的第 1 列从上往下读是 0、1、1。", "把它们两两相乘，再把三个乘积加起来。"]

shape-3x4:
  prompt: "(3, 4) @ (4, 2) 的形状是什么？"
  after: "内侧的两个 4 相等，并且消失。剩下的是 3 和 2。"
  hints:
    - "消失的是那两个 4。保留外侧的两个数。"
    - "数对了，顺序反了。行数来自左边的矩阵。"
    - ["内侧的数（两个 4）会消失。还剩什么？", "(n, k) @ (k, m) → (n, m)。行数来自左边的矩阵。"]

same-shape:
  prompt: "A 是 (3, 2)，B 是 (3, 2)。A @ B 会怎样？"
  options: ["得到 (3, 2) 的结果", "得到 (3, 3) 的结果", "报错：形状对不上"]
  hints:
    - "看内侧的数：A 是 (3, 2)，B 是 (3, 2)。2 等于 3 吗？"
    - "要得到 (3, 3) 的结果，B 得是 (2, 3)。看看 (3, 2) @ (3, 2) 内侧的数。"
  reveal: "对，会报错。把形状排成 (3, 2) @ (3, 2)：内侧的数（A 的列数和 B 的行数）是 2 和 3，而它们必须相等。要相乘，你得先把 B 翻成 (2, 3)。这种翻转叫转置，写作 B.T，A @ B.T 是 (3, 3)。你会在注意力里再见到它。"

matmul-loop:
  prompt: "用三层循环写出矩阵乘法，不用 @，也不用 np.dot（a 和 b 是列表的列表）。分别遍历输出的行、输出的列和内侧的大小，每一轮把一个乘积加到某个输出格上。需要写好几行。"
  template: |
    def mm(a, b):
        n, k, m = len(a), len(b), len(b[0])   # a 是 (n, k)，b 是 (k, m)
        out = [[0] * m for _ in range(n)]      # (n, m)，全是 0
        ____
        return out

    print(mm([[1, 2, 3], [0, 1, 0]], [[1, 0], [0, 1], [1, 1]]))
  tests:
    - "应该是 [[4, 5], [0, 1]]"
    - "1×3 + 2×4 = 11"
    - "a (1, 2) 乘 b (2, 3) 得到一行 3 个数：[[15, 18, 21]]"
  hints:
    - "第一层循环要缩进 4 个空格，和它上面那行一样。里面的每层循环再多缩进 4 个空格，加乘积的那一行放在最内层循环下面。"
    - "下标越界了。a 有 n 行 k 列，b 有 k 行 m 列。哪层循环遍历 n，哪层遍历 k，哪层遍历 m？"
    - "用模板给你的名字：n、k、m、out、a 和 b。每层循环都要有自己的计数器，比如 i、j 和 t。"
    - ["你得到的是 [[3, 3], [0, 0]] 吗？那说明每一轮都把格子替换掉了，而不是加上去。用 +=，让乘积累加起来。", "输出格 (i, j) 用的是左边矩阵的第 i 行和右边矩阵的第 j 列。最内层的计数器同时沿着这两者走。"]
    - ["三层嵌套的 for 循环：一层遍历输出的行，一层遍历输出的列，一层遍历内侧的大小。", "外面两层循环选出输出格 (i, j)。内层循环每一轮给它加上一个乘积。", "每个乘积的一个数来自 a 的第 i 行，另一个来自 b 的第 j 列。手算一个检查一下：左上角那一格、内侧第 1 步，乘积是 2 × 0。"]
  after: "格子 (i, j) 是 a 的第 i 行和 b 的第 j 列的点积。遍历 t 的循环同时沿着这两者走，所以 t 在 a 里是列号，在 b 里是行号。这就是内侧的大小必须相等的原因。"

batch-shape:
  prompt: "X 是 (2, 5, 4)：2 个句子，每句 5 个词，每个词 4 个数。W 是 (4, 8)。X @ W 是什么形状？"
  after: "只有最后一个维度变了：4 变成 8。批大小和句子长度都不变。"
  hints:
    - "接近了。别丢掉 batch。仍然有 2 个句子。"
    - "这是输入的形状。W 把每个词的 4 个数变成几个？"
    - "两个 4 相等，并且消失。它们前面的都保留：(2, 5, ...)。"

bc-shape:
  prompt: "一列形状 (4, 1) 加一行形状 (1, 5)。结果是什么形状？"
  after: "每个大小为 1 的维度都被拉伸到和另一个对上：那一列的 1 → 5 列，那一行的 1 → 4 行。"
  hints:
    - "结果要能同时容下两者。那一行有 5 列，所以结果也有 5 列。"
    - "那一列有 4 行，所以结果也有 4 行。"
    - ["一次比较一个维度。大小为 1 的会被拉伸到另一个的大小。", "行：4 对 1。1 被拉伸，所以结果有 4 行。现在看列。"]

bc-trailing:
  prompt: "A 是 (3, 2)。v 是一个普通的列表，有 3 个数，形状 (3,)。先猜再看：A + v 会怎样？"
  options: ["把 v[i] 加到 A 的第 i 行", "把 v 加到 A 的每一行", "报错"]
  reveal: "对，会报错。广播从右往左比较形状：(3,) 被当作 (1, 3)，和 A 的列数比较：2 对 3。两个都不是 1，所以没法拉伸到对上。要把 v[i] 加到第 i 行，你得把 v 写成一列，形状 (3, 1)。"

bc-value:
  prompt: "a = [[1], [2], [3], [4]] 的形状是 (4, 1)。b = [[10, 20, 30, 40, 50]] 的形状是 (1, 5)。(a + b)[2][3] 是多少？"
  after: "第 2 行取 a[2] = 3。第 3 列取 b[0][3] = 40。3 + 40 = 43。"
  hints:
    - "这用的是 a[2][0] = 3 和 b 的第 2 列（30）。b 的第 3 列是 40。"
    - "这用的是 a[3] = 4。行从 0 开始数：第 2 行是第三行，a = 3。"
    - "32 来自另一组数：a = [0, 1, 2, 3]，b = [0, 10, 20, 30, 40]。这道题用的是 a = [1, 2, 3, 4]，b = [10, 20, 30, 40, 50]。"
    - ["结果的第 2 行从 a 取一个数，第 3 列从 b 取一个数。分别是哪个？", "从 0 开始数：a[2] = 3。现在找 b[0][3]。", "result[i][j] = a[i][0] + b[0][j]，其中 i = 2，j = 3。"]

bc-mask:
  prompt: "这里只关心形状。一个批的注意力分数形状是 (2, 4, 4)：2 个句子，每句 4 个词。填充掩码的形状是 (2, 1, 4)。把掩码用到分数上时，两者广播成什么形状？"
  after: "从右往左：4 对 4，没问题；4 对 1，拉伸；2 对 2，没问题。每个句子的那一行掩码被复制到它的全部 4 行。"
  hints:
    - "这是掩码自己的形状。它中间那个大小为 1 的维度会拉伸成 4。"
    - "别丢掉 batch：仍然有 2 个句子。"
    - ["从右往左，一次比较一个维度。大小为 1 的会被拉伸。", "最后一个维度：4 对 4，所以是 4。中间：4 对 1，所以 1 被拉伸。现在看第一个维度。"]

axis-shape:
  prompt: "X 的形状是 (4, 3)。X.sum(axis=0) 的形状是什么？"
  after: "axis=0 去掉 4 行。3 列每列剩下一个总和：形状 (3,)。"
  hints:
    - "这是 X.sum(axis=1)，每行一个总和。axis=0 沿行往下加，把行去掉。"
    - "接近了。NumPy 会把求和的轴完全去掉，不留下 1：(3,)。"
    - ["你指定的那个轴就是消失的那个。轴 0 是哪个大小？", "轴 0 是那 4 行。把它从 (4, 3) 里去掉。"]

center-code:
  prompt: "从 X 里减去每一列的均值，让每一列的均值都是 0。用 .mean(axis=0) 和广播。"
  tests:
    - "各列均值是 [3, 5]"
    - "结果的每一列均值都应该是 0"
  hints:
    - "形状对不上。你是不是用了 axis=1？那样得到的是每行一个均值，形状 (N,)，从右往左没法和 (N, d) 对上。"
    - ["先检查各列的均值：对这个 X 来说是 [3, 5]。", "你需要用 X 减去一行列均值。广播会把这一行向下拉伸到 X 的每一行。", "这一行均值的形状必须是 (d,)，每列一个数。.mean 去掉的是 X 的哪个轴？"]
    - ["哪个轴会去掉行，每列留下一个数？", "用 .mean 和这个轴算出各列均值。然后从 X 里减去它们。"]
  after: "X.mean(axis=0) 的形状是 (d,)。广播从右往左把它和 (N, d) 比较，然后把它向下复制到每一行。常见的坑是 axis=1：它得到的是每行一个均值，形状 (N,)，从右往左和 (N, d) 对不上。"
