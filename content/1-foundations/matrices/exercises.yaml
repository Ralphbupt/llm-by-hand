c-0-1:
  type: number
  prompt: "A = [[1, 2, 3], [0, 1, 0]] and B = [[1, 0], [0, 1], [1, 1]] What is C[0][1]?"
  answer: 5
  tol: 0
  after: "Row 0 of A is [1, 2, 3]. Column 1 of B is [0, 1, 1]. 1×0 + 2×1 + 3×1 = 5."
  hints:
    - when: { equals: 4 }
      say: "4 is C[0][0]. That uses column 0 of B. Column 1 is [0, 1, 1]."
    - when: { any: true }
      say: ["Use row 0 of A and column 1 of B (counting from 0).", "Row 0 of A is [1, 2, 3]. Column 1 of B, read top to bottom, is 0, 1, 1.", "Multiply them pairwise and add the three products."]

shape-3x4:
  type: shape
  prompt: "What is the shape of (3, 4) @ (4, 2)?"
  answer: [3, 2]
  after: "The inner 4s match and disappear. What is left is 3 and 2."
  hints:
    - when: { shape: [4, 4] }
      say: "The 4s are the ones that disappear. Keep the outer two numbers."
    - when: { shape: [2, 3] }
      say: "Right numbers, wrong order. Rows come from the left matrix."
    - when: { any: true }
      say: ["The inner numbers (the two 4s) disappear. What is left?", "(n, k) @ (k, m) → (n, m). The rows come from the left matrix."]

same-shape:
  type: predict
  prompt: "A is (3, 2) and B is (3, 2). What happens with A @ B?"
  options: ["You get a (3, 2) result", "You get a (3, 3) result", "Error: the shapes don’t match"]
  answer: 2
  hints:
    - when: { equals: 0 }
      say: "Check the inner numbers: A is (3, 2), B is (3, 2). Is 2 equal to 3?"
    - when: { equals: 1 }
      say: "A (3, 3) result would need B to be (2, 3). Look at the inner numbers of (3, 2) @ (3, 2)."
  reveal: "Error. The inner numbers are 2 and 3, and they must be equal. To multiply them you would need to flip B into (2, 3) first. That flip is called a transpose, written B.T, and A @ B.T is (3, 3). You will meet it again in attention."

matmul-loop:
  type: code
  prompt: "Write matrix multiplication with three loops, without @ or np.dot (a and b are lists of lists). Loop over the rows of the output, its columns, and the inner size, and add one product to an output cell on each pass. Several lines."
  template: |
    def mm(a, b):
        n, k, m = len(a), len(b), len(b[0])   # a is (n, k), b is (k, m)
        out = [[0] * m for _ in range(n)]      # (n, m), all zeros
        ____
        return out

    print(mm([[1, 2, 3], [0, 1, 0]], [[1, 0], [0, 1], [1, 1]]))
  solution: "for i in range(n):\n        for j in range(m):\n            for t in range(k):\n                out[i][j] += a[i][t] * b[t][j]"
  tests:
    - expr: "mm([[1,2,3],[0,1,0]], [[1,0],[0,1],[1,1]])"
      expect: [[4, 5], [0, 1]]
      say: "should be [[4, 5], [0, 1]]"
    - expr: "mm([[1,2]], [[3],[4]])"
      expect: [[11]]
      say: "1×3 + 2×4 = 11"
    - expr: "mm([[1,2]], [[3,4,5],[6,7,8]])"
      expect: [[15, 18, 21]]
      say: "a (1, 2) times b (2, 3) gives one row of 3: [[15, 18, 21]]"
  hints:
    - when: { error: "IndentationError|unexpected indent|expected an indented block|unindent" }
      say: "Indent the first loop by 4 spaces, like the line above it. Each loop inside it gets 4 more spaces, and the line that adds a product sits under the innermost loop."
    - when: { error: "list index out of range" }
      say: "An index is out of range. a has n rows and k columns, and b has k rows and m columns. Which loop runs over n, which over k, which over m?"
    - when: { error: "is not defined" }
      say: "Use the names the template gives you: n, k, m, out, a and b. Each loop needs its own counter, such as i, j and t."
    - when: { testFailed: 0 }
      say: ["Did you get [[3, 3], [0, 0]]? Then each pass replaced the cell instead of adding to it. Use += so the products are added together.", "Out cell (i, j) uses row i of the left matrix and column j of the right matrix. The innermost counter walks along both."]
    - when: { any: true }
      say: ["Three nested for loops: one over the output rows, one over the output columns, one over the inner size.", "The outer two loops pick the output cell (i, j). The inner loop adds one product to it on each pass.", "One number of each product comes from row i of a, the other from column j of b. Check one by hand: for the top-left cell and inner step 1, the product is 2 × 0."]
  after: "Cell (i, j) is the dot product of row i of a and column j of b. The loop over t walks along both at the same time, so t is the column in a and the row in b. This is why the inner sizes must be equal."

batch-shape:
  type: shape
  prompt: "X is (2, 5, 4): 2 sentences, 5 words each, 4 numbers per word. W is (4, 8). What shape is X @ W?"
  answer: [2, 5, 8]
  after: "Only the last dimension changes: 4 becomes 8. The batch size and the sentence length stay the same."
  hints:
    - when: { shape: [5, 8] }
      say: "Close. Don’t drop the batch. There are still 2 sentences."
    - when: { shape: [2, 5, 4] }
      say: "That is the input shape. W turns 4 numbers per word into how many?"
    - when: { any: true }
      say: "The 4s match and disappear. Everything before them stays: (2, 5, ...)."

bc-shape:
  type: shape
  prompt: "A column of shape (4, 1) plus a row of shape (1, 5). What shape is the result?"
  answer: [4, 5]
  after: "Each size-1 dimension is stretched to match the other: 1 → 5 columns for the column, 1 → 4 rows for the row."
  hints:
    - when: { shape: [4, 1] }
      say: "The result has to fit both. The row has 5 columns, so the result does too."
    - when: { shape: [1, 5] }
      say: "The column has 4 rows, so the result does too."
    - when: { any: true }
      say: ["Compare the shapes one dimension at a time. A size of 1 is stretched to match the other size.", "Rows: 4 vs 1. The 1 is stretched, so the result has 4 rows. Now do the columns."]

bc-trailing:
  type: predict
  prompt: "A is (3, 2). v is a plain list of 3 numbers, shape (3,). Guess before you check: what does A + v do?"
  options: ["Adds v[i] to row i of A", "Adds v to every row of A", "Error"]
  reveal: "Error. Broadcasting compares the shapes from the right: (3,) is treated as (1, 3) and compared with A’s columns: 2 vs 3. Neither is 1, so it fails. To add v[i] to row i you would write v as a column, shape (3, 1)."

bc-value:
  type: number
  prompt: "a = [[1], [2], [3], [4]] has shape (4, 1). b = [[10, 20, 30, 40, 50]] has shape (1, 5). What is (a + b)[2][3]?"
  answer: 43
  tol: 0
  after: "Row 2 takes a[2] = 3. Column 3 takes b[0][3] = 40. 3 + 40 = 43."
  hints:
    - when: { equals: 33 }
      say: "That uses a[2][0] = 3 with b’s column 2 (30). Column 3 of b is 40."
    - when: { equals: 44 }
      say: "That uses a[3] = 4. Rows count from 0: row 2 is the third row, a = 3."
    - when: { equals: 32 }
      say: "32 comes from other numbers, a = [0, 1, 2, 3] and b = [0, 10, 20, 30, 40]. This question uses a = [1, 2, 3, 4] and b = [10, 20, 30, 40, 50]."
    - when: { any: true }
      say: ["Row 2 of the result takes one number from a, column 3 takes one number from b. Which ones?", "Counting from 0: a[2] = 3. Now find b[0][3].", "result[i][j] = a[i][0] + b[0][j], with i = 2 and j = 3."]

bc-mask:
  type: shape
  prompt: "Only the shapes matter here. Attention scores for a batch have shape (2, 4, 4): 2 sentences, 4 words each. The padding mask has shape (2, 1, 4). What shape do they broadcast to when the mask is applied to the scores?"
  answer: [2, 4, 4]
  after: "From the right: 4 vs 4 fine, 4 vs 1 stretch, 2 vs 2 fine. Each sentence’s mask row is copied to all 4 of its rows."
  hints:
    - when: { shape: [2, 1, 4] }
      say: "That is the mask’s own shape. Its size-1 middle dimension stretches to 4."
    - when: { shape: [4, 4] }
      say: "Don’t drop the batch: there are still 2 sentences."
    - when: { any: true }
      say: ["Compare the two shapes from the right, one dimension at a time. A size of 1 is stretched.", "Last dimension: 4 vs 4, so 4. Middle: 4 vs 1, so the 1 is stretched. Now do the first dimension."]

axis-shape:
  type: shape
  prompt: "X has shape (4, 3). What is the shape of X.sum(axis=0)?"
  answer: [3]
  after: "axis=0 removes the 4 rows. One total is left for each of the 3 columns: shape (3,)."
  hints:
    - when: { shape: [4] }
      say: "That is X.sum(axis=1), one total per row. axis=0 goes down the rows and removes them."
    - when: { shape: [1, 3] }
      say: "Close. NumPy drops the summed axis completely, so there is no 1 left: (3,)."
    - when: { any: true }
      say: ["The axis you name is the one that disappears. Which size is axis 0?", "Axis 0 is the 4 rows. Remove it from (4, 3)."]

center-code:
  type: code
  prompt: "Subtract each column’s mean from X, so every column has mean 0. Use .mean(axis=0) and broadcasting."
  template: |
    def center(X):
        return ____

    X = np.array([[1., 2.], [3., 4.], [5., 9.]])
    print("column means:", X.mean(axis=0))
    print(center(X))
  solution: "X - X.mean(axis=0)"
  tests:
    - setup: "X = np.array([[1., 2.], [3., 4.], [5., 9.]])"
      expr: "center(X)"
      expect: [[-2, -3], [0, -1], [2, 4]]
      say: "column means are [3, 5]"
    - setup: "X = np.array([[1., 1., 1.], [3., 5., 7.]])"
      expr: "center(X).mean(axis=0)"
      expect: [0, 0, 0]
      say: "every column of the result should have mean 0"
  hints:
    - when: { error: "operands could not be broadcast|matmul|core dimension" }
      say: "The shapes do not match. Did you use axis=1? That gives one mean per row, shape (N,), which cannot be lined up with (N, d) from the right."
    - when: { testFailed: 0 }
      say: ["Check the column means first: for this X they are [3, 5].", "You need X minus one row of column means. Broadcasting stretches that row down to every row of X.", "The row of means must have shape (d,), one number per column. Which axis of X does .mean remove?"]
    - when: { any: true }
      say: ["Which axis removes the rows and keeps one number per column?", "Compute the column means with .mean and that axis. Then subtract them from X."]
  after: "X.mean(axis=0) has shape (d,). Broadcasting compares it with (N, d) from the right and copies it down to every row. A common trap is axis=1: it gives one mean per row, shape (N,), which does not match (N, d) from the right."

