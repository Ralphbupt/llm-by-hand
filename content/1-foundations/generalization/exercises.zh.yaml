params:
  prompt: "一个 9 次多项式 c0 + c1·x + c2·x² + … + c9·x⁹ 有多少个参数？"
  after: "c0 到 c9：十个。十个参数对十个训练点，意味着它能正好穿过每一个点，所以它的训练损失可以降到 0。"
  hints:
    - "别忘了常数项 c0。"
    - ["每个系数 c 是一个参数。数一数。", "它们从 c0 一直到 c9。"]

capacity-curve:
  prompt: "你用 0 阶、1 阶、2 阶……一直到 9 阶去拟合这 10 个点。训练损失一直在降。40 个留出点上的损失会怎样？"
  options: ["也一直在降", "先降，再升回去", "从一开始就在升"]
  reveal: "先降后升。3 阶接近最好：留出集 0.1579。9 阶穿过了每一个训练点（训练 0.0000），但留出集一下跳到 0.8275。"

decay-w:
  prompt: "权重衰减给损失加上一个惩罚项：总损失 = 数据损失 + 0.1·w²。现在数据对 w 的梯度是 0，w = 2，lr = 0.5。走一步梯度下降之后，w 是多少？"
  after: "惩罚项的梯度是 2·0.1·2 = 0.4，所以 w ← 2 − 0.5·0.4 = 1.8。每一步都把 w 缩小 10%，直到数据的梯度变得和惩罚项的梯度一样大。"
  hints:
    - "0.1·w² 的梯度是 2·0.1·w，不是 0.1·w。"
    - "先把梯度 0.4 乘以学习率 0.5，再减。"
    - ["惩罚项 0.1·w² 的梯度是 2 · 0.1 · w。数据的梯度是 0。", "在 w = 2 处梯度是 0.4。然后算 w − lr · 梯度。"]

decay-code:
  prompt: "写出带权重衰减的一步梯度下降：把惩罚项的梯度 2·lam·w 加到数据的梯度 `g_data` 上，然后用 lr 往下坡走一步。它必须对一个权重和一个权重数组都适用。"
  tests:
    - "数据梯度为 0：只有惩罚项在拉，2 − 0.5·(2·0.1·2) = 1.8"
    - "lam = 0 就是普通的梯度下降：w − 0.5·[1, 0] = [1.5, −1]"
    - "两者一起：梯度 [1 + 0.4, 0 − 0.2] = [1.4, −0.2]，所以 w = [1.3, −0.9]"
  hints:
    - "在第一行算出总梯度并给它起个名字，第二行才能用它。"
    - ["`g_data` = 0 时只剩惩罚项。它的梯度是 2·lam·w，不是 lam·w。", "答案应该是 1.8：梯度是 0.4，lr 是 0.5。"]
    - ["lam = 0 时，这就是第 2 关里那个普通的一步。你的梯度里有 `g_data` 吗？", "总梯度是 `g_data` 加上惩罚项的梯度。"]
    - ["每一部分单独都对，合在一起就不对了。先把两个梯度加起来，再把和乘以 lr。", "做减法：w − lr·（总梯度）。"]
    - ["第 1 行：总梯度。第 2 行：走一步。", "第 1 行把数据的梯度和惩罚项的梯度加起来。第 2 行逆着这个和走一步，和第 2 关一样。"]
  after: "惩罚项 lam·w² 的梯度是 2·lam·w，所以它总是把 w 往 0 拉。先把它加到数据的梯度上，再正常走一步。同样的两行代码，对一个数和一个数组都适用。"

dropout-unit:
  prompt: "隐藏单元 h = [2, 4, 6, 8]，dropout p = 0.5，保留掩码 [1, 0, 1, 0]。保留下来的单元要除以 1 − p。第三个单元 6 会变成多少？"
  after: "6 / (1 − 0.5) = 12。这一层变成 [4, 0, 12, 0]。平均来说，每个单元仍然值 6：一半时候是 12，一半时候是 0。"
  hints:
    - "它被保留了，但保留的单元要乘以 1/(1 − p)。"
    - "除以 1 − p，而不是乘以 p。"
    - ["第三个单元是被保留了还是被丢弃了？看掩码的第三个值。", "保留的单元要除以 1 − p = 0.5。"]

dropout-code:
  prompt: "写一个 inverted dropout 层。train 为 False 时，原样返回 h。train 为 True 时，丢弃随机数 u 小于 p 的每个单元，并把保留的单元除以 1 − p。需要写好几行。"
  template: |
    def dropout(h, u, p, train):
        # u：每个单元一个 0 到 1 之间的随机数，已经生成好了
        ____

    h = np.array([2.0, 4.0, 6.0, 8.0])
    u = np.array([0.9, 0.1, 0.7, 0.3])
    print("training:", dropout(h, u, 0.5, True))
    print("testing: ", dropout(h, u, 0.5, False))
  tests:
    - "单元 1 和 3 的 u 小于 0.5，所以被丢弃；其他的除以 0.5"
    - "p = 0.25 时，只有第一个单元保留下来，并且除以 0.75"
    - "测试时什么都不丢弃，也什么都不缩放"
  hints:
    - "第一行缩进 4 个空格，和 ____ 一样。if 下面那一行再多缩进 4 个空格。"
    - "先用 u 和 p 做出保留掩码，再使用它。"
    - ["你得到的是 [0, 8, 0, 16] 吗？那说明你保留错了单元。u 小于 p 的单元才被丢弃。", "两步：用保留掩码把丢弃的单元设为 0，再把保留的单元除以 1 − p。", "在 Python 里，/ 1 - p 和 / (1 - p) 不一样。"]
    - "用参数里的 p，而不是固定的 0.5，掩码和除法都是。"
    - ["train 为 False 时，这一层完全不能改变 h：不置零，也不缩放。", "先用 if 检查 train，为 False 时马上返回 h。"]
    - ["两种情况：测试时原样返回 h；训练时做出保留掩码，把丢弃的单元设为 0，并缩放保留的单元。", "保留掩码在 u 至少为 p 的地方是 True。保留的单元要除以保留下来的单元所占的比例。"]
  after: "乘以保留掩码，把丢弃的单元设为 0。除以 1 − p，让每个单元的平均值和不用 dropout 时一样，所以测试时这一层可以原样返回 h。记得写括号：/ 1 - p 会先除以 1。"
