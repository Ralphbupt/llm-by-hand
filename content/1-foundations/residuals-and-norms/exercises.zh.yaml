grad-plain:
  prompt: "一个普通堆叠有 4 层。往下传时，每一层都把梯度乘上它的斜率 0.5。顶部的梯度是 1。传到底部的是多少？"
  after: "0.5 × 0.5 × 0.5 × 0.5 = 0.0625，十六分之一。三十层这样的层会只剩大约十亿分之一。"
  hints:
    - "这是把四个斜率加起来了。往下传时，每一层是把梯度乘上它的斜率。"
    - "这是三层。数一数乘法：每层一次，一共四层。"
    - "这是一层。梯度要穿过全部四层。"
    - ["顶部从 1 开始。第一层对它做了什么？", "每一层乘 0.5。从 1 开始，做四次。"]

depth-guess:
  prompt: "30 个普通 tanh 层。往下传时，每一层把梯度缩到原来的大约四分之三。顶部的梯度标准差是 1。传到第 0 层时，它大约有多大？"
  options: ["大约 1，和顶部一样", "大约 0.1", "大约 0.0001"]
  hints:
    - "每一层只留下四分之三。30 个 3/4 乘起来是多少？"
    - "十个 3/4 乘起来就已经是大约 0.06 了。一共有三十个，所以要这样做三次。"
  reveal: "大约 0.0001。在 demo.py 里，标准差在顶部是 1.02，往下 10 层是 0.098，往下 20 层是 0.0059，到底部是 0.000135。前十层把它除以大约 10，接下来十层除以大约 17，最后十层除以大约 44：越往下缩得越快。"

res-deriv:
  prompt: "一个残差层计算 y = x + f(x)，其中 f(x) = 0.5 · x。斜率 dy/dx 是多少？"
  after: "dy/dx = 1 + f′(x) = 1 + 0.5 = 1.5。那个 1 来自普通的 x 通路，不管 f 做什么，它都在。"
  hints:
    - "这只是 f 的斜率。y 里还有 x 本身，它的斜率是 1。"
    - "这是 x 那一部分的斜率。再加上 f(x) = 0.5·x 的斜率。"
    - ["y 是两部分的和。每一部分的斜率是多少？", "和的斜率等于斜率之和。x 的斜率是 1。0.5·x 的斜率是多少？"]

resblock-shape:
  prompt: "x 的形状是 (64, 8, 8)：64 个通道，每个 8×8。层这一侧的两个卷积都是 3×3、填充 1、64 个卷积核。F(x) 是什么形状？"
  after: "(64, 8, 8)，和 x 一样。填充 1 保持 8×8，64 个卷积核给出 64 个通道，所以 x + F(x) 可以逐格相加。"
  hints:
    - "这是不加填充的 3×3 卷积。填充 1 时，高和宽保持不变。"
    - "数对了，但要保持 x 的顺序：先通道，再高和宽。"
    - ["一个有 64 个卷积核的卷积输出多少个通道？", "3×3 卷积核加填充 1，会保持 x 的高和宽。"]

bn-x20:
  prompt: "特征 0（第 0 列）是 [1, 1, 5, 5]，均值是 3。求它的标准差，再求 X[2][0] 的 BatchNorm 值 = (5 − 均值) ÷ 标准差。忽略那个很小的 ε。"
  after: "和 3 的差是 −2、−2、2、2。它们的平方都是 4，所以方差是 4，标准差是 2。(5 − 3) ÷ 2 = 1。"
  hints:
    - "2 是标准差。现在用差 5 − 3 除以它。"
    - "检查一下标准差：方差是 4，标准差是它的平方根。"
    - "大小对了，符号反了。X[2][0] = 5 比均值大，所以结果是正的。"
    - ["先求 [1, 1, 5, 5] 的标准差：每个数减去 3，再平方。", "差是 −2、−2、2、2 → 平方是 4、4、4、4。方差是它们的平均，标准差是方差的平方根。"]

running:
  prompt: "BatchNorm 某个特征的滑动平均是 2。下一批这个特征的均值是 4。更新时保留旧值的 0.9，加上新值的 0.1。现在滑动平均是多少？"
  after: "0.9 × 2 + 0.1 × 4 = 1.8 + 0.4 = 2.2。它每次朝新的一批移动一点，所以到测试时，它存的是很多批的平均。"
  hints:
    - "这是把旧值替换掉了。更新要保留旧值的 0.9。"
    - "这是各占一半的混合。这里旧值占 0.9，新值占 0.1。"
    - "权重放反了。0.9 配旧值 2，0.1 配新值 4。"
    - ["旧值乘 0.9，新值乘 0.1。", "0.9 × 2 = 1.8。再加上 0.1 × 4。"]

bn-one:
  prompt: "用只有 1 个样本的批训练，x = [3, 7, 1]。BatchNorm 减去每个特征在整批上的均值。输出是什么？"
  options: ["[3, 7, 1]，不变", "和往常一样，均值 0、标准差 1", "不管 x 是什么，都是全 0"]
  hints:
    - "只有一个样本时，特征 0 在整批上的均值是多少？"
    - "一个数的均值就是它自己。x − x 是多少？"
  reveal: "全是 0。只有一个样本时，每个特征在整批上的均值就是这个样本自己的值，所以 x − 均值处处是 0，标准差也是 0。输入被抹掉了。BatchNorm 需要一批数据。"

ln-x21:
  prompt: "LayerNorm 用每一行自己的均值和标准差。样本 2（第 2 行）是 [5, 1, 5, 1]。X[2][1] 的 LayerNorm 值是多少？忽略 ε。"
  after: "第 2 行的均值是 3。它的差是 2、−2、2、−2，所以方差是 4，标准差是 2。(1 − 3) ÷ 2 = −1。整行变成 [1, −1, 1, −1]。"
  hints:
    - "大小对了，符号反了：X[2][1] = 1 比这一行的均值小。"
    - "这是 1 − 3。再除以这一行的标准差。"
    - "这是 BatchNorm：用的是第 1 列的均值和标准差。LayerNorm 用第 2 行。"
    - ["只用第 2 行：[5, 1, 5, 1]。它的均值是多少？", "均值是 3。差是 2、−2、2、−2，所以方差是 4。现在求标准差，再用 1 − 3 除以它。"]

bn-count:
  prompt: "一批有 32 个样本，每个 64 个特征：形状 (32, 64)。LayerNorm 算 32 个均值，每个样本一个。BatchNorm 算多少个均值？"
  after: "64 个，每个特征一个。BatchNorm 沿 64 列中的每一列往下求平均；LayerNorm 沿 32 行中的每一行横着求平均。"
  hints:
    - "这是 LayerNorm 的个数。BatchNorm 沿列往下求平均，每个特征一列。"
    - "这是把每个数都数了一遍。每个均值覆盖一整列。"
    - ["BatchNorm：每列一个均值。一共有多少列？"]

why-ln:
  prompt: "一个模型一次写一个 token，所以每一步它的输入只有一个序列。哪种归一化在这里仍然管用？"
  options: ["用批统计量的 BatchNorm", "LayerNorm", "两种都一样好"]
  hints:
    - "只有一个序列时，批统计量是从什么算出来的？"
    - "批大小为 1 时，每个特征的均值就是这个样本自己的值。这时 BatchNorm 给出什么？"
  reveal: "LayerNorm。每个 token 在它自己的特征上做归一化，所以不需要其他样本。只有一个序列时，BatchNorm 的批统计量就来自这一个序列。批大小为 1 时，BatchNorm 给出全 0。这是每个 Transformer 块都用 LayerNorm（或者类似的 RMSNorm，第 19 关）的三个原因之一。"

ln-code:
  prompt: "写出 `layer_norm`：用每一行（一个样本）自己的均值和方差对它做归一化，开平方根之前给方差加上 ε，就像 `batch_norm` 对列做的那样。"
  after: "和 `batch_norm` 唯一的区别是 axis=1：统计量沿每一行横着算，而不是沿每一列往下算。所以每个样本单独归一化，批大小为 1 也没问题。keepdims=True 给出 (B, 1) 的均值，它能沿着这一行广播。"
  tests:
    - "第 2 行 = [5, 1, 5, 1] 应该变成 [1, −1, 1, −1]"
    - "单个样本也必须能用：[1, 1, 3, 3] → [−1, −1, 1, 1]"
    - "全是同一个数的一行方差是 0：有了 ε，你得到的是 0，而不是除以 0"
    - null
  hints:
    - "在 `layer_norm` 里先给 mean 和 var 赋值再使用，就像 `batch_norm` 那样。"
    - ["均值必须保留它的轴，才能和 X 广播。用 keepdims=True。", "用了 keepdims=True，一张 (4, 4) 的表会给出 (4, 1) 的均值，它能沿每一行广播。"]
    - ["第 2 行不对。均值是沿一行横着算的，还是沿一列往下算的？", "`batch_norm` 用 axis=0，沿每一列往下。行是另一个轴。"]
    - ["一行全相等的数方差是 0。是什么让除法保持安全？", "除以 np.sqrt(var + eps)，而不是 np.sqrt(var)。"]
    - ["照着 `batch_norm` 的样子写：一个均值，一个方差，然后做除法。", "改一下轴，让每一行有自己的均值和方差。"]
