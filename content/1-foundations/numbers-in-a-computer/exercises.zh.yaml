decode-6:
  prompt: "一个 float16 数的比特是 0 10001 1000000000：符号位 0，指数位 10001（也就是 17），尾数 1000000000（也就是 512）。float16 有 10 个尾数位，指数偏移是 15。这个数是多少？"
  after: "(1 + 512/1024) × 2^(17 − 15) = 1.5 × 4 = 6。符号位是 0，所以它是正数。"
  hints:
    - "1.5 只是尾数那部分。还要乘上 2^(指数 − 偏移)。"
    - "4 是 2^(17 − 15)。再乘上尾数那部分，1 + 512/1024。"
    - "3 是 1.5 × 2。幂次是 17 − 15 = 2，所以是 2² = 4。"
    - ["用 (1 + mant/1024) × 2^(exp − 15)。", "mant/1024 = 512/1024 = 0.5，exp − 15 = 2。"]

count-bf16:
  prompt: "bfloat16 有 7 个尾数位。从 1 到 2（包括 1，不包括 2），一共有多少个不同的 bfloat16 数？"
  after: "7 位能组成 2⁷ = 128 种组合，所以有 128 个数：1、1 + 1/128、1 + 2/128……一直到 1 + 127/128。相邻两个数相差 1/128 ≈ 0.0078。"
  hints:
    - "7 是位数。7 位能组成多少种不同的组合？"
    - "每多一位，组合数就翻一倍：2 × 2 × …，乘七次。"
    - "256 = 2⁸，那需要 8 个尾数位。bfloat16 只有 7 个。"
    - ["在 1 和 2 之间，指数是固定的。只有尾数在变。", "n 位能组成 2ⁿ 种组合。"]

gap-256:
  prompt: "bfloat16 从 1 到 2 有 128 个数，所以相邻两个数相差 1/128。从 256 到 512 的数用的是同样的 128 种尾数组合，只是放大了 256 倍。那里相邻两个数相差多少？"
  after: "256 × 1/128 = 2。那里的 bfloat16 数是 256、258、260…… bfloat16 存不下 257。"
  hints:
    - "那是 1 到 2 之间的间隔。从 256 到 512 的每个数都大了 256 倍，间隔也一样。"
    - "256 是整个区间 [256, 512) 的长度。这个区间里有 128 个数。"
    - ["还是那 128 种组合，但区间宽度从 1 变成了 256。", "从 1 到 2 时，间隔是 1/128。这里的每个数都大了 256 倍，间隔也一样。"]

pred-bf16-add:
  prompt: "在 bfloat16 里，从 256 到 512 的相邻两个数相差 2。256 + 0.75 存进 bfloat16 后是多少？"
  options: ["256.75", "256", "258"]
  hints:
    - "256.75 是不是 bfloat16 数 256、258、260……中的一个？"
    - "哪个相邻的数离 256.75 更近：256（差 0.75）还是 258（差 1.25）？"
  reveal: "256。结果会舍入到最近的 bfloat16 数，而 256.75 离 256 比离 258 更近。加上 0.75 什么都没改变。这就是一个很大的权重上的小更新会消失的原因。"

pred-overflow:
  prompt: "float16 最大的数是 65504。np.float16(300) * np.float16(300) 是多少？"
  options: ["90000", "65504", "inf"]
  hints:
    - "90000 是真正的答案。float16 能存下比 65504 还大的数吗？"
    - "NumPy 不会停在最大的数上。对这个格式来说太大的结果会变成无穷大。"
  reveal: "inf。300 × 300 = 90,000 比 65504 大，所以它上溢成无穷大。在 float32 里同样的乘积没问题：它最大的数约是 3.4 × 10³⁸。"

exp-limit:
  prompt: "e¹¹ ≈ 59 874，e¹² ≈ 162 755。float16 最大的数是 65504。让 np.exp(np.float16(z)) 不是 inf 的最大整数 z 是多少？"
  after: "e¹¹ ≈ 59 874 还在 65504 以下；e¹² 就超了。所以在 float16 里，任何大于约 11 的分数都会让 exp 上溢。在 float32 里，这个上限约是 88。"
  hints:
    - "e¹² ≈ 162 755 超过了 65504，所以它变成 inf。"
    - "把 e¹¹ 和 e¹² 分别和 65504 比一比。"

pred-naive:
  prompt: "分数 z = [1000, 1001]，用 float32，而在 float32 里 e⁸⁹ 就已经是 inf 了。直接用公式 e^z / sum(e^z) 会得到什么？"
  options: ["[0.27, 0.73]", "[0, 1]", "[nan, nan]"]
  hints:
    - "这是纸面上的正确答案。跟着计算机走一遍：float32 里 e¹⁰⁰⁰ 是多少？"
    - "e¹⁰⁰⁰ 和 e¹⁰⁰¹ 都是 inf，它们的和也是。inf / inf 是多少？"
  reveal: "[nan, nan]。e¹⁰⁰⁰ 和 e¹⁰⁰¹ 都上溢成 inf，和也是 inf，而 inf / inf 是 nan（“not a number”，不是一个数）。"

softmax-stable:
  prompt: "分数 z = [1000, 1001]。先减去最大的分数：[−1, 0]。用 e⁻¹ ≈ 0.37 和 e⁰ = 1。第 1 个分数（1001 那个）的 softmax 概率是多少？保留两位小数。"
  after: "e⁰ / (e⁻¹ + e⁰) = 1 / 1.37 ≈ 0.73。另一个得到 0.37 / 1.37 ≈ 0.27。这和 softmax 对 [1, 2]，或者对任意两个相差 1 的分数给出的数一样。"
  hints:
    - "0.27 是较小那个分数的概率。第 1 个分数是 1001 那个。"
    - "用 e⁰ 除以两者的和：0.37 + 1。"
    - ["减去 1001 之后：第 0 个分数 → −1，第 1 个分数 → 0。对每个求 e 的幂。", "两者的和是 0.37 + 1 = 1.37。第 1 个分数分到这个和里属于它的那一份。"]

lse:
  prompt: "用 ln 2 ≈ 0.69。ln(e¹⁰⁰⁰ + e¹⁰⁰⁰) 是多少？保留两位小数。（计算机直接算会得到 inf，但你可以手算。）"
  after: "把最大的分数作为因子从和里提出来：ln(e¹⁰⁰⁰ · (1 + 1)) = 1000 + ln 2 ≈ 1000.69。这就是 log-sum-exp：m + ln Σ e^(z − m)。"
  hints:
    - "ln(a + b) 不等于 ln a + ln b。先把 e¹⁰⁰⁰ + e¹⁰⁰⁰ 写成 2 · e¹⁰⁰⁰。"
    - "接近了，但和里有两个相等的项：2 · e¹⁰⁰⁰。ln 2 还在。"
    - "那只是 ln 2。ln(2 · e¹⁰⁰⁰) = ln 2 + ln e¹⁰⁰⁰。"
    - ["e¹⁰⁰⁰ + e¹⁰⁰⁰ = 2 · e¹⁰⁰⁰。", "ln(a · b) = ln a + ln b，而 ln e¹⁰⁰⁰ = 1000。"]

code-softmax:
  prompt: "写出让 softmax 对很大的分数也安全的那一行：在 exp 之前，减去每一行最大的分数。"
  template: |
    def stable_softmax(z):
        e = ____
        return e / e.sum(axis=-1, keepdims=True)

    print(stable_softmax(np.array([1000.0, 1001.0])))   # 约 [0.27, 0.73]
  after: "给一行里的每个分数都减去同一个数，softmax 不变，而现在最大的 exp 是 e⁰ = 1，所以什么都不会上溢。keepdims=True 给出形状 (B, 1)，所以每一行减去的是它自己的最大值。"
  tests:
    - "[1000, 1001] → [0.27, 0.73]，没有 nan"
    - "[−1000, −999]：直接用公式会得到 0 / 0"
    - "一次两行：每一行减去它自己最大的分数"
  hints:
    - "还有东西在上溢。在 np.exp(…) 里面、求 exp 之前，减去最大的分数。"
    - ["一行对了，两行不对。最大值是按每一行取的吗？", "沿最后一个轴取最大值，并保留这个轴，这样 (2, 1) 的最大值就能和 z 的每一行对得上。"]
    - ["从每个分数里减去最大的分数，再对结果求 e 的幂。", "每一行最大的分数来自 max 方法。它的结果必须保持形状 (B, 1)，才能和 z 对得上。", "对 z = [1000, 1001]，相减得到 [−1, 0]，exp 后约是 [0.37, 1]。"]

bf16-update:
  prompt: "权重 w = 1 存在 bfloat16 里，那里 1 上面的下一个数是 1 + 1/128 ≈ 1.0078。一次更新加上 0.001。更新后存进 bfloat16 的 w 是多少？"
  after: "1.001 离 1 比离 1.0078 近得多，所以它舍入回 1。这次更新丢了。这样做 100 次，w 还是 1；在 float32 里它会是 1.1。"
  hints:
    - "1.001 不是 bfloat16 数。把它舍入到最近的那个：1 还是 1.0078？"
    - "1.001 离 1 差 0.001，离 1.0078 差 0.0068。哪个更近？"
    - "结果必须是一个 bfloat16 数：1 或 1.0078。选更近的那个。"

code-ce:
  prompt: "用 log-sum-exp 从原始分数写出 `cross_entropy`，让它永远碰不到 inf。z 的形状是 (B, V)；t 存的是每一行的目标下标。算出 lse：每行一个 log-sum-exp，形状 (B,)。"
  template: |
    def cross_entropy(z, t):
        ____
        picked = z[np.arange(len(t)), t]     # 每一行目标的分数
        return (lse - picked).mean()

    print(cross_entropy(np.array([[1000.0, 1000.0]]), np.array([0])))   # ln 2 ≈ 0.693
  after: "交叉熵是 ln Σ e^z − zₜ，只有第一部分可能上溢。先把 m 提出来，每个 exp 看到的分数就都不超过 0，所以和在 1 到 V 之间。m[:, 0] 去掉多出来的那个轴，所以 lse 的形状是 (B,)，和 picked 一样。"
  tests:
    - "分数 [1000, 1000]，目标 0：ln 2 ≈ 0.693"
    - "四个相等的分数：ln 4 ≈ 1.386"
    - "很有把握却错了：损失是 1000，很大，但不是 inf"
    - "两行：(0.313262 + 0.693147) / 2"
  hints:
    - "return 那一行用到了 lse。在你写的几行里给 lse 赋值，每行一个值。"
    - ["lse 的形状必须是 (B,)，和 picked 一样。检查一下你加起来的每一部分的形状。", "z − m 时保留 keepdims=True。把最大值加回去时，用 m 的 (B,) 形式，而不是 (B, 1) 形式。"]
    - "结果是 inf 还是 nan？exp 看到的必须是 z − m，绝不能是 z 本身。"
    - "一行对了，两行不对。沿第 1 轴取最大值和求和，每行一个。"
    - ["log-sum-exp 是 m + ln Σ e^(z − m)，m 是这一行最大的分数。写两行：先写 m，再写 lse。", "m 是每一行最大的分数，保持形状 (B, 1)。log 里面的求和沿同一个轴进行。", "对 [1000, 1000] 这一行：m = 1000，z − m = [0, 0]，exp 的和是 2，所以 lse = 1000 + ln 2。"]

pred-nan-spread:
  prompt: "w = [0.5, nan, −1]，x = [1, 2, 3]。w @ x 是多少？"
  options: ["−2.5：NumPy 会跳过 nan", "nan", "报错"]
  hints:
    - "NumPy 什么都不跳过。nan × 2 是多少？任何数 + nan 又是多少？"
    - "NumPy 遇到 nan 不会停下来。它会接着算，给出一个结果。"
  reveal: "nan。nan × 2 是 nan，任何数 + nan 也是 nan。一个 nan 权重让输出变成 nan，接着是损失，然后是每一个经过它的梯度；下一次更新之后，那些权重也都成了 nan。"
