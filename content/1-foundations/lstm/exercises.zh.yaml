lstm-c:
  prompt: "cₚᵣₑᵥ = 1.0，f = 0.9，i = 0.5，g = 0.8。c = f·cₚᵣₑᵥ + i·g 是多少？"
  after: "0.9 × 1.0 + 0.5 × 0.8 = 0.9 + 0.4 = 1.3。细胞保留了原来的 90%，又加上了候选值的一半。"
  hints:
    - "这只是保留下来的那部分。再加上新的那部分 i·g。"
    - "这只是新的那部分。再加上保留下来的那部分 f·cₚᵣₑᵥ。"
    - ["用 c = f·cₚᵣₑᵥ + i·g：一部分是细胞保留的，一部分是它新加的。", "两个乘积，再相加：0.9 × 1.0 和 0.5 × 0.8。"]

lstm-h:
  prompt: "c = 1.3，输出门 o = 0.6。用 tanh(1.3) ≈ 0.86。h = o·tanh(c) 是多少？（保留 2 位小数）"
  after: "0.6 × 0.86 ≈ 0.52。"
  hints:
    - "这是 o × c。先对 c 取 tanh。"
    - "这是 tanh(c)。输出门只拿出其中的 60%。"
    - ["h = o·tanh(c)。tanh(1.3) 是哪个数？", "用 o = 0.6 乘 tanh(1.3) ≈ 0.86。"]

gate-value:
  prompt: "遗忘门是 f = sigmoid(`w_f`·x + `u_f`·hₚᵣₑᵥ + `b_f`)。`w_f` = 2，x = 1，`u_f` = 0，hₚᵣₑᵥ = 0，`b_f` = 1，f 是多少？用 e⁻³ ≈ 0.05。（保留 2 位小数）"
  after: "z = 2 × 1 + 0 × 0 + 1 = 3，sigmoid(3) = 1 / (1 + e⁻³) = 1 / 1.05 ≈ 0.95。这个输入让细胞几乎全部保留。"
  hints:
    - "这是 z。门是 sigmoid(z)，在 0 和 1 之间。"
    - ["先算括号里的和：`w_f`·x + `u_f`·hₚᵣₑᵥ + `b_f`。", "z = 3。然后 sigmoid(3) = 1 / (1 + e⁻³)，而 e⁻³ ≈ 0.05。"]

keep-10:
  prompt: "不加入新东西（i = 0），每一步 f = 0.9。c 从 1 开始。用 0.9⁵ ≈ 0.59。10 步之后 c 是多少？（保留 2 位小数）"
  after: "0.9¹⁰ = 0.9⁵ × 0.9⁵ ≈ 0.59 × 0.59 ≈ 0.35。50 步之后大约是 0.005，所以即使是 0.9，时间一长也会忘掉。"
  hints:
    - "细胞每一步乘以 0.9。十步就是 0.9 的 10 次方。"
    - "这是五步。十步是两个 0.9⁵ 相乘：0.59 × 0.59。"
    - ["每一步都把 c 乘以 f。", "0.9¹⁰ = 0.9⁵ × 0.9⁵。"]

f-half:
  prompt: "不加入新东西。要在 50 步之后还保留一半的 c，遗忘门 f 大约要是……"
  options: ["0.5", "0.9", "0.99"]
  hints:
    - "0.5 一步就减半了。50 步之后，0.5⁵⁰ 几乎什么都不剩。"
    - "f = 0.9 时，10 步之后 c 是 0.9¹⁰ ≈ 0.35。五十步是它的五倍长。"
  reveal: "大约 0.99（准确值是 0.986）：f⁵⁰ = 0.5。用 0.9 的话，50 步之后几乎什么都不剩（0.005）。要记住很长一段，门必须非常接近 1。"

k80:
  prompt: "两个 LSTM 只有遗忘门的初始偏置不同：0 或 2。任务是“记住第一个符号”，k = 80，训练 1,500 步，状态有 32 个数。普通 RNN 只能瞎猜（大约 50%）。哪个 LSTM 能达到大约 100%？"
  options: ["两个 LSTM 都能：有门就够了", "只有遗忘门偏置从 2 开始的那个", "都不能：80 步太长了"]
  hints:
    - "遗忘门偏置为 0 时，f 一开始是 0.5。0.5 的 79 次方是什么样子？"
    - "比较 f = 0.5 和 f ≈ 0.88 走过 79 步后的结果。0.5⁷⁹ 大约是 2 × 10⁻²⁴。0.88⁷⁹ 是多少？"
  reveal: "只有遗忘门偏置从 2 开始的那个。所有偏置都为 0 时，遗忘门一开始都是 0.5，这个 LSTM 卡在 50.5%，和 RNN 一样。从 f ≈ 0.88 开始时，第一个 token 仍然能影响最后一步：0.88⁷⁹ ≈ 4 × 10⁻⁵，比 0.5⁷⁹ ≈ 2 × 10⁻²⁴ 大得多。那个 LSTM 达到了 100%。在实验台里选 k = 80 看看。"

chance:
  prompt: "有 6 种颜色。如果一个模型语法全对，但第二个颜色是随机挑的，它写的句子有多大比例符合所有规则？（百分数，保留 1 位小数）"
  after: "六分之一 = 16.7%。模型必须比这做得更好：停在 17% 附近的模型学会了语法，但没学会颜色规则。"
  hints:
    - "可选的颜色有 6 种，不是 2 种。"
    - "这是比例。写成百分数。"
    - ["随机挑 6 次，第二个颜色和第一个对上 1 次。", "把 1/6 写成百分数，保留 1 位小数。"]

rnn-color:
  prompt: "看之前先猜：同样的训练（1,800 步，状态有 128 个数），但换成普通 RNN。颜色规则会怎样？"
  options: ["能学会，只是晚一些", "学会了语法，但颜色停在 1/6 左右", "两样都学不会"]
  reveal: "语法学会了，颜色没学会：1,800 步之后，它写的句子 0% 语法错误，但只有 13% 符合所有规则，这是随机水平。17 个字符对它来说已经太远了。把实验台切到“普通 RNN”看看。"

lstm-step:
  prompt: "写出细胞的更新：保留旧 c 的 f 那么多，再加上 i 乘候选值 g。"
  template: |
    def sigmoid(z):
        return 1 / (1 + np.exp(-z))

    def lstm_step(x, h, c, W, U, b):
        z = x @ W + h @ U + b              # 四个门一次算出：4H 个数
        H = h.shape[0]
        f = sigmoid(z[:H])                 # 遗忘门
        i = sigmoid(z[H:2 * H])            # 输入门
        g = np.tanh(z[2 * H:3 * H])        # 候选值
        o = sigmoid(z[3 * H:])             # 输出门
        c = ____
        h = o * np.tanh(c)
        return h, c

    h, c = lstm_step(np.array([0.]), np.zeros(1), np.array([1.]),
                     np.zeros((1, 4)), np.zeros((1, 4)), np.array([2., 0, 1, 0]))
    print("c =", c, " h =", h)
  tests:
    - "f = sigmoid(2) = 0.8808，i = 0.5，g = tanh(1) = 0.7616，cₚᵣₑᵥ = 1"
    - "H = 2，D = 3，随机权重（随机种子 0）"
  hints:
    - ["cₚᵣₑᵥ = 1，f = 0.8808，i = 0.5，g = 0.7616 时，c 应该是 1.2616。是哪两个乘积组成的？", "保留的那部分用遗忘门 f，加进来的那部分用输入门 i。"]
    - ["两部分：细胞保留的，和它新加的。看第 1 节的公式。", "遗忘门 f 决定旧的 c 留下多少，输入门 i 决定 g 加进来多少。"]
  after: "两个乘积都是逐元素的：c 的 H 个数各有各的门。因为 f 接近 1，而且这条通路上没有任何压缩，c 能把一个数几乎原样地带过很多步。"

gru-h:
  prompt: "GRU 的一步：hₚᵣₑᵥ = 0.6，更新门 z = 0.25，候选值 h̃ = −0.2。新的 h = (1 − z)·hₚᵣₑᵥ + z·h̃ 是多少？"
  after: "0.75 × 0.6 + 0.25 × (−0.2) = 0.45 − 0.05 = 0.4。旧状态留下四分之三，候选值加进来四分之一。"
  hints:
    - "这只是保留下来的那部分。再加上 z × h̃，这里它是负的。"
    - "z × h̃ 是 0.25 × (−0.2) = −0.05：要减去，不是加上。"
    - "这把两个权重弄反了。旧状态得到 1 − z = 0.75，候选值得到 z = 0.25。"
    - ["两部分：旧状态的 (1 − z)，候选值的 z。", "0.75 × 0.6，再加上 0.25 × (−0.2)。"]

gru-params:
  prompt: "输入有 D = 10 个数，状态有 H = 20 个数。循环层的每一块有一个 (D, H) 的输入矩阵、一个 (H, H) 的状态矩阵和 H 个偏置：10×20 + 20×20 + 20 = 620 个数。LSTM 有 4 块。GRU 有多少个数？"
  after: "3 块（z、r 和候选值）× 620 = 1,860。LSTM 有 4 × 620 = 2,480，多三分之一。"
  hints:
    - "这是 LSTM，4 块。数一数 GRU 有几块：两个门和候选值。"
    - "两个门是两块，但候选值 h̃ 也需要自己的权重。"
    - ["数一数 GRU 有几块：每个门和候选值各一块。", "GRU 的一块和 LSTM 的一块一样，都是 620 个数。"]

bi-read:
  prompt: "句子是 “he sat by the bank of the river”（8 个词，从 0 开始数，“bank” 是第 4 个词）。反向 RNN 从 “river” 开始。它读到 “bank” 时，算上 “bank”，一共读了几个词？"
  after: "river、the、of、bank：4 个词。正向 RNN 读了 he、sat、by、the、bank：5 个。合在一起，“bank” 处的输出看到了整个句子。"
  hints:
    - "这是正向 RNN，从 “he” 开始读。反向的从另一头开始。"
    - "把 “bank” 自己也算上：river、the、of、bank。"
    - ["反向 RNN 从最后一个词往第一个词读。", "从 river（第 7 个词）往回数到 bank（第 4 个词）。"]

bi-size:
  prompt: "每个方向的 H = 32。对一个 8 个词的句子，输出是每个词一行，每行是正向和反向的状态并排放在一起。它是什么形状？"
  after: "8 个词，每个 32 + 32 = 64 个数：(8, 64)。"
  hints:
    - "这是一个方向。每一行里两个状态并排放着。"
    - "两个状态并排放在同一行里，而不是多出几行。"
    - ["每个词一行。", "每一行：先是 32 个正向的数，然后是 32 个反向的数。"]

bi-generate:
  prompt: "两项任务。(1) 给一个已经写完的句子的每个词标上名词、动词等。(2) 一次一个词地写一个句子。双向 RNN 能做哪项？"
  options: ["两项都能", "只能给词打标签", "只能写句子", "都不能"]
  hints:
    - "模型正要写第 5 个词时，从右往左的那一遍能读哪些词？"
    - "写句子时，从右往左的那一遍需要后面的词。它们已经存在了吗？"
    - "打标签时，整个句子已经在那里了。两遍都能读它吗？"
  reveal: "只能打标签。打标签时，回答之前整个句子就已经存在，所以两遍都能读它。写句子时，反向那一遍要从末尾读，而末尾还没写出来。双向 RNN 适合先拿到全部输入的任务：给词打标签、给句子分类，或者读入 seq2seq 模型的输入（支线 N5）。"

gru-boss:
  prompt: "Boss 第 1 部分。写出 GRU 的一步：更新门 z、重置门 r、候选值 h̃ 和新的 h，公式都在第 3 节。把 ____ 换成你需要的若干行。"
  template: |
    def sigmoid(z):
        return 1 / (1 + np.exp(-z))

    def gru_step(x, h, P):
        # 都是行向量：x (D,)，h (H,)。
        # P 里有 Wz、Wr、Wh (D, H)，Uz、Ur、Uh (H, H)，以及 bz、br、bh (H,)
        ____
        return h_new

    P = {k: np.zeros((1, 1)) for k in ["Wz", "Uz", "Wr", "Ur", "Wh", "Uh"]}
    P.update({k: np.zeros(1) for k in ["bz", "br", "bh"]})
    print(gru_step(np.array([3.]), np.array([0.8]), P))
  tests:
    - "所有权重都是 0：z = r = 0.5，h̃ = tanh(0) = 0，所以 h = 0.5 × 0.8"
    - "z ≈ 1（更新门全开），h̃ = tanh(0) = 0：新的 h 几乎全是 h̃"
    - "r ≈ 1（重置门全开），z ≈ 1：h = h̃ = tanh(1 × 0.9)"
    - "r ≈ 0（重置门全关）：候选值忽略旧的 h，所以 h̃ = tanh(0) = 0"
    - "D = 3，H = 2，随机权重（随机种子 3）"
  hints:
    - "每个名字都要先赋值再使用：先是 z 和 r，然后是候选值，最后是 `h_new`。"
    - "权重是 P[\"Wz\"]、P[\"Uz\"]、P[\"bz\"] 等等：W、U 或 b，后面跟门的字母。"
    - ["这里 z ≈ 1，候选值是 0，所以 `h_new` 应该大约是 0。如果你得到的大约是 0.9，说明你的 `h_new` 保留了旧的 h，而没有取候选值。", "z 是 `h_new` 里来自候选值的比例，1 − z 是来自旧 h 的比例。检查一下它们各自乘的是 h 还是 h̃。"]
    - ["r = 1（重置门全开）时，候选值应该能看到旧的 h。r 放在哪里？", "候选值用 Uh 乘的是 (r * h)，而不是 h。"]
    - "r = 0（重置门全关）时，候选值一定不能看到旧的 h。检查一下候选值里是不是用 r 乘了 h。"
    - ["所有权重都是 0 时，两个门都是 0.5，候选值是 0。h 的哪一部分会留下来？", "`h_new` 用 1 − z 和 z 把旧的 h 和候选值 h̃ 混在一起。"]
    - ["四行：z、r、候选值、`h_new`。公式在第 3 节。", "每个门都是 sigmoid(x @ W + h @ U + b)，各有各的 W、U、b。"]
  after: "z 和 r 是两个带 sigmoid 的小层，所以状态里的每个数对应的门都在 0 和 1 之间。r 决定候选值能看到多少旧的 h；z 把旧的 h 和候选值混在一起。z 接近 0 时，GRU 保住它的状态，就像遗忘门接近 1 的 LSTM。"

boss-line:
  prompt: "Boss 第 2 部分。把 boss.py 为你自己的 LSTM 单元打印的 PASS 那一行粘贴到引号之间。"
  template: |
    line = "____"      # 它看起来像这样：N4 PASS 0.900 1a2b3c4d
    print(line)
  tests:
    - "boss.py 打印的 PASS 行：N4 PASS、分数、代码"
    - "代码和分数对得上：这一行没有被改过"
    - "分数至少是 0.9（90%）"
  hints:
    - "粘贴整行，四个部分都要有：N4、PASS、分数和代码。"
    - ["从 /files/lstm/boss.py 下载 boss.py，补全 LSTMCell.forward，然后在同一个文件夹里运行 python boss.py。", "复制以 N4 PASS 开头的整行，粘贴到引号之间。"]
    - "代码和分数对不上。照 boss.py 打印的样子重新复制这一行，不要改动。"
    - "把 boss.py 打印的整行粘贴到引号之间。"
  after: "你自己写、自己训练的 LSTM 单元，写出的句子符合所有规则。行末的代码只能说明这一行是原样粘贴的；这一部分靠你的诚实。"
