n-batches:
  prompt: "一个数据集有 10 个样本。批大小是 4，最后一批拿走剩下的所有样本。一轮里有几批？"
  after: "各批从 0、4 和 8 开始，大小分别是 4、4 和 2。一共 3 批，因为 10 / 4 = 2.5，要向上取整。"
  hints:
    - "2 批、每批 4 个，只覆盖了 8 个样本。样本 8 和 9 去哪了？"
    - "一批要么有，要么没有。半批仍然是一批，只是短一点。"
    - ["从样本 0 开始，每次取 4 个。每一批从哪里开始？", "第一批是样本 0 到 3，下一批从 4 开始。一直数到没有样本剩下为止。"]

last-batch:
  prompt: "10 个样本，批大小 4。最后一批有几个样本？"
  after: "前两批拿走 8 个样本。最后一批拿到剩下的 2 个：样本 8 和 9。"
  hints:
    - "一共只有 10 个样本。两个满的 4 个一批之后，还剩几个？"
    - ["先数满的批用掉了几个样本。", "两个满的批，每批 4 个，用掉了 10 个里的 8 个。"]

steps-epochs:
  prompt: "10 个样本，批大小 4，保留最后那个不满的批。你训练 3 轮。一共是多少步（权重更新）？"
  after: "每轮 3 批，每批一步：3 × 3 = 9 步。"
  hints:
    - "30 数的是样本，不是步。一步用掉整整一批。"
    - "那是每轮 2 批的情况。最后那个不满的批也是一步。"
    - "不满的批仍然是完整的一步。先数每轮有几批：3。"
    - ["步数 = 轮数 × 每轮的批数。", "这里一轮有 3 批：大小分别是 4、4 和 2。"]

pred-sorted:
  prompt: "10 个样本按类别排好序存放：样本 0–4 是类别 0，5–9 是类别 1。不打乱，批大小 5。每一步训练看到的是什么？"
  options:
    - "每一批里两个类别都有，混合得很公平"
    - "第 0 批只有类别 0，第 1 批只有类别 1，所以每一步把权重往一边拉，下一步又拉回来"
    - "每一轮都只有类别 0"
  hints:
    - "不打乱时，第 0 批是样本 0–4。它们是哪个类别？"
    - "第 1 批是样本 5–9。它也在每一轮里被用到。"
  reveal: "第 0 批只有类别 0，第 1 批只有类别 1。每一步只看到一个类别，所以它把模型推向“全都是类别 0”，下一步又推回来。一批的梯度是整个数据集的一个糟糕样本。打乱就能解决这个问题。"

code-batches:
  prompt: "把一个随机顺序切成批。写出从 i 开始、取出一批下标的那个切片。"
  template: |
    def batches(n, batch_size, rng):
        idx = rng.permutation(n)       # 0 … n−1 的一个随机顺序
        return [____ for i in range(0, n, batch_size)]

    bl = batches(10, 4, np.random.default_rng(0))
    print([b.tolist() for b in bl])    # [[4, 6, 2, 7], [3, 5, 9, 0], [8, 1]]
  after: "range(0, n, `batch_size`) 给出每一批的起点，切片取出接下来的 `batch_size` 项。超出末尾的切片会直接停下，所以最后一批短一些。切的是 idx 而不是 range(n)，顺序才是随机的。"
  tests:
    - "10 个样本，批大小 4：大小 4、4、2"
    - "每个样本恰好出现一次"
    - "顺序被打乱了，不是 0, 1, 2, …"
    - "7 个样本，批大小 3"
  hints:
    - "顺序是 0, 1, 2, … 要切的是打乱后的 idx，不是 range(n)。"
    - "方括号里可以用 idx、i 和 `batch_size`。"
    - ["每一批应该有 `batch_size` 个下标。", "这一批从 i 开始。切片必须在哪里停下，才正好有 `batch_size` 项？"]
    - ["取 idx 的一个从 i 开始的切片。", "idx[a:b] 包含从位置 a 到位置 b 的项，不含 b。这里 a 是 i。b 应该是什么？", "i = 4、批大小为 4 时，这一批是 idx 的第 4、5、6、7 项。"]

heldout-steps:
  prompt: "50 个样本。你留出其中的 20%，只划分一次，用剩下的训练，批大小 8。一轮里有多少步训练？"
  after: "50 的 20% 是 10 个留出，所以剩 40 个用来训练。40 / 8 = 每轮 5 步。"
  hints:
    - "这用了全部 50 个样本。留出的样本从不用来训练。"
    - "这用了全部 50 个样本。先把留出的 10 个拿走。"
    - "这是在用留出的 10 个训练。训练用的是另外 40 个。"
    - ["留出 20% 之后，还剩多少个样本用来训练？", "50 − 10 = 40 个训练样本。能分成几个 8 个一批？"]

pred-resplit:
  prompt: "代码不是只划分一次，而是在每一轮开始时重新随机划分一次训练集和留出集。会出什么问题？"
  options:
    - "没问题：每一轮都在新样本上衡量，反而更公平"
    - "经过很多轮，模型几乎在每个样本上都训练过了，所以留出集上的分数衡量的是模型记住了什么，而不是新数据"
    - "训练变慢了，但留出集上的分数仍然正确"
  hints:
    - "在第 5 轮被留出的样本，可能在第 1 到 4 轮里被训练过。它还是新数据吗？"
    - "问题不在速度。问问自己：留出的样本是不是仍然没见过。"
  reveal: "每一轮都重新划分，经过足够多轮之后，每个样本都进过训练集。模型以前见过这些“留出”的样本，所以分数看起来比在真正的新数据上要好。在训练开始之前，用固定的种子，只划分一次。"

pred-seed:
  prompt: "一个脚本在开头设了种子。你用种子 0 跑一次，再用种子 0 跑一次，然后用种子 1 跑一次。同样的代码，同一台电脑。哪几次运行打印出同样的损失曲线？"
  options:
    - "三次都一样"
    - "种子 0 的那两次"
    - "都不一样：训练总是随机的"
  hints:
    - "种子 1 让生成器从别的地方开始：别的初始权重，别的批顺序。"
    - "从同一个种子开始的随机数生成器，每次都给出同样的数。"
  reveal: "种子 0 的两次一样：同样的初始权重、同样的划分、同样的批顺序，所以是同样的数。种子 1 给出别的随机选择，曲线会略有不同。（在 GPU 上，除非你让 PyTorch 使用确定性算法，否则少数运算在两次运行之间的最后几位仍可能不同。）"

pad-shape:
  prompt: "三个序列 [5, 3, 8]、[2, 9] 和 [7]，在末尾用 PAD = 0 填充成一个批。这个批的形状是什么？"
  after: "3 个序列，填充到最长的长度 3：形状 (3, 3)。各行是 [5, 3, 8]、[2, 9, 0]、[7, 0, 0]。"
  hints:
    - "填充让每个序列都和最长的那个一样长。[5, 3, 8] 有多长？"
    - "截到最短会丢掉 token。填充让每个序列都和最长的那个一样长。"
    - "这把所有 token 连成了一行。一个批里每个序列占一行。"
    - ["每个序列一行。填充之后每一行有多长？", "（序列的个数，最长序列的长度）。"]

pad-count:
  prompt: "[5, 3, 8]、[2, 9] 和 [7] 填充成一个 (3, 3) 的批。有几格是 PAD？"
  after: "第 1 行需要一个 PAD，第 2 行需要两个：9 格里有 3 格 PAD。"
  hints:
    - "6 是真正的 token 的个数：3 + 2 + 1。PAD 是 9 格里剩下的。"
    - ["每一行都填充到长度 3。一行一行地数 PAD 格。", "[5, 3, 8] 这一行需要 0 个 PAD，[2, 9] 需要 1 个。[7] 需要几个？"]

pad-cells:
  prompt: "长度分别为 2、3、6 和 1 的四个序列放进同一个批，填充到最长的长度。这个批里有几格是 PAD？"
  after: "这个批是 (4, 6) = 24 格。真正的 token 占了其中 2 + 3 + 6 + 1 = 12 格，所以 12 格是 PAD：一半。"
  hints:
    - "24 是全部的格子。减去真正的 token。"
    - "6 是最长的长度。这个批有 4 行，每行长 6。"
    - ["整个批有多大？4 行，每行是最长的长度。", "整个批是 4 × 6 = 24 格。现在数真正的 token。"]

collate-code:
  prompt: "写出整理函数里的循环：把每个序列复制到 X 中它的那一行，并在掩码里把它的真实格子标成不挡住（False）。把 ____ 换成你需要的若干行。"
  template: |
    def collate(seqs, pad=0):
        L = max(len(s) for s in seqs)
        X = np.full((len(seqs), L), pad)
        mask = np.ones((len(seqs), L), dtype=bool)    # True = PAD = 挡住
        for i, s in enumerate(seqs):
            ____
        return X, mask

    X, mask = collate([[5, 3, 8], [2, 9], [7]])
    print(X)
    print(mask)
  after: "len(s) 之后的格子保持初始值：X 里是 pad，掩码里是 True。所以只需要写入真正的 token。X 和掩码用的是同一个切片，所以它们对哪些格子是真实的，总是一致。"
  tests:
    - "[5, 3, 8]、[2, 9]、[7] 的 X"
    - "掩码：只有 3 个 PAD 格是 True"
    - "pad = −1，长度 1 和 4"
  hints:
    - ["X 对了。现在看掩码：它一开始全是 True。哪些格子必须变成 False？", "掩码里的真实格子，就是你在 X 里写入的那些格子。"]
    - "第 i 行的切片必须和 s 一样长。用 len(s) 作为它的终点。"
    - "两行都放在 for 循环里面，缩进和原来的 ____ 一样。"
    - ["把 s 写进 X 第 i 行的前 len(s) 格。", "用行号 i 和一个列切片来索引 X。对第 1 行的序列 [2, 9]，就是 X[1, :2]。"]
    - ["两行：一行填 X，一行改掩码。", "两行用的是同样的格子：第 i 行，前 len(s) 列。", "对第 1 行的序列 [2, 9]，这些格子是第 1 行的第 0 列和第 1 列，X 和掩码里都一样。"]
