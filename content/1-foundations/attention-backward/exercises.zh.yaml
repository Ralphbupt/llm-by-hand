dz-fast:
  prompt: "softmax 给出 p = [0.5, 0.25, 0.25]，传到 p 的梯度是 dp = [1, 0, 2]。用上面 dz 的简短形式，不要建出 J。dz[2] 是多少？"
  promptShort: "softmax 给出 p = [0.5, 0.25, 0.25]，传到 p 的梯度是 dp = [1, 0, 2]。dz[2]，也就是分数 z₂ 处的梯度，是多少？"
  after: "dp·p = 1 × 0.5 + 0 × 0.25 + 2 × 0.25 = 1。所以 dz[2] = p₂ × (dp₂ − 1) = 0.25 × 1 = 0.25。完整的 dz 是 [0, −0.25, 0.25]，加起来是 0。"
  hints:
    - "0.5 是 p₂ × dp₂。先从 dp₂ 里减去 dp·p，再乘以 p₂。"
    - "1 是 dp·p，要从每个 dpᵢ 里减掉的那个数。现在算 p₂ × (dp₂ − 1)。"
    - "这是 p₂ × dp₂ − dp·p。要在乘以 p₂ 之前从 dp₂ 里减去 dp·p，而不是之后。"
    - ["先算那一个数 dp·p：把 dp 和 p 逐元素相乘，再加起来。", "dp·p = 1 × 0.5 + 0 × 0.25 + 2 × 0.25。然后 dz[2] = p₂ × (dp₂ − dp·p)。"]

softmax-back-code:
  prompt: "写出一个沿每一行做的 softmax 的反向传播：返回 dz = p ⊙ (dp − dp·p)，其中 dp·p 逐行计算。"
  template: |
    def softmax_backward(p, dp):
        # p：softmax 的输出，dp：传到 p 的梯度。两者都是 (行数, n)。
        return ____

    def numeric_grad(f, X, h=1e-5):
        # f() 对 X 每个元素的数值斜率（第 6 关、支线 U5）
        G = np.zeros_like(X)
        for idx in np.ndindex(X.shape):
            old = X[idx]
            X[idx] = old + h
            up = f()
            X[idx] = old - h
            down = f()
            X[idx] = old
            G[idx] = (up - down) / (2 * h)
        return G

    p = np.array([[0.5, 0.25, 0.25]])
    dp = np.array([[1.0, 0.0, 2.0]])
    print(softmax_backward(p, dp))     # 应该是 [[0, -0.25, 0.25]]

    # 梯度检验：L = sum(dp * softmax(z))，所以 p 处的梯度正好是 dp
    z = np.array([[2.0, -1.0, 0.5, 0.0]])
    g = np.array([[1.0, 3.0, -2.0, 0.5]])
    numeric = numeric_grad(lambda: (g * softmax(z)).sum(), z)
    # 最大差值应该小于 1e-8
    print(np.abs(softmax_backward(softmax(z), g) - numeric).max())
  after: "`(dp * p).sum(axis=-1, keepdims=True)` 是每一行的 dp·p，保留成一个 (行数, 1) 的列，于是它会从它那一行的每个元素里减掉。从头到尾都没有建出 n × n 的雅可比矩阵，数值检验也对得上。"
  tests:
    - "p = [0.5, 0.25, 0.25]，dp = [1, 0, 2]：本页的例子"
    - "两行：每一行用自己的 dp·p（1 和 0.1）"
    - "在 3 行随机数（每行 5 个分数）上做梯度检验：和数值斜率的最大差值"
  hints:
    - ["dp·p 必须保持为一列，每行一个数，这样广播才会把它和 dp 的每一行配上。", "`.sum(axis=-1)` 会去掉最后一个轴。哪个参数能把它保留成大小 1？"]
    - ["三步：先算那一个数 dp·p，再用 dp 减去它，再逐元素乘以 p。", "每一行的 dp·p 是沿最后一个轴的求和。", "把这个和保留成一列，从 dp 里减掉，再乘以 p。"]
    - ["一行能过，两行不行。每一行都必须用自己的 dp·p。", "只沿最后一个轴求和，并把这个轴保留成大小 1。"]
    - ["用 NumPy 写出公式 p ⊙ (dp − dp·p)：⊙ 就是 `*`。", "逐行的 dp·p 是一个逐元素乘积沿最后一个轴的求和。", "把这个和保留成一列，每行一个数，这样它就从它那一行的每个元素里减掉。第 1 节讲了做到这一点的参数。"]

