    - "dA 会在反向传播时传来，但公式还要乘以 p。这个数只在前向传播时存在。"

adam-bytes:
  prompt: "用混合精度和 Adam 训练时，每个参数要保存：bf16 的权重（2 字节）、bf16 的梯度（2 字节）、一份 fp32 的主副本（4 字节），还有 fp32 的 Adam 的 m 和 v（各 4 字节）。一个有 70 亿参数的模型，光这些就需要多少 GB？（1 GB = 10⁹ 字节）"
  promptShort: "用混合精度和 Adam 训练：前向和反向用 bf16，更新用 fp32。一个有 70 亿参数的模型，它的权重、梯度、主副本以及 Adam 的 m 和 v 需要多少 GB？（1 GB = 10⁹ 字节）"
  after: "每个参数 2 + 2 + 4 + 4 + 4 = 16 字节，16 × 7 × 10⁹ = 112 × 10⁹ 字节 = 112 GB，这还没保存任何激活值。其中权重本身只占 14 GB。"
  hints:
    - "14 GB 只是 bf16 的权重。训练还要保存梯度、主副本、m 和 v。"
    - "这只算了权重和梯度。再加上 fp32 的主副本和 Adam 的 m、v。"
    - "84 GB 只算了 fp32 的部分：主副本、m 和 v。还要加上 bf16 的权重和它的梯度。"
    - ["先算一个参数的字节数：把五部分加起来。", "一个参数需要 16 字节。乘以 7 × 10⁹，再除以 10⁹。"]

scores-mb:
  prompt: "一个注意力层为反向传播保存它的权重 A，形状是 (B, h, L, L)。B = 4 个序列，h = 8 个头，L = 1000 个 token，每个数 2 字节。这是多少 MB？（1 MB = 10⁶ 字节）"
  after: "4 × 8 × 1000 × 1000 = 32 × 10⁶ 个数，× 2 字节 = 64 × 10⁶ 字节 = 64 MB，这只是一层。24 层的话：光 A 就大约 1.5 GB。"
  hints:
    - "3200 万是数的个数。每个数占 2 字节。"
    - "0.064 是以 GB 为单位的大小。题目问的是 MB。"
    - "64000 是以 KB 为单位的大小（1 KB = 10³ 字节）。题目问的是 MB。"
    - ["把四个大小乘起来得到数的个数，再乘以 2 字节。", "4 × 8 = 32，1000 × 1000 = 10⁶。"]

block-saved:
  prompt: "一个 pre-norm 块为反向传播保存上表里的张量。以一个 (B, L, `d_model`) 张量为单位来数：宽度为 4 × `d_model` 的张量算 4 个单位。一共多少个单位？"
  promptShort: "一个 FFN 宽度为 4d 的 pre-norm 块，为反向传播保存：两个 LayerNorm 的输入、Q、K、V 乘积的输入，以及 Q、K 和 V。它还保存各个头的输出、FFN 的输入，以及 FFN 隐藏层在 ReLU 之前和之后的值。以一个 (B, L, d) 张量为单位，一共是多少？"
  after: "1 + 1 + 3 + 1 + 1 + 1 + 4 + 4 = 16 个单位。B = 4、L = 1000、`d_model` = 1000 时，一个单位是 8 MB，所以这个块保存 128 MB：是 A 的 64 MB 的两倍。每个 token 一行的这些张量加起来比 A 还大。真实的块还会多保存一些小东西。"
  hints:
    - "FFN 的两个隐藏层宽度是 `d_model` 的 4 倍，所以每个都算 4 个单位。"
    - "FFN 的隐藏层保存了两份：ReLU 之前一份，之后一份。每份都算 4。"
    - "Q、K 和 V 是三个张量，每个宽度都是 `d_model`。"
    - ["沿着表往下，把宽度加起来，以 `d_model` 为单位。", "有六行宽度是 `d_model`，但其中一行装了三个张量：Q、K 和 V。", "窄的几行是 1 + 1 + 3 + 1 + 1 + 1，两个隐藏层再加 4 + 4。"]

pred-double-len:
  prompt: "每一层训练都要保存形状为 (B, L, 宽度) 的激活值和形状为 (B, h, L, L) 的注意力权重。你把 L 从 1000 翻倍到 2000，B、h 和宽度不变。激活值翻倍。保存的注意力权重会怎样？"
  options: ["也翻倍", "变成 4 倍", "不变"]
  reveal: "L 在 (B, h, L, L) 里出现了两次，所以 2L 带来 2 × 2 = 4 倍的数：在上面的例子里，每层从 64 MB 变成 256 MB。块里那 16 个 token 张量只翻倍，从 128 MB 变成 256 MB。L = 2000 时两者相等，序列再长，A 就是更大的那个。"
  hints:
    - "数一数 L 在形状 (B, h, L, L) 里出现了几次。"
    - "每个查询对每个键都保存一个权重。token 多了，两者都多了。"

do-dot-o:
  prompt: "第 2 节的例子：输出是 O = [[1.5, 0.5], [1.5, 0.5]]，传到它们的梯度是 dO = [[1, 0], [0, 2]]。融合算子需要每一行的 dA·A，但不保存 A，所以它改用 dO·O。第 1 行的 dO·O 是多少？"
  after: "第 1 行：0 × 1.5 + 2 × 0.5 = 1。它和第 1 行的 dA·A（0 × 0.5 + 2 × 0.5 = 1）是同一个数，但它只需要 O 和 dO，而它们每个 token 只有一行。"
  hints:
    - "1.5 是第 0 行。dO 的第 1 行是 [0, 2]。"
    - ["把 dO 的第 1 行和 O 的第 1 行逐元素相乘，再加起来。", "dO 的第 1 行是 [0, 2]，O 的第 1 行是 [1.5, 0.5]。"]
