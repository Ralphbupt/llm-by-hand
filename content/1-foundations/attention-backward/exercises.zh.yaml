jac-diag:
  prompt: "softmax 给出 p = [0.5, 0.25, 0.25]。它的雅可比矩阵是 J = diag(p) − pᵀp，所以 J[i][i] = pᵢ(1 − pᵢ)。J[1][1] 是多少？"
  after: "J[1][1] = p₁(1 − p₁) = 0.25 × 0.75 = 0.1875。z₁ 增加一点点时，p₁ 增加的量是它的 0.1875 倍。"
  hints:
    - "0.25 是 p₁ 本身（或者 J[0][0] = 0.5 × 0.5）。把 p₁ = 0.25 代进 p₁(1 − p₁)。"
    - "0.0625 是 p₁ × p₁，也就是 pᵀp 减掉的那部分。对角线上是 p₁ − p₁ × p₁。"
    - "−0.0625 只是 −pᵀp 那部分。在对角线上，diag(p) 还要加上 p₁ = 0.25。"
    - ["在对角线上，J[i][i] = pᵢ(1 − pᵢ)。p₁ 是哪个数？", "p₁ = 0.25，所以 1 − p₁ = 0.75。"]

