    - "大小对了，符号反了。z₁ 变大时，p₁ 在总和里占得更多，所以 p₀ 变小。"
    - "diag(p) 在对角线外是 0。那里只剩 −pᵀp 那部分。"
    - ["在对角线外只剩 −pᵀp 那部分：−pᵢ × pⱼ。", "第 0 行对应 p₀ = 0.5，第 1 列对应 p₁。"]

