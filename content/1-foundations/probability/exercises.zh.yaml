p-mat:
  prompt: "分数是：垫子 2.0、沙发 1.0、屋顶 0.5、月亮 −1.0。四舍五入后，e^score 分别是 7.4、2.7、1.6 和 0.4，加起来是 12.1。“垫子”的概率是多少？（保留 2 位小数）"
  after: "7.4 / 12.1 ≈ 0.61。垫子的分数最高，所以它占的份额最大。采样 1000 次，大约会得到 600 次垫子。"
  hints:
    - "2.0 是分数，不是概率。用垫子的 e^score 除以四个词的总和。"
    - "7.4 是垫子的 e^score。现在把它除以总和，让四个概率加起来等于 1。"
    - ["这里的概率，是一个词的 e^score 除以四个词的总和。", "垫子的 e^score 是 7.4，总和是 12.1。除一下。"]

softmax-2-0:
  prompt: "分数 [2, 0]，e² ≈ 7.39，e⁰ = 1。第一个词的概率是多少？（保留 2 位小数）"
  after: "e² / (e² + e⁰) = 7.39 / 8.39 ≈ 0.88。第二个词得到 1 / 8.39 ≈ 0.12。"
  hints:
    - "这是 2 / (2 + 0)。要先对每个分数取 e 的幂。"
    - "两个分数不同，所以概率不可能相等。用 e² ≈ 7.39 和 e⁰ = 1。"
    - ["softmax：对每个分数取 e 的幂，再除以总和。", "e² ≈ 7.39，e⁰ = 1，所以总和是 8.39。"]

add-ten:
  prompt: "分数 [2, 0] 给出概率 0.88 和 0.12。给两个分数都加 10：[12, 10]。概率会怎样？"
  options: ["完全不变", "第一个词变得更可能", "更接近一半对一半"]
  hints:
    - "两个分数增加了同样的量。它们之间的差变了吗？"
    - "12 和 10 是更大的数，但 softmax 看到的只是 e^12 / (e^12 + e^10)。把 e^12 写成 e^2 × e^10。"
  reveal: "完全不变：大约还是 0.88 和 0.12。e^(s+10) = e^s × e^10，而除以总和时 e^10 被约掉了。softmax 只在乎分数之间的差。"

t-small:
  prompt: "分数是：垫子 2.0、沙发 1.0、屋顶 0.5、月亮 −1.0。T = 1 时，采样 1000 个词大约得到 600 个垫子。温度会把每个分数除以 T。温度是 0.1 时，采样 1000 个词会得到什么？"
  options: ["大约 600 个垫子，和 T = 1 时一样", "1000 个几乎全是垫子", "四个词被挑中的次数差不多"]
  hints:
    - "先把分数除以 0.1：[20, 10, 5, −10]。现在分数之间的差距大了 10 倍。"
    - "温度低于 1 会让差距变大，而不是变小。把分数除以 0.1，再比较差距。"
  reveal: "几乎全是垫子。除以 0.1 后，分数是 [20, 10, 5, −10]。分数差 10，意味着可能性相差 e^10 ≈ 22000 倍，所以垫子的概率是 0.99995。"

temp-2:
  prompt: "分数 [2, 0]，温度 T = 2，e¹ ≈ 2.72。第一个词的概率是多少？（保留 2 位小数）"
  after: "[2, 0] / 2 = [1, 0]。e / (e + 1) = 2.72 / 3.72 ≈ 0.73。比 T = 1 时的 0.88 低：温度越高，分布越平。"
  hints:
    - "这是 T = 1 时的答案。先把两个分数都除以 2。"
    - "这是乘以 2 得到的结果。温度是除。"
    - ["在 softmax 之前，温度把每个分数都除以 T。", "[2, 0] / 2 = [1, 0]。对它做 softmax：e¹ 和 e⁰。"]

probs-T:
  prompt: "写出应用温度的那一行。scores 传进来时是一个 Python 列表，而列表不能除以一个数，所以要先把它变成浮点数组。"
  template: |
    def probs(scores, T):
        z = ____
        e = np.exp(z - z.max())     # 减去最大值，这样 exp 永远不会上溢
        return e / e.sum()

    print(probs([2, 1, 0.5, -1], 1))
    print(probs([2, 0], 2))
  tests:
    - "T = 1 不改变分数"
    - "[2, 0] / 2 = [1, 0]"
    - "T 小，分布变尖"
  hints:
    - ["scores 是一个 Python 列表，而列表不能除以一个数。", "哪个 NumPy 函数能把列表变成数组？先用它（带上 dtype=float），再应用温度。"]
    - "T = 1 对了，T = 2 不对。你是除以 T，而不是乘以 T 吗？"
    - ["温度把每个分数都除以 T。", "scores 是一个 Python 列表，而列表不能除以一个数。哪个 NumPy 函数能把列表变成数组？"]
  after: "列表不能除以一个数，所以先用 np.array 把它变成浮点数。把每个分数除以 T，会改变分数之间的差距：T < 1 让差距变大，T > 1 让差距变小。T = 1 保持原样。"

ce-01:
  prompt: "模型给正确的词 p = 0.1。损失 −ln p 是多少？用 ln 10 ≈ 2.30。（保留 2 位小数）"
  after: "−ln 0.1 = ln 10 ≈ 2.30。在 p = 0.01 时是 4.61：可能性再小 10 倍，就再多 2.3。"
  hints:
    - "这是 −log₁₀ 0.1。要用自然对数 ln，也就是以 e 为底的那个。"
    - "这是 1 − p。损失是 −ln p。"
    - "检查符号：ln 0.1 是负数，损失是它的相反数。"
    - ["损失是正确词的概率的 −ln。", "0.1 = 1/10，而 −ln(1/x) = ln x。"]

ce-09:
  prompt: "模型给正确的词 p = 0.5。损失是多少？用 ln 2 ≈ 0.69。（保留 2 位小数）"
  after: "−ln 0.5 = ln 2 ≈ 0.69。比 p = 0.1 时的 2.30 小，但不是 0：只有 p = 1 时损失才是 0。"
  hints:
    - "这是 1 − p。损失是 −ln p，而 0.5 = 1/2。"
    - "检查符号：ln 0.5 是负数，损失是它的相反数。"
    - ["损失是 −ln p。", "0.5 = 1/2，而 −ln(1/x) = ln x。"]

ce-code:
  prompt: "返回交叉熵损失：对分数做 softmax，取出正确的那个，再取 −log。"
  template: |
    def loss(scores, correct):
        p = softmax(np.array(scores, dtype=float))
        return ____

    print(loss([2.0, 1.0, 0.1], 0))   # 正确答案：猫
    print(loss([2.0, 1.0, 0.1], 2))   # 正确答案：车
  tests:
    - "p(猫) = 0.659，−ln 0.659 = 0.417"
    - "p(车) = 0.099，所以损失很大"
  hints:
    - "correct 是正确词的下标。用 p[correct]。"
    - ["检查两件事：符号，以及你用的是哪个 log。", "np.log 就是 ln。损失是正确词概率的 ln 再取负。"]
    - ["损失是一个数的 −ln：正确词的概率。", "correct 是正确词在 p 里的下标。np.log 就是 ln。检查符号：损失是正数。"]
  after: "p[correct] 取出正确词的概率，−np.log 把它变成损失。概率最多是 1，所以它的 ln 最多是 0，前面的负号让损失变成正数。其他词只通过 softmax 起作用。"

grad-dog:
  prompt: "猫、狗、车的 p = [0.7, 0.2, 0.1]，正确的词是狗，所以 y = [0, 1, 0]。狗的 ∂L/∂s，也就是 p − y，是多少？"
  after: "0.2 − 1 = −0.8。负数的意思是：提高狗的分数可以降低损失。猫和车得到 +0.7 和 +0.1：降低它们的分数，猫降得最多，因为它占走的概率最多。"
  hints:
    - "这是狗的 p。还要减去 y，正确的词的 y 是 1。"
    - "检查符号：p − y = 0.2 − 1。"
    - ["每个词的梯度是它的 p 减去它的 y。", "对狗来说，p = 0.2，y = 1。"]

grad-step:
  prompt: "梯度下降让每个分数逆着它的梯度移动：s ← s − lr × (p − y)。猫、狗、车的 p − y = [0.7, −0.8, 0.1]，哪个分数会升高？"
  options: ["猫的：它的数最大", "狗的", "三个都下降一点"]
  reveal: "狗的。它的梯度是负的，所以减去它会让分数升高。猫和车的梯度是正的，所以它们的分数下降，猫降得最多。这一步之后，狗从另外两个那里拿走了概率。"
  hints:
    - "这一步是减去梯度。一个大的正梯度会让分数下降。"
    - "三个梯度里有一个是负的。减去一个负数会怎样？"

grad-code:
  prompt: "返回损失对分数的梯度：p 减去独热目标。"
  template: |
    def grad(scores, correct):
        p = softmax(np.array(scores, dtype=float))
        g = p.copy()
        g[correct] = ____
        return g

    print(grad([2.0, 1.0, 0.1], 1))
  tests:
    - "p = [0.659, 0.242, 0.099]；狗是正确的，所以它那一项变成 0.242 − 1"
    - "梯度加起来总是 0"
  hints:
    - ["只有正确的词会变：它的 y 是 1，其他词的 y 是 0。", "g 里已经是 p 了。对正确的词，你还要减去它的 y。那个 y 是多少？"]
    - ["只有正确的词会变：它的 y 是 1，其他词的 y 是 0。", "g 里已经是 p 了。对正确的词，你还要减去它的 y。那个 y 是多少？"]
  after: "梯度是 p − y，而 y 只在正确的词那里是 1。g 一开始是 p 的副本，所以只有那一项要改：g[correct] − 1。各项加起来总是 0，因为 p 加起来是 1，y 加起来也是 1。"

ppl-uniform:
  prompt: "一个模型总是把它的猜测平均分给 4 个词，每个 p = 0.25，而正确的词总在它们当中。它的困惑度是多少？"
  after: "每次的惊讶度都是 −ln 0.25 = 1.386，所以平均值是 1.386，而 e^1.386 = 4。就像在 4 个词里挑一个那样拿不准，因为它确实是在 4 个词里挑。"
  hints:
    - "0.25 是 p。困惑度是 e 的（平均惊讶度 −ln p）次方。"
    - "1.386 是平均惊讶度。把 log 抵消掉：e^1.386。"
    - ["困惑度 = e 的（平均惊讶度）次方。", "每个词的惊讶度都是 −ln 0.25 = ln 4 ≈ 1.386，所以平均值也是 1.386。"]

two-models:
  prompt: "十个词。模型 A 有九次给正确词 p = 0.9，有一次给 p = 0.001。模型 B 每次都给 p = 0.5。哪个的困惑度更低？"
  options: ["A：它几乎每次都以 0.9 猜对", "B：它从来不太确定，但也从来不错得离谱", "它们差不多"]
  hints:
    - "看那一次失手：p = 0.001 意味着惊讶度 −ln 0.001 ≈ 6.9。这一个词给 A 的平均值加了多少？"
    - "把惊讶度平均一下。A：九个 0.105 和一个 6.9。B：十个 0.69。"
  reveal: "B。A 的平均惊讶度是 (9 × 0.105 + 6.908) / 10 = 0.786，所以它的困惑度是 e^0.786 = 2.19。B 的是 ln 2 = 0.693，困惑度 2.00。一次很自信的失手（p = 0.001，惊讶度 6.9）给 A 的平均值加上的，比九次好的猜测减掉的还多。一个给正确词几乎为 0 的概率的模型，会得到非常大的损失，而这一个词就能拉动整个平均值。"

ppl-sentence:
  prompt: "对“那只猫坐在垫子上”，模型给正确的下一个词的 p 是 0.5、0.25、0.125、0.25、0.25。惊讶度 −ln p 加起来是 6.93，ln 4 ≈ 1.386。它的困惑度是多少？"
  after: "平均惊讶度 = 6.93 / 5 = 1.386 = ln 4，所以困惑度 = e^(ln 4) = 4。或者用 1/p：2 × 4 × 8 × 4 × 4 = 1024 = 4⁵，所以五次方根是 4。就像在 4 个词里挑一个那样拿不准。"
  hints:
    - "1.386 是平均惊讶度。用 e^x 把 ln 抵消掉。哪个数的 ln 等于 1.386？"
    - "这是 p 的平均值。应该平均的是惊讶度 −ln p，再对结果取 e^。"
    - ["困惑度 = e 的（平均惊讶度）次方。", "平均惊讶度是 6.93 / 5。和 ln 4 比一比。"]

ppl-code:
  prompt: "返回一列概率（模型给每个正确词的 p）的困惑度。"
  template: |
    def perplexity(p):
        p = np.array(p, dtype=float)
        return np.exp(____)

    print(perplexity([0.5, 0.25, 0.125, 0.25, 0.25]))
  tests:
    - "平均分给 4 个词 → 4"
    - "表格里的那句话 → 4"
    - "总是确定而且正确 → 1"
  hints:
    - ["exp 里面放的是平均惊讶度。每个惊讶度是 −ln p。", "np.log 一次作用于整个数组，np.mean 求平均。检查符号：惊讶度是正数。"]
    - ["exp 里面放的是平均惊讶度。", "惊讶度是概率的 ln 再取负。NumPy 有求 ln 和求平均的函数。"]
  after: "平均惊讶度是 −np.mean(np.log(p))，困惑度是 e 的这个次方。np.log 一次作用于所有的 p。如果每个 p 都是 1，惊讶度就是 0，困惑度就是 1。"

gauss-x:
  prompt: "一个带噪声的数是 x = mean + std × z，其中 z 来自标准正态分布。mean = 3，std = 2，z = −1.5。x 是多少？"
  after: "x = 3 + 2 × (−1.5) = 0。z = −1.5 的意思是“比均值低 1.5 个标准差”。"
  hints:
    - "这是 3 + (−1.5)。要先用 std 乘 z。"
    - "z 是负数：2 × (−1.5) = −3。"
    - ["先算 std 乘 z，再加上均值。", "std × z = 2 × (−1.5) = −3。现在加上均值。"]

noise-shape:
  prompt: "`rng.standard_normal((1000, 2))` * 2 + 3 的形状是什么？"
  after: "乘一个数、加一个数都不改变形状。你得到 1000 个点，每个点有一个 x 和一个 y，中心在 (3, 3)。"
  hints:
    - "再看一眼你传给 `standard_normal` 的那个元组。哪个数在前面？"
    - ["你传给 `standard_normal` 的是什么形状？* 2 和 + 3 会改变形状吗？", "* 2 和 + 3 一次只作用在一个数上。它们从不增加或去掉数。"]

softmax-twice:
  prompt: "分数 [2, 0]。softmax 给出 [0.88, 0.12]。如果你把这些概率当作分数传给 `F.cross_entropy`，它会再做一次 softmax。训练会怎样？"
  options: ["什么都不变：softmax 的 softmax 还是一样", "运行不报错，但学得很差：第二次 softmax 把概率又挤回接近平均", "PyTorch 报错，因为这些数不是原始分数"]
  reveal: "它能跑，但学得很差。[0.88, 0.12] 的 softmax 大约是 [0.68, 0.32]：0 到 1 之间的输入永远不可能相差很远，所以第二次 softmax 让一切都接近平均，损失没法接近 0，梯度也很小。要给 `F.cross_entropy` 原始分数。"
  hints:
    - "试一下：第二次 softmax 把 [0.88, 0.12] 当作分数。它们的差只有 0.76。"
    - "PyTorch 分不出分数和概率：它们都只是数。没有任何东西会检查这一点。"

ce-from-scores:
  prompt: "为一个批写出 `mean_loss`：对每一行分数，除以 T，做安全的 softmax（在 np.exp 之前减去最大值），再对这一行正确词的概率取 −ln。返回这些损失在各行上的均值。需要写好几行。"
  template: |
    def mean_loss(rows, correct, T=1.0):
        # rows：B 个分数列表，每个样本一个。
        # correct：B 个 id，每一行的正确词。
        ____

    print(mean_loss([[2.0, 1.0, 0.1]], [0]))                    # 一行：大约 0.417
    # 分数 1000 不会上溢
    print(mean_loss([[2.0, 1.0, 0.1], [1000.0, 0.0]], [0, 0]))
    print(mean_loss([[2.0, 0.0], [0.0, 2.0]], [0, 0], T=2.0))
  tests:
    - "一行：p(猫) = 0.659，所以损失是 −ln 0.659 = 0.417"
    - "两行，正确词不同：(0.417 + 1.417) / 2 = 0.917"
    - "分数 1000 一定不能上溢：(0.417 + 0) / 2"
    - "T = 2：两行变成 [1, 0] 和 [0, 1]，损失是 0.313 和 1.313"
  hints:
    - ["每个名字都必须先创建再使用。在循环里：先 z，再 e，再 p。", "每一行都需要自己的 z：np.array(scores, dtype=float) / T。"]
    - ["第一行缩进 4 个空格，和 ____ 一样。for 里面的行再多缩进 4 个空格。"]
    - "这是两个损失的和。一批的损失是均值：要除以行数。"
    - ["一行应该得到 0.417。检查安全的 softmax：先用平移后的分数算 e，再用 e 除以它的总和得到 p。", "一行的损失是它正确词概率的 −ln。"]
    - ["第一行对了，但两行就不对。每一行用的是它自己的正确词吗？结果是各行损失的均值吗？", "zip(rows, correct) 会同时遍历各行和它们的正确词。"]
    - ["分数 1000 让它出错了：np.exp(1000) 对浮点数来说太大了。", "在 np.exp 之前，减去每一行里最大的值。概率不会变。"]
    - "在 softmax 之前，把每一行分数除以 T。"
    - ["对每一行：分数 / T，安全的 softmax，取正确词的 −ln p。然后对各行求均值。", "把每一行的损失收集到一个列表里，然后返回这个列表的 np.mean。"]
  after: "减去这一行的最大值不会改变它的概率，因为同一个 e^max 在分子和分母里约掉了，而且它让 np.exp 不会上溢。每一行用它自己正确词的 −ln p，一批的损失是它们的均值，所以它不会随批大小变大。后面几关会对整个 (B, V) 数组一次算出同样的东西，不用循环。"
