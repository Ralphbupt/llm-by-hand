full-grad:
  prompt: "点 (1, 3)、(2, 3)、(3, 7)、(4, 7)；w = 0.5，b = 0，所以误差是 −2.5、−2、−5.5、−5。用全部四个点，dL/dw = 2·error·x 的平均是多少？"
  after: "2·(−2.5·1 − 2·2 − 5.5·3 − 5·4) / 4 = 2·(−43) / 4 = −21.5。是负的：增大 w 会降低损失。"
  hints:
    - "大小对了，符号反了。误差是负的，所以梯度也是负的。"
    - "别忘了 2·error·x 里的 2。"
    - "这是总和。除以 4 个点，得到平均值。"
    - ["对每个点算出 2 · error · x，再对这四个数取平均。", "四个 error · x 分别是 −2.5·1、−2·2、−5.5·3 和 −5·4。"]

one-grad:
  prompt: "直线 ŷ = w·x + b，w = 0.5，b = 0。用一个只有一个点 (3, 7) 的批。它的误差是 −5.5。这一批的 dL/dw = 2·error·x 是多少？"
  after: "2 · (−5.5) · 3 = −33。只有一个点的批，梯度就是这个点自己的梯度。"
  hints:
    - "这是用全部数据算的梯度。这一批只有点 (3, 7)。"
    - "别忘了 2。"
    - ["只有一个点时，平均值就是这个点的 2 · error · x。", "它的误差是 −5.5，x 是 3。"]

noisy-steps:
  prompt: "批大小 1，学习率 0.02，从 w = 0.5，b = 0 出发。每走一步之后，你都在全部四个点上测一次损失。它每一步都下降吗？"
  options: ["是：每一步都会降低四个点上的损失", "不是：很多步会让它上升，而且它始终停不在谷底", "不是：它每一步都上升，从不下降"]
  reveal: "总体上它在下降，但每一步只跟着一个点走。在 200 步里，全部数据上的损失大约有一半的步是上升的，而且它在谷底附近不停地来回摆动，停不下来。批大小为 4 时，它每一步都下降。"

epoch-steps:
  prompt: "一个训练集有 1,000 个样本，你用大小为 50 的小批量。一轮是多少步？"
  after: "1,000 / 50 = 20 步，走完之后每个样本都恰好被看过一次。10 轮就是 200 步。"
  hints:
    - "这是乘出来的。一轮把每个样本看一次，每次 50 个：应该除。"
    - "这是每个样本一步。每一步用一批 50 个样本。"
    - ["一轮把每个样本恰好看一次。", "每一步用 50 个样本。多少步能覆盖 1,000 个？"]

sgd-w2:
  prompt: "f(w1, w2) = 0.5·(w1² + 25·w2²)，从 (−4, 1) 出发，梯度是 (−4, 25)。用 lr = 0.03 走一步 SGD：新的 w2 是多少？"
  after: "w2 ← 1 − 0.03·25 = 1 − 0.75 = 0.25。而 w1 ← −4 − 0.03·(−4) = −3.88。"
  hints:
    - "0.75 是 w2 移动的距离。从起始值 1 里减去它。"
    - "w2 的梯度是 25·w2 = 25，不是 w2 = 1。"
    - ["新的 w2 = w2 − lr ·（w2 的梯度）。", "这里 w2 的梯度是 25，lr 是 0.03。"]

sgd-big-lr:
  prompt: "损失是 f(w1, w2) = 0.5·(w1² + 25·w2²)，梯度是 (w1, 25·w2)。从 (−4, 1) 出发。为了让 w1 走得快些，SGD 的 lr 从 0.03 换成 0.09。w2 会怎样？"
  options: ["更快到达谷底", "w2 在两侧来回跳，每次跳得更远，变得非常大", "它不动了"]
  hints:
    - "对 w2 算一步：w2 − 0.09 × 25 × w2。新的 w2 比 1 更接近 0 吗？"
    - "w2 的梯度是 25·w2，在 w2 = 1 处不是 0。算一步：w2 − 0.09 × 25 × w2。"
  reveal: "每一步做的是 w2 ← w2 − 0.09·25·w2 = −1.25·w2。符号翻转，大小每步变成 1.25 倍，所以 w2 变得非常大，尽管单看 w1 这个学习率完全没问题。任何大于 2/25 = 0.08 的 lr 都会这样。"

adam-move:
  prompt: "Adam 用 lr = 0.3，从 (−4, 1) 出发，梯度是 (−4, 25)。在第 1 步，m̂ = g，v̂ = g²，所以这一步是 0.3·g/√(g²)。w1 变化了多少？（给出移动的大小，不是新位置。）"
  after: "0.3 · 4/4 = 0.3。w2 也移动 0.3 · 25/25 = 0.3。不管梯度多大，Adam 让两个权重移动同样的距离。新的点：(−3.7, 0.7)。"
  hints:
    - "这是 lr·g，普通 SGD 的移动量。Adam 要除以 √v̂ = |g|。"
    - "这是 lr 为 0.03 时 SGD 的移动量。这里是 lr 为 0.3 的 Adam。"
    - "题目问的是多远，所以给出距离。（w1 确实是往上走的：−4 → −3.7。）"
    - "−3.7 是 w1 落到的位置。题目问的是移动的大小：从 −4 到 −3.7。"
    - ["这一步是 lr · g / √(g²)。g = −4 时，√(g²) 是多少？", "√((−4)²) = 4，所以 g/√(g²) 就是 g 的符号。"]

momentum-code:
  prompt: "写出动量的一步：先用新的梯度 g 更新速度 u，再把 w 移动 lr 乘以 u。两个都返回。"
  tests:
    - "从 u = 0 出发，第一步和 SGD 一样：(−3.88, 0.25)"
    - "u = 0.9·[2, −2] + [1, 1] = [2.8, −0.8]"
    - "w 移动 lr 乘以新的 u：1 − 0.1·2.8 = 0.72，1 + 0.1·0.8 = 1.08"
  hints:
    - "用函数里的名字：w、u、g、lr 和 beta。"
    - ["u = 0 时，这一步应该和 SGD 的一步一样。w 到底变了没有？", "两行：一行算出新的 u，下一行用它来改变 w。u = 0、beta = 0.9 时，新的 u 就是 g。"]
    - ["返回的 u 不对。旧速度保留 beta 这个比例，再加上梯度。", "检查你是加上 g 而不是减去它，以及 beta 乘的是旧的 u。"]
    - ["u 对了，w 不对。用新的 u 移动 w，不是旧的 u，也不是 g。", "先更新 u，下一行再更新 w。"]
    - ["把第 2 节的两个公式抄下来，一行一个。", "第一行用旧的 u 和 g 更新 u。第二行用新的 u 移动 w。"]
  after: "u 保留旧值的 beta 比例，再加上新的梯度，所以它记得过去的方向。然后 w 移动 lr × u，而不是 lr × g。u = 0 时，第一步和 SGD 一样。"

adam-code:
  prompt: "写出 Adam 的更新。mₕₐₜ 和 vₕₐₜ 已经算好了。"
  template: |
    def adam_step(w, g, m, v, t, lr=0.1, beta1=0.9, beta2=0.999, eps=1e-8):
        m = beta1 * m + (1 - beta1) * g
        v = beta2 * v + (1 - beta2) * g**2
        m_hat = m / (1 - beta1**t)
        v_hat = v / (1 - beta2**t)
        w = w - ____
        return w, m, v

    w, g = np.array([1.0, 1.0]), np.array([4.0, 0.01])
    w, m, v = adam_step(w, g, np.zeros(2), np.zeros(2), t=1)
    print("after one step:", w)
  tests:
    - "梯度 4 和 0.01 都让各自的权重移动 lr = 0.1"
    - "再来一次同样的梯度，第 2 步又移动 0.1"
    - "第 2 步时第一个梯度翻转成 −4：第一个权重只往回挪了一点点"
  hints:
    - "Python 里的幂写作 **，不是 ^。比如 x ** 2 是 x 的平方。"
    - ["第 1 步时每个权重应该移动大约 lr。Adam 拿哪两个量相除？", "第 1 步时，mₕₐₜ = g，vₕₐₜ = g²。所以相除应该得到 g 的符号，1 或 −1。"]
    - ["同样的梯度来两次能过，但第 2 步第一个梯度从 4 翻转成 −4 时，你的第一个权重往回挪了整整一个 lr。Adam 的一步应该记得第 1 步。", "用滑动平均 mₕₐₜ 和 vₕₐₜ，而不是这一步的梯度 g。"]
    - ["Adam 把 mₕₐₜ 除以梯度的大小，再乘以 lr。哪个名字装着梯度的平方？", "梯度的大小是 vₕₐₜ 的平方根。np.sqrt 可以作用在数组上。加上 eps，这样永远不会除以 0。"]
  after: "mₕₐₜ 是平均的方向，√vₕₐₜ 是梯度通常的大小。它们的比值大约是 ±1，所以不管梯度多大，每个权重都大约移动 lr。eps 只是防止除以 0。"

init-std:
  prompt: "一层有 100 个输入（扇入 n = 100）。按规则 s = 1/√n，它的权重应该取多大的标准差？"
  after: "1/√100 = 1/10 = 0.1。于是 100 个标准差各为 0.1 的项加起来，标准差是 √100 · 0.1 = 1。"
  hints:
    - "这是 1/n。规则用的是平方根：1/√n。"
    - "这是 √n。取它的倒数。"
    - ["s = 1/√n，n = 100。", "√100 = 10。"]

deep-std:
  prompt: "输入的标准差是 1。它们穿过 10 层，没有激活函数，宽度 100，权重标准差 0.2。每一层把标准差乘以 √100 · 0.2。10 层之后标准差是多少？"
  after: "每层 √100 · 0.2 = 2，2¹⁰ = 1024。权重大小取成合适值的两倍，数就大了一千倍。如果改用 0.01，它们会缩小到 0.1¹⁰ = 10⁻¹⁰。"
  hints:
    - "这是一层。一共有 10 层，倍数是相乘的。"
    - "这个倍数一层接一层地相乘：2 × 2 × … × 2，乘十次。"
    - "这是 4¹⁰，方差的增长。题目问的是标准差，它每层乘以 2。"
    - ["每一层都把标准差乘以同一个倍数 √n · s。", "每层 √100 · 0.2 = 2，一共 10 层。"]

tanh-small:
  prompt: "一个网络有 10 层，宽度 100，每层之后都接 tanh。权重的标准差是 0.01，输入的标准差是 1。没有 tanh 的话，每层会把标准差乘以 √100 · 0.01。10 层之后，输出……"
  options: ["和输入差不多大", "几乎正好是 0", "非常大"]
  hints:
    - "算出每层的倍数：√100 · 0.01 = 0.1。十个 0.1 相乘得多少？"
    - "每一层把标准差乘以 0.1，所以数会变小。tanh 从来不会让一个数的绝对值变大。"
  reveal: "几乎正好是 0，大约 10⁻¹⁰。每一层缩小为 √100 · 0.01 = 0.1 倍，而 tanh 在 0 附近几乎是一条直线，没法让数重新变大。往回传的梯度也以同样的方式缩小，所以前面几层几乎学不到东西。"

lr-warm:
  prompt: "一个调度：peak = 0.004，warmup = 100，total = 1000。第 25 步还在预热期，所以 lr = peak · t / warmup。第 25 步的 lr 是多少？"
  after: "0.004 × 25 / 100 = 0.001：预热走了四分之一，学习率就是峰值的四分之一。"
  hints:
    - "0.004 是峰值，要到第 100 步才达到。第 25 步只走了四分之一。"
    - "这是 0.004 × 25。还要除以 warmup = 100。"
    - ["预热期间，学习率沿直线从 0 升到峰值。", "第 25 步走完了预热的 25 / 100 = 0.25。用峰值乘以这个比例。"]

lr-decay:
  prompt: "一个调度：peak = 0.004，warmup = 100，total = 1000。第 550 步已过预热期，所以 lr = peak · (total − t) / (total − warmup)。第 550 步的 lr 是多少？"
  after: "0.004 × (1000 − 550) / (1000 − 100) = 0.004 × 450 / 900 = 0.002。第 550 步正好在衰减的中点，所以学习率是峰值的一半。"
  hints:
    - "这是预热的公式，0.004 × 550 / 100。第 550 步已经过了预热：用第二行。"
    - "你除以了 total = 1000。衰减持续 total − warmup = 900 步。"
    - ["预热之后，学习率沿直线下降，从第 100 步的峰值降到第 1000 步的 0。", "total − t = 450，total − warmup = 900。用峰值乘以 450 / 900。"]

lr-code:
  prompt: "为损失 (w − 3)² 写出训练循环的循环体，带动量和学习率调度：每一步都从 `lr_at` 拿到自己的学习率。要写好几行。"
  template: |
    def lr_at(step, peak, warmup, total):
        if step < warmup:
            return peak * step / warmup
        return peak * (total - step) / (total - warmup)

    def grad(w):
        return 2 * (w - 3)                  # 损失 (w − 3)² 的梯度

    def train(w, total, peak=0.1, warmup=10, beta=0.9):
        u = 0.0
        for t in range(total):
            ____
        return w

    print("after 2 steps:  ", train(0.0, 2, warmup=2))
    print("after 200 steps:", train(0.0, 200))
  tests:
    - "第 0 步的 lr 是 0，所以只有 u 变了（变成 −6）；第 1 步 lr 是 0.05，u = 0.9·(−6) − 6 = −11.4，所以 w = 0.57"
    - "另一个调度：peak 0.2，warmup 1，total 3，落在 3.3"
    - "200 步之后，w 停在了谷底 3"
  hints:
    - "循环体的每一行都缩进 8 个空格，和 ____ 所在的那一行一样。"
    - "用已有的名字：w、u、t、total、peak、warmup、beta，以及函数 grad 和 `lr_at`。先算出 g 和 lr 再用它们。"
    - "这是普通的 SGD：w 移动了 lr 乘以 g。用动量时，w 移动 lr 乘以速度 u，而 u 记得过去的梯度。"
    - "这是固定为 peak 的学习率。每一步的学习率要从 `lr_at`(t, peak, warmup, total) 拿。"
    - ["从 w = 0 走两步应该落在 0.57。第 0 步的学习率是 0，所以 w 不变，但 u 会变。", "先用新的梯度更新 u，再用新的 u 移动 w。"]
    - ["四行：梯度 g = grad(w)，从 `lr_at` 拿到这一步的学习率，新的速度 u，然后新的 w。", "动量的一步就是你在第 2 节写的那个：先 u = beta·u + g，再让 w 移动 lr 乘以 u。", "学习率每一步都在变，所以要在循环里用这一步的 t 调用 `lr_at`。"]
  after: "每一步把新的梯度混进速度，再让 w 移动“调度给出的学习率 × 速度”。预热期间学习率从 0 开始，所以最初几步 w 几乎不动，而 u 在增长。到最后学习率降到 0，w 停在谷底附近，而不是在它周围来回摆动。训练一个真实的模型就是这同一个循环，只是权重更多。"
