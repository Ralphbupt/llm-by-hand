two-layer:
  prompt: "x = [2, 1]，W1 = [[1, 2], [0, 1]]，W2 = [[1], [1]]。先算 h = x @ W1，再算 out = h @ W2。out 是多少？"
  after: "h = [2×1 + 1×0, 2×2 + 1×1] = [2, 5]。out = 2×1 + 5×1 = 7。"
  hints:
    - "3 是跳过 W1、直接算 x @ W2 得到的。先算 h = x @ W1。"
    - "你把 W1 的行和 x 相乘了，好像 x 是一列。这里 x 是左边的一行，所以 h[0] 用的是 W1 的第 0 列，也就是 [1, 0]。"
    - ["x 是一行，所以 h = x @ W1：h[j] = x[0]·W1[0][j] + x[1]·W1[1][j]（行乘列，和第 1 关一样）。", "h[0] = 2×1 + 1×0 = 2。现在用 W1 的第 1 列算 h[1]。", "有了 h = [2, 5]，out = h @ W2 = h[0]×1 + h[1]×1。"]

merged:
  prompt: "W1 = [[1, 2], [0, 1]]，W2 = [[1], [1]]。W1 @ W2 的形状是 (2, 1)。它上面那个元素是多少？"
  after: "W1 @ W2 = [[1×1 + 2×1], [0×1 + 1×1]] = [[3], [1]]。而 x @ [[3], [1]] = 2×3 + 1×1 = 7，和两层算出的答案一样。"
  hints:
    - "1 是第二个元素。第一个是 W1 的第 0 行 [1, 2] 乘以列 [1, 1]。"
    - ["上面那个元素是 W1 的第 0 行乘以列 W2。", "W1 的第 0 行是 [1, 2]，W2 是列 [1, 1]。对应相乘再相加。"]

no-activation:
  prompt: "动手之前先猜：如果取消勾选“开启激活函数（tanh）”再按“训练”，会发生什么？两层，6 个隐藏神经元，但没有 tanh。"
  options: ["它能学会 XOR，只是慢一些", "它对 4 个里的 3 个，和一个神经元一样", "它停止学习，对每个点都回答 0.5"]
  reveal: "它对四个点都回答 0.5。没有 tanh，整个网络算的东西和一个线性神经元一样。这和“4 个里对 3 个”并不矛盾：那是一条直线按答对个数算能做到的最好结果。训练并不数答对了几个，它降低的是交叉熵损失。在 XOR 上，损失最低的那条直线是什么都不选的那一条：处处 0.5，损失 ln 2 ≈ 0.693。一条答对 3 个的直线，在第四个点上一定错得很自信，而那样的代价更高。"

sig-d0:
  prompt: "σ(0) = 0.5。用 f′(x) = σ(x)·(1 − σ(x))，sigmoid 在 x = 0 处的斜率是多少？"
  after: "0.5 × (1 − 0.5) = 0.25。这是 sigmoid 最陡的地方：其他地方的斜率都更小。"
  hints:
    - "0.5 是 σ(0) 本身。斜率是 σ(0) × (1 − σ(0))。"
    - ["用斜率公式 σ·(1 − σ)，其中 σ = σ(0) = 0.5。", "1 − σ(0) = 1 − 0.5 = 0.5。现在把它乘以 σ(0)。"]

relu-dneg:
  prompt: "ReLU(x) = max(0, x)。它在 x = −2 处的斜率是多少？"
  after: "对每个负的 x，ReLU 都输出 0，是一条平线。平线的斜率是 0。"
  hints:
    - "1 是右边、x > 0 时的斜率。在 0 的左边，ReLU 有没有变化？"
    - "那是 x，不是斜率。x 在 −2 附近挪一点点，max(0, x) 变了多少？"
    - ["斜率就是 x 挪一点点时输出变了多少。看 0 左边的 ReLU。", "ReLU(−2.1) = 0，ReLU(−1.9) = 0。输出变了多少？"]

deep-sigmoid:
  prompt: "梯度反向穿过 10 层 sigmoid。每一层都把它乘上那一层的 σ′，而 σ′ 最大是 0.25。从梯度 1 开始，不算权重。到达第一层的最多是多少？"
  options: ["约 0.25", "约 0.06", "不到百万分之一"]
  hints:
    - "0.25 是一层在最好情况下的结果。梯度要穿过 10 层，每一层都会再乘一次。"
    - "0.0625 是 0.25 × 0.25，两层。继续乘下去：十个 0.25 相乘。"
  reveal: "不到百万分之一：0.25 自乘 10 次。前面几层几乎学不到东西。"

vanish-10:
  prompt: "五层 sigmoid，不算权重，最好的情况：梯度被乘了五次 0.25。0.25⁵ = 1 / N。N 是多少？"
  after: "0.25 = 1/4，所以 0.25⁵ = 1/4⁵ = 1/1024。五层让梯度缩小约一千倍；十层是 1024 × 1024 ≈ 一百万倍。而这还是最好的情况，每个输入都正好在 0。离开 0，斜率还会更小。"
  hints:
    - "那是 4 × 5。梯度是乘，不是加：4 × 4 × 4 × 4 × 4。"
    - "那是 4⁴。数一数因子：一共有五层。"
    - ["0.25 就是 1/4。乘五次 1/4，就是除以五次 4。", "N = 4 × 4 × 4 × 4 × 4。4 × 4 = 16，16 × 4 = 64，……"]

gelu-neg:
  prompt: "GELU(x) = x · Φ(x)，Φ(−1) = 0.1587。GELU(−1) 是多少？（保留四位小数。）"
  after: "−1 × 0.1587 = −0.1587。一个小小的负输出，而 ReLU 在这里正好给出 0。"
  hints:
    - "检查符号。x 是 −1，所以 x · Φ(x) 是负的。"
    - "0 是 ReLU 给出的。GELU 不是把它设成 0，而是把 x 乘上 Φ(x)。"
    - ["用 GELU(x) = x · Φ(x)，其中 x = −1。", "x 是 −1，Φ(−1) = 0.1587。把它们相乘，保留符号。"]

relu-grad:
  prompt: "对数组 x 的每个元素写出 ReLU 的斜率（x > 0 的地方是 1，否则是 0）。"
  tests:
    - "[−2, −0.5, 0, 0.5, 3] 的斜率"
    - "对矩阵也管用"
  hints:
    - "普通的 if 没法检验整个数组。直接对数组本身做比较，就像题目上面的例子那样。"
    - ["对 x = [−2, −0.5, 0, 0.5, 3]，答案应该是 [0, 0, 0, 1, 1]。正好在 0 处，斜率是 0。", "一次把每个元素都和 0 比较。这会得到 True/False。", "用题目上面展示的方法，把 True/False 变成数。"]
    - ["x > 0 的地方斜率是 1，其他地方是 0。哪个比较能对每个元素给出这个结果？", "比较会得到 True/False。上面的例子展示了怎样把它变成 1.0/0.0。"]
  after: "x > 0 一次比较每个元素，得到一个 True/False 数组。.astype(float) 把 True 变成 1.0，False 变成 0.0。正好在 0 处，比较结果是 False，所以那里的斜率是 0。"

sigmoid-grad:
  prompt: "对数组 x 的每个元素写出 sigmoid 的斜率：先算 σ(x)，再算 σ(x)·(1 − σ(x))。两行。"
  tests:
    - "在 x = 0 处，σ = 0.5，斜率是 0.5 × 0.5 = 0.25"
    - "[−2, 0, 3] 的斜率：在 0 处最大，离 0 越远越小"
    - "对矩阵也管用"
  hints:
    - "函数里的两行前面都要有同样的 4 个空格。"
    - "在第一行算出 σ(x) 并给它起个名字，然后在第二行用这个名字。"
    - "函数什么也没返回。在最后一行的斜率前面加上 return。"
    - ["在 x = 0 处，答案应该是 0.25。先检查 σ(0)：它是 0.5。", "斜率是不是 σ·(1 − σ)，其中 σ 由 x 算出，而不是 x·(1 − x)？"]
    - ["第一行：用 np.exp 算 σ(x)，和第 3 关的神经元一样。", "第二行：返回 σ 乘以 (1 − σ)。"]
  after: "先算一次 σ(x) 并存进一个名字里，然后复用它：斜率是 σ·(1 − σ)。一个常见的坑是 x·(1 − x)，它用的是 x 而不是 σ(x)。最大的斜率是 0.25，在 x = 0 处。"
