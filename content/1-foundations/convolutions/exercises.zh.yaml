conv-00:
  prompt: "图片是 5×5，第 2 列是 1，其余都是 0。卷积核是 [[−1, 0, 1], [−1, 0, 1], [−1, 0, 1]]。out[0][0]，也就是左上角那个 3×3 窗口的输出，是多少？"
  after: "窗口覆盖第 0–2 列。第 2 列放着三个 1，卷积核的右列是 +1：1×1 + 1×1 + 1×1 = 3。其余乘积都是 0。"
  hints:
    - "大小对了，符号反了。1 在窗口的右列，而卷积核的右列是 +1。"
    - "左上角的窗口覆盖第 0、1、2 列，所以它确实包含第 2 列的笔画。"
    - "这只数了一行。窗口有 3 行高，每一行都加 1×1。"
    - ["把 3×3 卷积核放在第 0–2 行、第 0–2 列上。", "每个像素乘上压在它上面的卷积核数字，再把 9 个乘积加起来。只有第 2 列有 1。"]

conv-shift:
  prompt: "图片是 5×5，第 1 列是 1，其余都是 0。卷积核是 [[−1, 0, 1], [−1, 0, 1], [−1, 0, 1]]，不填充，步幅 1。out[0][1] 是多少？"
  after: "out[0][1] 的窗口覆盖第 1–3 列。笔画在它的左列，那里卷积核是 −1：三次 1×(−1) = −3。"
  hints:
    - "out[0][1] 的窗口从第 1 列开始，所以笔画在它的左列。卷积核在那里是多少？"
    - "out[0][1] 读第 1、2、3 列。第 1 列放着笔画。"
    - ["输出的第 j 列读图片的第 j、j+1、j+2 列。", "找出 1 落在这个窗口的哪里，以及卷积核在那里是多少。"]

h-edge:
  prompt: "一张 5×5 的图片第 2 列是 1，其余都是 0。用水平边缘卷积核 [[−1, −1, −1], [0, 0, 0], [1, 1, 1]]，不填充，步幅 1，3×3 的输出是什么样？"
  options: ["和之前一样：每一行都是 3, 0, −3", "全是 0", "每一列从上往下都是 3, 0, −3"]
  hints:
    - "这个卷积核比较的是行，不是列。沿着一道竖笔画往下看，下面一行和上面一行有什么不同吗？"
    - "要出现一个数，下面一行必须和上面一行不同。沿着一道竖笔画，有哪里是这样吗？"
  reveal: "全是 0。这个卷积核拿下面一行和上面一行比较。沿着一道竖笔画往下，每一行看起来都一样，所以差总是 0。一个卷积核只回答它自己的问题。"

size-24:
  prompt: "一张 28×28 的图片，一个 5×5 卷积核，不填充，步幅 1。输出有多少个像素宽？"
  after: "(28 − 5 + 0) / 1 + 1 = 24。卷积核要占 5 个像素的地方，所以它能放在 24 个起始位置。"
  hints:
    - "别忘了 + 1：第一个位置也要算上。"
    - "26 是 3×3 卷积核的结果。这个是 5×5。"
    - ["用输出大小公式 ⌊(n − k + 2p) / s⌋ + 1。", "n = 28，k = 5，p = 0，s = 1。第一部分是 28 − 5 = 23。"]

size-32:
  prompt: "一张 32×32 的图片，一个 3×3 卷积核，填充 1，步幅 2。输出有多少个像素宽？"
  after: "⌊(32 − 3 + 2) / 2⌋ + 1 = ⌊15.5⌋ + 1 = 16。填充 1 让大小不变，步幅 2 让它减半。"
  hints:
    - "接近了。⌊31 / 2⌋ = 15，然后再加 1。"
    - "那是步幅 1 的结果。步幅 2 每一步移动两个像素。"
    - "先向下取整，再加 1：⌊15.5⌋ = 15。"
    - ["用输出大小公式，n = 32，k = 3，p = 1，s = 2。", "先算 32 − 3 + 2，再除以 2 并向下取整。然后加 1。"]

dense-weights:
  prompt: "一张 6×6 的图片和一个 3×3 卷积核给出 4×4 的输出。一个给出同样 4×4 输出的全连接层，把 36 个像素中的每一个都连到 16 个输出格中的每一个。它有多少个权重（不算偏置）？"
  after: "36 × 16 = 576 个权重，每一对（像素，输出格）一个。3×3 卷积核只用 9 个，就给出同样大小的输出。"
  hints:
    - "这是输入的个数。每个输入都连到每个输出格。"
    - "这是输出格的个数。每个输出格都连到每个像素。"
    - "你做的是加法。每个像素都连到每个输出格：这是一个乘积。"
    - "这是卷积核。全连接层给每一对（像素，输出格）都配一个自己的权重。"
    - ["有多少个像素，多少个输出格？每一对配一个权重。", "36 个像素，16 个输出格：把它们相乘。"]

cnn-vs-mlp:
  prompt: "两个网络在 60,000 个手写数字上训练同样的 1,500 步。卷积网络有 5,258 个权重，MLP 有 50,890 个。在 10,000 个从没见过的数字上，哪个得分更高？"
  options: ["MLP：权重多十倍", "卷积网络", "差不多"]
  reveal: "卷积网络：98.0% 对 MLP 的 96.2%，权重只有它的十分之一。在整张图片上共用一个卷积核，是对图片的一个好猜测，所以更少的权重就够了。demo.py 会打印这两个数。"

ch-params:
  prompt: "一个 3×3 卷积层读 8 个输入通道，生成 16 个输出通道。它要学多少个数，权重加偏置？"
  after: "3 · 3 · 8 · 16 = 1,152 个权重，加 16 个偏置 = 1,168。16 个卷积核每个都是 8×3×3 = 72 个权重。"
  hints:
    - "这些是权重。16 个卷积核每个还有一个偏置。"
    - "这是每个输出通道一个卷积核、但只有一个输入通道的情况。每个卷积核都读全部 8 个输入通道。"
    - "每个卷积核是 8×3×3，不是 3×3：每个输入通道都有一片 3×3。"
    - "这是一个卷积核。这一层有 16 个，每个都有一个偏置。"
    - ["先算权重：k · k · Cᵢₙ · Cₒᵤₜ。再给每个输出通道加一个偏置。", "权重是 3 · 3 · 8 · 16 = 1,152。偏置有多少个？"]

rf-2:
  prompt: "两个 3×3 层叠在一起，步幅 1，没有池化。第二层的一个输出像素取决于图片上一块正方形区域。这一块有多少个像素宽？"
  after: "第二层读第一层输出的一个 3×3 小块。这些输出的窗口互相重叠，合起来覆盖 5×5 个像素。每多一个 3×3 层，就多 2。"
  hints:
    - "窗口是重叠的。相邻的第一层输出，读的窗口只差一个像素。"
    - "3 × 3 是把大小相乘。窗口是重叠的，所以大小是相加的：每一层加 2。"
    - ["从 1 个像素开始，一层一层地让它变大。", "一个 3×3 层让这一块每边多 1 个像素。做两次。"]

pool-max:
  prompt: "对 [[1, 3, 0, 2], [4, 2, 1, 1], [0, 0, 5, 6], [1, 2, 7, 0]] 做 2×2 最大池化，得到 2×2 的结果。它右下角的数是多少？"
  after: "右下角的 2×2 小块是 [[5, 6], [7, 0]]，最大的数是 7。完整的结果是 [[4, 2], [2, 7]]。"
  hints:
    - "看小块里的全部四个数，包括下面一行：7 和 0。"
    - "这是总和。最大池化留下最大的数。"
    - ["把 4×4 的网格分成四个 2×2 小块。", "右下角的小块是第 2–3 行、第 2–3 列。留下其中最大的数。"]

rf-pool:
  prompt: "一层一层地跟踪这一块的宽度和间距。一个 k×k 卷积让宽度增加 (k − 1) × 间距。一个 2×2 池化让宽度增加 1 × 间距，然后间距翻倍。经过一个 3×3 卷积和一个 2×2 池化后，宽度是 4，间距是 2。再加第二个 3×3 卷积，然后第二个 2×2 池化。最后的一个输出能看到多少个像素宽的一块？"
  after: "3×3 卷积：4 + 2 × 2 = 8（间距仍是 2）。2×2 池化：8 + 1 × 2 = 10，间距变成 4。"
  hints:
    - "这是间距为 1 时的卷积，而且没有第二个池化。现在间距是 2，不是 1，池化还要再加 1 × 间距。"
    - "这是第二个卷积之后的结果。第二个池化还要再加 1 × 间距。"
    - "池化加的是 1 × 间距，而那时间距是 2。"
    - "池化之后间距是 2。下一个卷积和下一个池化都要用它。"
    - ["从宽度 4、间距 2 开始。先用卷积的规则，再用池化的规则。", "卷积加 (3 − 1) × 2 = 4，所以宽度变成 8。间距仍是 2。"]

conv-loop:
  prompt: "写一行：(i, j) 处的输出，是从 (i, j) 开始的 3×3 窗口乘以卷积核，再求和。"
  after: "x[i:i+3, j:j+3] 和 k 形状相同，所以 * 把每个像素和压在它上面的卷积核数字配成一对。.sum() 把 9 个乘积加成一个数。输出比图片小 2，因为 3×3 窗口只能放在 n − 2 个位置上。"
  tests:
    - "竖笔画在每一行给出 3, 0, −3"
    - "对角线卷积核把每个窗口对角线上的三个像素加起来"
  hints:
    - "窗口必须正好是 3×3，和 k 形状相同。检查两个切片：行和列。"
    - "用 *（逐个数相乘），不要用 @。卷积是把对应的格相乘，再加起来。"
    - ["你的窗口是 3×3 吗？在 i = 0、j = 0 时把它打印出来。", "用一对方括号加一个逗号来切窗口，就像第 7 节开头那样。然后和 k 逐格相乘，再把所有数加起来。"]
    - ["三步：在 (i, j) 处切出 3×3 窗口，和 k 逐格相乘，把 9 个乘积加起来。", "窗口从第 i 行、第 j 列开始，两个方向都是 3 宽。用一对方括号加一个逗号。", "i = 0、j = 0 时，窗口是第 0–2 行、第 0–2 列。对这张笔画图片，它的乘积加起来是 3。"]

conv-stride:
  prompt: "写一个适用于任意正方形卷积核、任意步幅、不填充的卷积。算出输出边长 m，建好 out，再填满每个 out[i, j]。把 ____ 换成你需要的任意多行。"
  template: |
    def conv2d(x, k, s):
        n, f = x.shape[0], k.shape[0]   # 图片边长 n，卷积核边长 f
        ____
        return out

    img = np.arange(25.0).reshape(5, 5)
    print(conv2d(img, np.ones((3, 3)), 2))
  after: "步幅只改变每个窗口从哪里开始：输出格 i 从第 i·s 行开始，而不是第 i 行。窗口仍是 f 宽。输出边长来自公式 ⌊(n − f) / s⌋ + 1，所以最后一个窗口在图片里面结束。"
  tests:
    - "步幅 1 就是你上面写的那个卷积"
    - "5×5 图片，全是 1 的 3×3 卷积核，步幅 2：窗口从第 0、2 行和第 0、2 列开始"
    - "一个只保留每个窗口左上角像素的 2×2 卷积核，步幅 2"
    - "7×7，3×3，步幅 2：(7 − 3) // 2 + 1 = 3"
  hints:
    - "每个名字都要先赋值再使用：先 m，再 out，然后是填充它的循环。"
    - "输出边长必须是整数。用 //（除法并向下取整），不要用 /。"
    - ["窗口必须是 f×f。检查两个切片。", "从第 i*s 行开始的窗口，在第 i*s+f 行之前结束。"]
    - "输出太大了。用第 2 节的输出边长公式检查一下，取 p = 0。"
    - ["s = 1 时，你的代码应该和 conv-loop 给出同样的结果。在 i = 0、j = 0 时把窗口打印出来。", "窗口大小用 f，不要用 3。"]
    - ["步幅 2 时，输出格 (0, 1) 从第 2 列开始，不是第 1 列。", "在窗口开始的地方，把 i 和 j 乘上 s。", "也检查一下输出边长 m：n = 5、f = 3、s = 2 时，先相减，再除以 s 并向下取整，然后加 1。"]
    - ["三部分：输出边长 m，一个形状为 (m, m) 的全 0 数组 out，然后两层循环填满 out[i, j]。", "m 是 p = 0 时的输出大小公式，用 // 向下取整。(i, j) 的窗口从第 i*s 行、第 j*s 列开始。", "n = 5、f = 3、s = 2 时：m = 2，out[0, 1] 读第 0–2 行和第 2–4 列。"]
