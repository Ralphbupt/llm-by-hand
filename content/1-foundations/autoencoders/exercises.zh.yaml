    x, x_hat = np.array([1., 0]), np.array([0.5, 0.5])
    print(vae_loss(x, x_hat, np.zeros(2), np.ones(2)))
  tests:
    - "两个像素都猜成 0.5：ln 2 + ln 2 ≈ 1.3863；μ = 0、σ = 1 不增加 KL"
    - "好的重建（2 × −ln 0.9 ≈ 0.2107），加上 μ = 2 的那个编码数的 KL 2"
    - "4 个像素：重建误差是求和，4 × 0.1054，不是取平均"
