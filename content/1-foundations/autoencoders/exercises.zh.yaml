compress:
  prompt: "一张 28×28 的图片有 784 个数。编码有 2 个数。编码的数少了多少倍？"
  after: "784 ÷ 2 = 392。解码器只能从 2 个数重建出 784 个数。"
  hints:
    - "这是少了多少个数。题目问的是少了多少倍：要做除法。"
    - "这是乘法。少了多少倍，是用 784 除以 2。"
    - ["输入有多少个数，编码里有多少个？", "“少了多少倍”是除法：大的数除以小的数。"]

code-shape:
  prompt: "一批 32 张图片的形状是 (32, 784)。编码器把每张图片变成一个 2 个数的编码。这批编码是什么形状？"
  after: "(32, 2)：每张图片一行，每行 2 个数。解码器再把它变回 (32, 784)。"
  hints:
    - "数对了，顺序反了。每张图片仍然占自己的一行。"
    - "这是输入。编码器把每一行缩小到编码的大小。"
    - ["有多少行（图片），每个编码有多少个数？"]

recon:
  prompt: "一张 4 像素的图片 x = [1, 0, 1, 1] 被重建成 x̂ = [0.5, 0, 1, 0.5]。均方误差是多少？"
  after: "差是 0.5、0、0、0.5 → 平方是 0.25、0、0、0.25 → 和是 0.5 → 平均是 0.5 ÷ 4 = 0.125。"
  hints:
    - "这是平方的和。求平均要再除以 4 个像素。"
    - "数一数：一共 4 个像素，其中两个差 0.5。"
    - ["先逐个像素相减：x − x̂。", "差是 0.5、0、0、0.5。接下来把每个差平方。"]

recon-code:
  prompt: "写出图片 x 和它的重建 xₕₐₜ 之间的均方误差（两者都是形状相同的 NumPy 数组）。"
  template: |
    def rebuild_loss(x, x_hat):
        return ____

    x = np.array([1., 0, 1, 1])
    x_hat = np.array([0.5, 0, 1, 0.5])
    print(rebuild_loss(x, x_hat))
  tests:
    - "页面上的例子得到 0.125"
    - "完美重建的损失是 0"
    - "[0, 0] 对 [2, 0]：平方是 4 和 0，平均是 2"
  after: "x − xₕₐₜ 对整个数组逐个像素地运算，所以同一行代码能处理任何形状。先平方再求平均：平方让每个差都算作正的，这样正负相反的误差不会互相抵消。"
  hints:
    - "Python 里的乘方写成 **，不是 ^。例如 x ** 2 是 x 的平方。"
    - ["每个差在求平均之前都平方了吗？", "先平方，再求平均。Python 里平方写成 ** 2。"]
    - ["三步：相减，平方，求平均。", "一次把整个差的数组平方，再取它的平均。页面上的例子里，平方加起来是 0.5。"]

holes:
  prompt: "看之前先猜：你用和真实数字编码相同的均值和标准差，随机抽 1,000 个编码。有多少个会落在离所有真实数字编码都很远的地方？"
  options: ["一个都没有：真实编码铺满了整张图", "大约十分之一", "几乎全部"]
  reveal: "大约十分之一：demo.py 用 4,000 个真实编码比较，得到 11%。下面的实验台只保留了 400 个，所以在那里你会看到大约三分之一。编码按数字聚成簇，中间留下空隙，因为损失只要求重建得像，并不要求铺满整张图。"

reparam:
  prompt: "VAE 的编码器对某一个编码数给出 μ = 1 和 σ = 0.5。随机抽到的是 ε = −2。编码 z = μ + σ·ε 是多少？"
  after: "z = 1 + 0.5 × (−2) = 1 − 1 = 0。再抽一个 ε，会得到另一个在 1 附近的 z。"
  hints:
    - "检查符号：ε = −2，所以 σ·ε 是负的。"
    - "这只是 σ·ε。再加上 μ。"
    - "先用 σ 乘 ε：0.5 × (−2) = −1，再加上 μ = 1。"
    - ["先算 σ·ε，再加上 μ。", "σ·ε = 0.5 × (−2) = −1。"]

kl-two:
  prompt: "用 KL = ½(μ² + σ² − 1 − ln σ²)。对一个编码数，μ = 2，σ = 1（所以 ln σ² = ln 1 = 0）。KL 项是多少？"
  after: "½(4 + 1 − 1 − 0) = ½ × 4 = 2。中心在 2 而不是 0 的编码要付出 2 的代价；μ = 0、σ = 1 的编码没有任何代价。"
  hints:
    - "别忘了前面的 ½。"
    - "检查括号里的 − 1：4 + 1 − 1 − 0。"
    - ["μ² = 4，σ² = 1。用这两个数。", "括号里是 4 + 1 − 1 − 0 = 4。"]

vae-holes:
  prompt: "在 demo.py 里，普通自编码器的随机编码有 11% 落在离所有真实编码都很远的地方（在实验台里大约三分之一，因为它保留的编码更少）。VAE 从 N(0, 1) 抽随机编码。它们有多大比例落在离所有真实编码都很远的地方？"
  options: ["更多：KL 项把所有编码混在了一起", "差不多，11%", "少得多"]
  hints:
    - "KL 项把每张图的编码都拉向 N(0, 1)。随机编码是从哪里来的？"
    - "VAE 的训练让真实编码正好覆盖随机编码所来自的区域。"
  reveal: "少得多：demo.py 里是 1%，对比 11%（在实验台里，大约七分之一对比大约三分之一）。真实编码挤在 0 附近，标准差大约是 1，正好是 N(0, 1) 抽样的地方。"

kl-wins:
  prompt: "有人把 VAE 的损失写成：重建误差对 784 个像素取平均（而不是求和），再加上 KL 项。训练时会发生什么？"
  options: ["没什么要紧的：只是缩放了一下", "KL 项占上风：编码不再携带图片的信息，每个编码都解码成几乎同一个模糊的数字", "重建占上风：编码空间里的空隙又回来了"]
  hints:
    - "两部分里只有一部分被除以了 784。这对两者的平衡有什么影响？"
    - "取平均让重建误差小了 784 倍。现在哪一部分是大的那个？"
  reveal: "KL 项占上风。取平均把重建误差除以了 784，于是降低损失最省事的办法，就是不管是什么图，都让每个编码正好等于 N(0, 1)。解码器因此得不到任何信息，只能画一个平均的数字。这就是 demo.py 对像素求和重建误差的原因。"

sample-code:
  prompt: "写出 VAE 的采样步骤：给定数组 mu、sigma 和一个标准正态分布的抽样 eps（形状都一样），返回编码。"
  template: |
    def sample(mu, sigma, eps):
        return ____

    print(sample(np.array([1., 0]), np.array([0.5, 1]), np.array([-2., 0.3])))
  after: "所有的随机性都在 eps 里，sigma 只是把它缩放，所以 σ = 0 时编码正好是 μ。这样写，编码对 μ 和 σ 就有了斜率，反向传播就能训练编码器。"
  tests:
    - "σ = 0 时编码正好是 μ"
    - "μ = 1，σ = 0.5，ε = −2 得到 0"
    - "必须在数组上逐个数地运算"
  hints:
    - "σ = 0 时随机性应该消失，编码应该正好是 μ，这里是 [3, −1]。应该用哪个数组去乘 ε？"
    - ["用 VAE 的采样公式：编码是均值，再随机挪动一段。", "哪个数组决定编码的中心，哪个数组缩放 eps？", "μ = 1，σ = 0.5，ε = −2 时，编码是 0。"]

