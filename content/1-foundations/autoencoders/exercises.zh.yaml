  hints:
    - "Python 里的乘方写成 **，不是 ^。例如 x ** 2 是 x 的平方。"
    - "模板返回的两个名字 rebuild 和 kl，都要在函数里赋值。"
    - ["重建部分对了，KL 部分不对。对照第 4 节的 KL 公式检查一下。", "KL = ½(μ² + σ² − 1 − ln σ²)，对各个编码数求和。"]
    - ["先写重建部分：对每个像素，−(x ln x̂ + (1 − x) ln(1 − x̂))。", "x = [1, 0]、x̂ = [0.5, 0.5] 时，每个像素的代价是 ln 2 ≈ 0.693，所以和是 1.386。如果你得到 0.693，说明你取了平均：VAE 的损失是对像素求和。"]
    - ["两行：先 rebuild，再 kl。每一行都是这一页上的一个公式，再求和。", "rebuild：每个像素的二元交叉熵，求和。kl：第 4 节的公式，求和。"]
