handover:
  prompt: "H = 32 的 LSTM 编码器读入一个 24 位的数字串。解码器只拿到编码器最后的 h 和 c。这一共是多少个数？"
  after: "h 有 32 个，c 有 32 个：64 个数，不管输入是 4 位还是 24 位。"
  hints:
    - "LSTM 交给解码器的是两个向量，不是一个。想想支线 N4 里的细胞状态。"
    - "这是所有的编码器状态（24 × 32）。普通的解码器只拿到最后一个。"
    - "这把 24 步的 h 和 c 都算上了。解码器只拿到最后那一对。"
    - ["解码器拿到的是编码器的最终状态，不是每个数字一个。", "LSTM 的状态是 h 和 c，各有 H 个数。"]

grow:
  prompt: "看之前先猜。H = 32 时，普通的编码器–解码器能把 4 位的数字串完美地倒过来。对新的 20 位数字串，它大约能完全答对百分之几？"
  options: ["大约 100%", "大约 50%", "大约 0%"]
  reveal: "大约 0%。4 位时答对 100%，12 位时 47%，16 位时 4%，20 位时一个都不对。六十四个数装不下按顺序排好的二十个数字。"

score-0:
  prompt: "E = [[1, 0], [0, 1], [0, −1]]（各行是 h₀、h₁、h₂），解码器状态 s = [2, 0]。h₀ 的分数，也就是 h₀ · s，是多少？"
  after: "1 × 2 + 0 × 0 = 2。h₁ · s = 0 × 2 + 1 × 0 = 0，h₂ · s 也是 0。三个一起算：E @ s = [2, 0, 0]。"
  hints:
    - "这是 h₁ 或 h₂ 的分数。h₀ = [1, 0]。"
    - ["把 h₀ 和 s 逐个数相乘，再相加。", "h₀ = [1, 0]，s = [2, 0]。第一个数相乘，第二个数相乘，再相加。"]

weight-0:
  prompt: "分数是 [2, 0, 0]。用 e² ≈ 7.39 和 e⁰ = 1。做完 softmax 后，h₀ 的权重是多少？（保留 2 位小数）"
  after: "e² + e⁰ + e⁰ = 7.39 + 1 + 1 = 9.39，7.39 / 9.39 ≈ 0.79。另外两个各得到 1 / 9.39 ≈ 0.11。"
  hints:
    - "这是还没除的 e²。softmax 要除以三个的总和。"
    - "这相当于 2 / (2 + 0 + 0)：softmax 用的是 e 的分数次幂，不是分数本身。"
    - "这把权重平均分给了三个状态。分数高的拿得多：总和里它占 7.39。"
    - ["softmax：对每个分数取 e 的幂，再分别除以总和。", "总和是 7.39 + 1 + 1。h₀ 那一份是其中的 7.39。"]

ctx-second:
  prompt: "权重是 [0.79, 0.11, 0.11]，E = [[1, 0], [0, 1], [0, −1]]。context = weights @ E 的第二个数是多少？"
  options: ["0.11", "0", "−0.11", "0.79"]
  hints:
    - "这只是 h₁ 那一份。h₂ = [0, −1] 也会给第二个数加上它的一份。"
    - "这只是 h₂ 那一份。把 h₁ 那一份也加上。"
    - "0.79 是第一个数。各个状态的第二个数分别是 0、1 和 −1。"
  reveal: "0.79 × 0 + 0.11 × 1 + 0.11 × (−1) = 0。两个小权重的状态往相反方向拉，正好抵消。第一个数是 0.79 × 1 = 0.79，所以上下文是 [0.79, 0]，主要是 h₀。"

ctx-shape:
  prompt: "E 存着 8 个编码器状态，每个 32 个数：E 是 (8, 32)。解码器状态 s 是 (32,)。context = weights @ E 是什么形状？（写一个数，比如 (5)。）"
  after: "weights 是 (8,)，每个输入 token 一个。(8,) @ (8, 32) → (32,)：一个和状态一样大的向量，由全部八个状态合成。"
  hints:
    - "这是分数和权重的形状。上下文是状态的平均。"
    - "这是 E 本身。加权平均把 8 行合成一行。"
    - ["weights 每个输入 token 一个数：(8,)。", "(8,) @ (8, 32)：两个 8 碰在一起并消失，和第 1 关一样。"]

ctx-line:
  prompt: "补完注意力的一步：上下文是编码器状态的加权平均。"
  template: |
    def attend(E, s):
        scores = E @ s              # 每个编码器状态一个分数
        w = softmax(scores)         # 加起来等于 1 的权重
        ctx = ____
        return w, ctx

    w, ctx = attend(np.array([[1., 0], [0, 1], [0, -1]]), np.array([2., 0]))
    print("weights", w.round(4), " context", ctx.round(4))
  tests:
    - "页面上的例子：上下文 ≈ [0.79, 0]。"
    - "另一组三个状态。"
  hints:
    - ["形状对不上。w 是 (3,)，E 是 (3, 2)；哪种顺序能让两个 3 碰在一起？", "乘积里，左边的最后一个大小要和右边的第一个大小碰在一起。哪种顺序能让 3 碰上 3？"]
    - ["页面上的例子你算出的向量不对。上下文应该大约是 [0.79, 0]。", "把 E 的每一行乘以它的权重，再把各行加起来。写成矩阵乘积时，权重在前。"]
    - ["上下文是 E 各行的加权平均。", "每个权重说明 E 的某一行取多少。w 和 E 的哪种乘积能把加权后的各行加起来？"]
  after: "w 是 (3,)，E 是 (3, 2)，所以 w @ E 是 (2,)：E 的每一行乘以自己的权重，再把各行相加。加权平均就是一次矩阵乘积，权重在前。"

fix:
  prompt: "同样的倒转任务，同样 H = 32 的 LSTM，现在加上注意力。在 20 位上普通模型答对 0%。注意力模型能比 0% 好吗？"
  promptShort: "一个 H = 32 的 LSTM 学习把数字串倒过来。没有注意力时，20 位的数字串它答对 0%。加上注意力后，它能比 0% 好吗？"
  options: ["不能，和之前一样大约 0%", "能，明显比 0% 好"]
  hints:
    - "有了注意力，解码器还只依赖那 64 个数的总结吗？"
  reveal: "好得多：20 位时答对 72%，而不是 0%。解码器能读取每一个编码器状态，而不只是最后一个。它不完美，因为每个编码器状态仍然是 LSTM 一步一步读出来的。状态有 128 个数时，即使到 24 位，它也能保持 85%。"

seven-look:
  prompt: "模型读入 427015，写出 “four hundred twenty seven thousand fifteen”。它写 “seven” 时，哪个数字应该得到最大的权重？"
  options: ["4", "2", "7", "5"]
  hints:
    - "4 给出 “four hundred”。哪个数字说的是 “seven”？"
    - "2 给出 “twenty”。“seven” 来自下一个数字。"
    - "5 属于 “fifteen”，在第二组三位数里。"
  reveal: "7，权重 0.99。写 “four” 时它看 4，写 “twenty” 时看 2，写 “fifteen” 时看 5。"

attend-all:
  prompt: "Boss 第 1 部分。一次算出解码器每一步的注意力：每个解码器状态一行权重，每行是对编码器状态做的 softmax；每个解码器状态一行上下文。softmax 要你自己写。把 ____ 换成你需要的若干行。"
  template: |
    softmax = None   # Boss 里没有现成的 softmax：自己写

    def attend_all(S, E):
        # S：(T, H)，每行一个解码器状态。E：(L, H)，每行一个编码器状态。
        # 返回 W (T, L)：第 t 行是解码器状态 t 的分数做 softmax 的结果，
        # 以及 C (T, H) = W @ E
        ____
        return W, C

    E = np.array([[1., 0], [0, 1], [0, -1]])
    S = np.array([[2., 0], [0, 2]])
    W, C = attend_all(S, E)
    print("W =", W.round(4))
    print("C =", C.round(4))
  tests:
    - "第 0 行是页面上的例子（分数 [2, 0, 0]）；第 1 行的分数是 [0, 2, −2]"
    - "每个解码器状态一行上下文"
    - "分数很大（1,000 和 0）也不能上溢：在 exp 之前先减去每一行最大的分数"
    - "5 个编码器状态，4 个解码器状态，每个 3 个数（随机种子 0）"
  hints:
    - "这里没有调用 softmax。自己写：对每个分数取 exp，再除以这一行的和。"
    - "你返回的每个名字（W 和 C）都要在函数里赋值。"
    - ["检查形状：S 是 (T, H)，E 是 (L, H)。哪一个需要转置，才能让两个 H 碰在一起？", "S @ E.T：(T, H) @ (H, L) 得到 (T, L)，每个解码器状态一行分数。"]
    - ["小的例子通过了，但分数很大时得到 nan。e¹⁰⁰⁰ 对浮点数来说太大了。", "在 exp 之前先减去每一行最大的分数：scores.max(axis=-1, keepdims=True)。"]
    - ["先检查第 0 行：它的分数是 [2, 0, 0]，所以权重应该大约是 [0.79, 0.11, 0.11]。", "每一行都必须各自加起来等于 1：沿 axis=-1 求和再除，并且用 keepdims=True。"]
    - ["权重对了，上下文不对。每一行上下文都是 E 各行的加权平均。", "一次矩阵乘积就能得到所有行，权重在前。"]
    - ["四步：分数，（稳定的）exp，除以每一行的和，上下文。", "第 6 节演示了带 keepdims 的按行求最大值和求和。"]
  after: "S @ E.T 给每个解码器状态一行分数，(T, L)。softmax 对每一行分别做（axis=-1，keepdims=True），先减去这一行最大的分数可以防止 exp 上溢。然后 W @ E 一次算出所有上下文行，(T, H)。"

boss-line:
  prompt: "Boss 第 2 部分。把 boss.py 为你自己的 `attend_all()` 打印的 PASS 那一行粘贴到引号之间。"
  template: |
    line = "____"      # 它看起来像这样：N5 PASS 0.900 1a2b3c4d
    print(line)
  tests:
    - "boss.py 打印的 PASS 行：N5 PASS、分数、代码"
    - "代码和分数对得上：这一行没有被改过"
    - "分数至少是 0.9（90%）"
  hints:
    - "粘贴整行，四个部分都要有：N5、PASS、分数和代码。"
    - ["从 /files/seq2seq-attention/boss.py 下载 boss.py，补全 `attend_all()`，然后在同一个文件夹里运行 python boss.py。", "复制以 N5 PASS 开头的整行，粘贴到引号之间。"]
    - "代码和分数对不上。照 boss.py 打印的样子重新复制这一行，不要改动。"
    - "把 boss.py 打印的整行粘贴到引号之间。"
  after: "用上你写的注意力，模型能把 20 位的数字串倒过来，这是同样大小的普通编码器–解码器做不到的。行末的代码只能说明这一行是原样粘贴的；这一部分靠你的诚实。"
