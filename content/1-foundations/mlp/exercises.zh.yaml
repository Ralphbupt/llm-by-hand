fwd-hidden:
  prompt: "x = [2, 1]，W1 = [[1, −1], [0, 1]]，b1 = [0, 0]，激活函数是 ReLU。隐藏层是 h = ReLU(x @ W1 + b1)。第二个隐藏值 h[1] 是多少？"
  after: "x @ W1 = [2×1 + 1×0, 2×(−1) + 1×1] = [2, −1]。ReLU 把负的 −1 变成 0：h = [2, 0]。"
  hints:
    - "−1 是 ReLU 之前的值。ReLU 会把每个负数变成 0。"
    - "W1 的第 1 列是 [−1, 1]，不只是 −1。把它和整个 x 相乘：2×(−1) + 1×1。"
    - "检查顺序：x 是左边的一行，所以 h[1] 用的是 W1 的第 1 列 [−1, 1]：2×(−1) + 1×1。"
    - ["隐藏神经元 1 用的是 W1 的第 1 列：[−1, 1]。", "它的输入是 x[0]·W1[0][1] + x[1]·W1[1][1] + b1[1]。然后用 ReLU：负数变成 0。"]

fwd-out:
  prompt: "h = [2, 0]，W2 = [[2], [−1]]，b2 = 0.5。送进输出 sigmoid 的数 z = h @ W2 + b2 是多少？"
  after: "2×2 + 0×(−1) + 0.5 = 4.5。输出是 σ(4.5) ≈ 0.989，所以网络回答“类别 1”。被 ReLU 设成 0 的那个隐藏神经元什么也没贡献。"
  hints:
    - "你忘了 b2 = 0.5。"
    - "你把 h[1] 当成了 −1。经过 ReLU 之后，h[1] 是 0。"
    - "ReLU 之后 h[1] 是 0，所以权重 −1 什么也贡献不了。用 h = [2, 0]。"
    - ["输出神经元拿隐藏值 h 乘以 W2，再加上 b2。", "z = h[0]·W2[0] + h[1]·W2[1] + b2，其中 W2 = [2, −1]，b2 = 0.5。"]

hidden-shape:
  prompt: "X 存着 50 个样本，每个 2 个数，形状 (50, 2)。W1 是 (2, 16)。H = tanh(X @ W1 + b1) 是什么形状？"
  after: "每个样本一行，每个隐藏单元一列。tanh 和偏置都不改变形状。"
  hints:
    - "那是 W1 的形状。X 每个样本一行：X @ W1 有几行？"
    - "行来自 X，列来自 W1。"
    - ["用形状规则 (n, k) @ (k, m) → (n, m)。tanh 和偏置保持形状不变。", "(50, 2) @ (2, 16)：中间的两个 2 消掉了。剩下哪两个数？"]

width-2:
  prompt: "一个只有 1 个隐藏层、2 个 tanh 单元的网络在两条螺旋上训练。动手之前先猜：它表现如何？"
  options: ["它几乎完美地分开了两条螺旋", "平面上很大一部分它都分错了", "它不比随机乱猜强"]
  reveal: "平面上很大一部分它都分错了。两个单元就是两条直线，各弯一次。这只能把平面分成几块区域，远远不够去跟上两条缠绕的臂。不过它还是比随机乱猜强，因为有些区域大部分是同一种颜色。现在到实验台里试试。"

params-1:
  prompt: "一个 2 → 8 → 1 的网络：2 个输入，一个 8 个单元的隐藏层，1 个输出。它一共有多少个权重和偏置？"
  after: "W1 是 2×8 = 16 个权重，加 8 个偏置。W2 是 8×1 = 8 个权重，加 1 个偏置。16 + 8 + 8 + 1 = 33。"
  hints:
    - "那只是权重（16 + 8）。每个隐藏单元和输出还各有一个偏置。"
    - "那只是 W1。别忘了 W2 和偏置。"
    - ["一层一层地数：每层有（输入数 × 输出数）个权重，再加每个输出一个偏置。", "第一层：2 个输入，8 个输出。第二层：8 个输入，1 个输出。"]

params-deep:
  prompt: "一个 2 → 8 → 8 → 1 的网络：2 个输入，两个各 8 个单元的隐藏层，1 个输出。有多少个权重和偏置？"
  after: "(2×8 + 8) + (8×8 + 8) + (8×1 + 1) = 24 + 72 + 9 = 105。中间那层最贵：宽度 × 宽度。"
  hints:
    - "33 是单隐藏层的网络。把中间那层加上：一个 8 × 8 的权重矩阵，加 8 个偏置。"
    - "很接近：权重你算对了。再加上偏置：8 + 8 + 1。"
    - ["现在有三层权重：2 → 8，8 → 8，8 → 1。", "每层：输入数 × 输出数个权重，再加每个输出一个偏置。把三层加起来。"]

mlp-forward:
  prompt: "写出隐藏层：X @ W1 加 b1，再取 tanh。"
  tests:
    - "一次算两个样本"
    - "原点：只有偏置起作用"
  hints:
    - "检查顺序：X 是 (N, 2)，W1 是 (2, 3)，所以是 X @ W1，不是 W1 @ X。"
    - "这里没有定义单独的 tanh。NumPy 的版本是 np.tanh。"
    - ["三步：X 乘以 W1，加上 b1，再取 tanh。", "先算激活前的值：X 乘以 W1，加上 b1。然后用 NumPy 的 tanh 一次作用到所有元素上。"]
  after: "X @ W1 是 (N, 2) @ (2, 3) → (N, 3)：每个样本一行，每个隐藏单元一列。b1 通过广播加到每一行上，np.tanh 作用在每个元素上。偏置放在 tanh 里面。没有它，原点永远得到 tanh(0) = 0。"

mlp-deep:
  prompt: "写出有两个 ReLU 隐藏层的网络的前向传播，然后返回最后一层的输出（W3 和 b3，没有 sigmoid）。好几行。"
  template: |
    def mlp2(X, W1, b1, W2, b2, W3, b3):
        # 1. 第一个隐藏层  2. 第二个隐藏层  3. 返回输出
        ____

    X = np.array([[2.0, 1.0], [1.0, 3.0]])
    W1 = np.array([[1.0, -1.0], [0.0, 1.0]]); b1 = np.array([0.0, 0.0])
    W2 = np.array([[1.0, -1.0], [1.0, 1.0]]); b2 = np.array([0.0, 1.0])
    W3 = np.array([[2.0], [1.0]]);            b3 = np.array([0.5])
    print("out =", mlp2(X, W1, b1, W2, b2, W3, b3).ravel())
  tests:
    - "x = [2, 1] 得到 H1 = [2, 0]，H2 = [2, 0]，输出 4.5；x = [1, 3] 得到输出 8.5"
    - "在原点只有偏置起作用：H1 = [0, 0]，H2 = [0, 1]，输出 1.5"
    - "50 个样本经过 2 → 8 → 8 → 1，每个样本一个输出，形状 (50, 1)"
  hints:
    - "函数里的每一行前面都要有和第一行一样的 4 个空格。"
    - ["检查每个乘积的顺序：样本在前，X @ W1，然后 H1 @ W2。", "第二层的输入是 H1，不是 X。"]
    - "每个名字都要先算出来再用：先 H1，再由 H1 算 H2。NumPy 里的 ReLU 是 np.maximum(0, …)。"
    - "函数什么也没返回。最后一行的输出前面要加 return。"
    - ["对 x = [2, 1]，先检查 H1：它应该是 [2, 0]。", "在第二个 ReLU 之前，H1 @ W2 + b2 是 [2, −1]。ReLU 有没有把 −1 变成 0？", "输出层没有 ReLU。它用的是 H2、W3 和 b3。", "也检查一下偏置：b1 和 b2 放在 ReLU 里面，b3 在最后加上。"]
    - ["三行：由 X 算 H1，由 H1 算 H2，再由 H2 返回输出。每个隐藏层都是之前那同一行：ReLU(输入 @ W + b)。", "第 1 层用 X、W1、b1。第 2 层用 H1、W2、b2。然后是输出层。"]
  after: "每个隐藏层都是同一行代码 ReLU(输入 @ W + b)，每层拿前一层的输出作输入。最后一层没有 ReLU，所以输出可以是任何数。在 2 → 8 → 8 → 1 的网络里，形状依次是 (N, 2) → (N, 8) → (N, 8) → (N, 1)。"
